<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<title>福祉ボット２</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== 色とかたち ===== */
:root{
  --bg:#edf1eb; --paper:#ffffff; --ink:#1f2a24; --sub:#5b6a61; --rule:#d7dfd6; --soft:#f5f8f4;
  --brand:#2f6b4f; --brand-ink:#ffffff;
  --g1:#3c8a5a; --g1-bg:#e4f1e8;   /* 日々の記録：若竹 */
  --g2:#2e5b88; --g2-bg:#e2ebf4;   /* 支援計画・会議：藍 */
  --g3:#a9741a; --g3-bg:#f6ecd8;   /* アセスメント・採用：山吹 */
  --g4:#8a4767; --g4-bg:#f3e4ec;   /* 届出・報告：葡萄 */
  --warn:#9a5b10; --warn-bg:#fdf1de; --err:#b3352b; --err-bg:#fbe7e5;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --shadow:0 1px 0 var(--rule);
  --on:#fff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121815; --paper:#1a221e; --ink:#e4ebe6; --sub:#9aa9a0; --rule:#2b3630; --soft:#202a25;
    --brand:#4f9a75;
    --g1:#6cc08b; --g1-bg:#1e3328; --g2:#7fa9d6; --g2-bg:#1c2836;
    --g3:#e0ab4f; --g3-bg:#33291a; --g4:#d390b1; --g4-bg:#33222b;
    --warn:#e7b066; --warn-bg:#33281a; --err:#ef8a80; --err-bg:#3a201d;
    --on:#10201a;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
main.wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.no-nav main.wrap{padding-bottom:0}

/* ===== 上部バー ===== */
.top{position:sticky;top:0;z-index:10;background:var(--brand);color:var(--brand-ink);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:8px;height:56px}
.top h1{flex:1;margin:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;margin:0 -6px;border:0;background:transparent;color:inherit;border-radius:50% }
.icon-btn svg{width:24px;height:24px}
.top.group{background:var(--paper);color:var(--ink);border-bottom:1px solid var(--rule)}
.top.group .band{position:absolute;left:0;right:0;bottom:-1px;height:4px;background:var(--gc)}
.progress{height:4px;background:var(--rule);position:absolute;left:0;right:0;bottom:-1px}
.progress i{display:block;height:100%;width:0;background:var(--gc);transition:width .25s}

/* ===== ホーム ===== */
.today{padding:18px 0 6px;display:flex;align-items:center;gap:14px}
.today .logo{width:84px;height:84px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}
.today .date{font-size:26px;font-weight:700;letter-spacing:.02em}
.today .stat{color:var(--sub);font-size:14px;margin-top:2px}
.search{position:relative;display:block;margin:12px 0 4px}
.search input{width:100%;height:48px;padding:0 14px 0 44px;border:1px solid var(--rule);border-radius:var(--r-m);background:var(--paper);color:var(--ink);font:inherit}
.search svg{position:absolute;left:14px;top:13px;width:22px;height:22px;color:var(--sub)}
.sec-title{font-size:14px;color:var(--sub);font-weight:700;margin:20px 0 8px}
.pins{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pin{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--paper);border:1px solid var(--rule);border-left:5px solid var(--gc);border-radius:var(--r-s);font-weight:700;font-size:15px}

/* 見出しタブ（バインダーのインデックス） */
.tabs{display:flex;gap:4px;margin-top:20px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1 0 auto;border:0;padding:10px 8px 9px;border-radius:var(--r-m) var(--r-m) 0 0;background:var(--soft);color:var(--sub);font-weight:700;font-size:13px;border-top:4px solid transparent}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);border-top-color:var(--gc)}
.tabs.mini{margin-top:0;background:var(--soft);border-radius:var(--r-m);padding:4px}.tabs.mini .tab{border-radius:var(--r-s);border-top:0;padding:10px 8px;font-size:14px}.tabs.mini .tab[aria-selected="true"]{box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sheet{background:var(--paper);border-radius:0 var(--r-m) var(--r-m) var(--r-m);border-top:4px solid var(--gc);margin-bottom:24px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 16px;border:0;background:transparent;text-align:left;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row:active{background:var(--soft)}
.row .name{flex:1;font-size:16px}
.row .grp{display:block;font-size:12px;color:var(--sub)}
.chev{width:18px;height:18px;color:var(--sub);flex:0 0 auto}
.tag{flex:0 0 auto;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--warn-bg);color:var(--warn)}
.empty{padding:28px 16px;text-align:center;color:var(--sub)}

/* ===== 入力フォーム ===== */
.form-head{display:flex;justify-content:space-between;align-items:center;padding:14px 0 6px;color:var(--sub);font-size:14px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:var(--r-s);padding:10px 12px;font-size:14px;margin:10px 0}
.note.err{background:var(--err-bg);color:var(--err)}
.field{background:var(--paper);border-radius:var(--r-m);padding:14px;margin-bottom:10px;border:2px solid transparent}
.field.filled{box-shadow:inset 4px 0 0 var(--gc)}
.field.miss{border-color:var(--err)}
.field>label,.field>.label{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;margin-bottom:8px}
.req{font-size:11px;font-weight:700;color:var(--err);background:var(--err-bg);border-radius:4px;padding:1px 6px}
.hint{font-size:12px;color:var(--sub);font-weight:400;margin-left:auto}
.in,select.in,textarea.in{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r-s);background:var(--soft);color:var(--ink);font:inherit}
textarea.in{min-height:120px;resize:vertical;line-height:1.7}
.in:focus{border-color:var(--gc);background:var(--paper);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--gc) 25%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.after{margin-top:8px}
.chip{min-height:44px;padding:8px 14px;border:1px solid var(--rule);border-radius:var(--r-s);background:var(--soft);font-size:15px;text-align:left}
.chip[aria-pressed="true"]{background:var(--gc);border-color:var(--gc);color:var(--on);font-weight:700}
.chip.mini{min-height:36px;padding:4px 12px;font-size:14px}
.picker{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r-s);background:var(--soft);text-align:left}
.picker .ph{color:var(--sub)}
.picker svg{width:18px;height:18px;color:var(--sub);flex:0 0 auto}

.bar{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px;align-items:center}
.saved{font-size:12px;color:var(--sub);flex:1}
.btn{border:0;border-radius:var(--r-m);min-height:52px;padding:0 22px;font-size:16px;font-weight:700}
.btn.p{background:var(--gc,var(--brand));color:var(--on)}
.btn.s{background:var(--paper);border:1px solid var(--rule)}
.btn.wide{width:100% }
.btn:disabled{opacity:.5}

/* ===== 下から出るシート ===== */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.scrim.on{display:block}
.bsheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:var(--r-l) var(--r-l) 0 0;max-height:82vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s ease-out;padding-bottom:env(safe-area-inset-bottom)}
.bsheet.on{transform:none}
.bsheet .grab{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:8px auto 4px}
.bsheet h2{font-size:17px;margin:4px 16px 10px}
.bsheet .body{overflow:auto;padding:0 16px 12px}
.bsheet .foot{display:flex;gap:10px;padding:10px 16px 14px;border-top:1px solid var(--rule)}
.bsheet .foot .btn{flex:1}
.opt{display:block;width:100%;min-height:52px;padding:12px 8px;border:0;border-bottom:1px solid var(--rule);background:transparent;text-align:left;font-size:16px}
.opt[aria-selected="true"]{font-weight:700;color:var(--gc)}
.photo{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo img{width:96px;height:96px;object-fit:cover;border-radius:var(--r-s);border:1px solid var(--rule)}
.photo .pbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;border:1px dashed var(--gc);border-radius:var(--r-s);color:var(--gc);font-weight:700;background:var(--soft);cursor:pointer}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.review dt{font-size:13px;color:var(--sub);margin-top:10px}
.review dd{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}

/* ===== 送信完了 ===== */
.done{text-align:center;padding:48px 0 24px}
.done .mark{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;background:var(--gc);display:grid;place-items:center;color:var(--on)}
.done .mark svg{width:46px;height:46px}
.done h2{margin:0 0 4px;font-size:24px}
.done p{margin:0;color:var(--sub)}
.stack{display:grid;gap:10px;margin-top:24px}

/* ===== 下部ナビ ===== */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;color:var(--sub);text-decoration:none;font-size:11px;position:relative}
.nav a svg{width:24px;height:24px}
.nav a[aria-current="page"]{color:var(--brand);font-weight:700}
.nav .dot{position:absolute;top:4px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:var(--on);font-size:11px;line-height:18px;text-align:center}

.list-item{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:var(--r-m);padding:14px;margin-bottom:8px;border-left:5px solid var(--gc)}
.list-item .main{flex:1;min-width:0}
.list-item .t{font-weight:700}
.list-item .m{font-size:13px;color:var(--sub)}
.link{border:0;background:transparent;color:var(--gc);font-weight:700;padding:8px;text-decoration:none}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r-m);font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90% }
.toast.on{opacity:1;transform:translateX(-50%)}
.busy{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);display:none;place-items:center;text-align:center;padding:24px}
.busy.on{display:grid}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--rule);border-top-color:var(--brand);margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important} }
.g1{--gc:var(--g1);--gbg:var(--g1-bg)} .g2{--gc:var(--g2);--gbg:var(--g2-bg)}
.g3{--gc:var(--g3);--gbg:var(--g3-bg)} .g4{--gc:var(--g4);--gbg:var(--g4-bg)}
.small{font-size:13px;color:var(--sub)}

/* ===== 連絡 ===== */
.sos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sos button{min-height:64px;border:0;border-radius:var(--r-m);color:var(--on);font-size:17px;font-weight:700}
.st-ok{background:#3c8a5a}.st-hurt{background:#c62f22}.st-evac{background:#c98a00}.st-lost{background:#7a4a8a}.st-none{background:#7d8a83}
.counts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.counts div{border-radius:var(--r-s);padding:8px 2px;text-align:center;color:var(--on)}
.counts b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.counts span{font-size:11px}
.box{background:var(--paper);border-radius:var(--r-m);padding:14px 16px;margin-bottom:10px}
.box h3{margin:0 0 4px;font-size:16px}
.box .row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.box .row2 .btn{flex:1 1 140px;min-height:46px;font-size:15px;padding:0 12px}
.who{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.7}
.evt .meta{font-size:13px;color:var(--sub)}
.evt .chips{margin-top:10px}
.admin-mark{font-size:11px;font-weight:700;color:var(--brand);border:1px solid var(--brand);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px}

/* ===== 管理 ===== */
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--rule)}
.task:last-child{border-bottom:0}
.task button.ck{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:2px solid var(--brand);background:transparent;display:grid;place-items:center;color:var(--on)}
.task button.ck[aria-pressed="true"]{background:var(--brand)}
.task button.ck svg{width:18px;height:18px}
.task.done .tx{color:var(--sub);text-decoration:line-through}
.dl{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
.dl .d{font-variant-numeric:tabular-nums;white-space:nowrap}
.red{color:var(--err);font-weight:700}.amber{color:var(--warn);font-weight:700}
.sthumb{width:56px;height:56px;flex:0 0 auto;border-radius:var(--r-s);object-fit:cover;background:var(--soft)}
.stock-n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
.stepper{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0}
.stepper button{width:56px;height:56px;border-radius:50%;border:1px solid var(--rule);background:var(--soft);font-size:26px}
.stepper input{width:110px;text-align:center;font-size:30px;font-weight:700;border:0;background:transparent;color:var(--ink)}
table.mt{width:100%;border-collapse:collapse;font-size:14px;background:var(--paper);border-radius:var(--r-m);overflow:hidden}
table.mt th,table.mt td{padding:8px 6px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
table.mt th:first-child,table.mt td:first-child{text-align:left}
table.mt th{font-size:12px;color:var(--sub);font-weight:700}
.tscroll{overflow-x:auto;border-radius:var(--r-m)}

/* ===== 情報を見る ===== */
.heat{display:block;color:inherit;text-decoration:none;background:var(--paper);border-radius:var(--r-l);padding:18px 18px 16px;margin-top:16px;border-top:6px solid var(--lv)}
.heat .row1{display:flex;align-items:baseline;gap:12px}
.heat .num{font-size:52px;font-weight:700;line-height:1;color:var(--lv);font-variant-numeric:tabular-nums}
.heat .lvname{font-size:20px;font-weight:700}
.heat .meta{color:var(--sub);font-size:13px;margin-top:6px}
.scale{display:grid;grid-template-columns:21fr 4fr 3fr 3fr 4fr;gap:2px;margin-top:14px}
.scale span{height:8px;border-radius:2px;opacity:.35}
.scale span.on{opacity:1;height:12px;margin-top:-2px}
.scale-l{display:grid;grid-template-columns:21fr 4fr 3fr 3fr 4fr;gap:2px;font-size:11px;color:var(--sub);margin-top:4px}
.card{background:var(--paper);border-radius:var(--r-m);padding:14px 16px;margin-bottom:10px;border-left:5px solid var(--gc)}
.card .d{font-size:12px;color:var(--sub)}
.card .t{font-weight:700;margin:2px 0 4px;line-height:1.5}
.card .b{white-space:pre-wrap;word-break:break-word;font-size:14px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.open .b{display:block}
.card .acts{display:flex;gap:4px;margin:6px -8px -6px;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;background:var(--gbg);color:var(--gc);margin-left:6px;vertical-align:2px}
.wb{display:inline-block;min-width:52px;text-align:center;font-weight:700;color:#fff;border-radius:var(--r-s);padding:4px 8px;margin-right:10px;font-variant-numeric:tabular-nums}
.thumb{width:112px;height:63px;object-fit:cover;border-radius:6px;flex:0 0 auto;background:var(--soft)}
.step{display:grid;grid-template-columns:40px 1fr;gap:12px;background:var(--paper);border-radius:var(--r-m);padding:14px;margin-bottom:10px}
.step .n{width:36px;height:36px;border-radius:50%;background:var(--gc);color:var(--on);display:grid;place-items:center;font-weight:700}
.step img{width:100%;max-height:240px;object-fit:contain;border-radius:var(--r-s);margin-top:8px;background:var(--soft)}
.step .b{white-space:pre-wrap;font-size:15px;margin-top:4px}
.hz-chips{margin:0 0 8px}
.hz-legend{background:var(--paper);border-radius:var(--r-s);padding:8px 10px;margin:0 0 8px;color:var(--sub);display:grid;gap:4px;line-height:1.5}
.train{background:var(--paper);border-radius:var(--r-m);padding:12px 14px;margin-bottom:8px;border-left:5px solid var(--sub)}
.train.ok{border-left-color:var(--g1)}.train.ng{border-left-color:var(--err);background:var(--err-bg)}
.train-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.train-st{font-weight:700}.train.ok .train-st{color:var(--g1)}.train.ng .train-st{color:var(--err)}
.train-d{font-size:14px;margin-top:6px;line-height:1.6}.train-f{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12.5px;color:var(--sub)}
.pmap-wrap{position:relative;margin:0 0 10px}
.pmap{height:300px;border-radius:var(--r-m);overflow:hidden;background:var(--soft);border:1px solid var(--rule);z-index:0}
.pmap-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:14px;pointer-events:none}
.pmap-bar{display:flex;align-items:center;gap:10px;margin:0 0 10px}.pmap-bar .btn{min-height:44px;padding:0 16px;font-size:15px}.pmap-bar .small{color:var(--sub)}
.pill.near{background:var(--g2-bg);color:var(--g2)}
.leaflet-popup-content{font-size:14px;line-height:1.5}
.place .addr{font-size:14px;color:var(--sub)}
.place details{margin-top:8px;font-size:14px}
.place summary{cursor:pointer;color:var(--gc);font-weight:700;padding:4px 0}
.place ul{margin:6px 0 0;padding-left:18px}
.lines{list-style:none;margin:8px 0 0;padding:0}.lines li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px dashed var(--rule)}.lines li b{white-space:nowrap}
.kv{margin:8px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:6px 12px}.kv dt{color:var(--sub);font-size:13px}.kv dd{margin:0;white-space:pre-wrap}
.hf-path{font-size:13px;color:var(--sub);margin:0 0 10px}.hf-now{background:var(--paper);border-radius:var(--r-m);padding:14px;box-shadow:var(--shadow)}
.hf-ans{display:grid;gap:10px}.hf-call{display:grid;place-items:center;text-decoration:none;margin:12px 0;--gc:var(--err);font-size:18px}
.only-member{display:none!important}body.member .nav .wrap{grid-template-columns:1fr 1fr}body.member .only-member{display:flex!important}body.member .no-member{display:none!important}

/* ================= サーバー呼び出し（GETのみ） ================= */
async function api(params, override){
  if (isDemo()) return demoApi(params);
  if (authPending && AUTH && params.app !== 'me' && !override) await AUTH;
  const c = override || cfg;
  const auth = idToken && !override ? { idt:idToken } : { key:c.key };
  const url = c.url + '?' + new URLSearchParams({ ...params, ...auth });
  if (url.length > 7500) throw new Error('文章が長すぎて一度に送れません（約' + url.length + '文字）。長い欄を少し短くしてください。');
  let r;
  try { r = await fetch(url); } catch (e) { throw new Error('通信できませんでした。電波の良い場所でもう一度お試しください。'); }
  const j = await r.json().catch(() => { throw new Error('サーバーの応答を読み取れませんでした。設定のURLを確認してください。'); });
  if (!j.ok) throw new Error(j.error || 'エラーが発生しました');
  return j;
}

async function apiPost(body){
  if (isDemo()) return demoApi(body);
  if (authPending && AUTH) await AUTH;
  let r;
  const auth = idToken ? { idt:idToken } : { key:cfg.key };
  try { r = await fetch(cfg.url, { method:'POST', body: JSON.stringify({ ...body, ...auth }) }); }
  catch (e) { throw new Error('通信できませんでした。電波の良い場所でもう一度お試しください。'); }
  const j = await r.json().catch(() => { throw new Error('サーバーの応答を読み取れませんでした。少し待ってからもう一度お試しください。'); });
  if (!j.ok) throw new Error(j.error || 'エラーが発生しました');
  return j;
}

/* 写真を縮小してから送る（長い辺 1280px・JPEG） */
function shrinkImage(file, maxSize){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = maxSize || 1280, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const dataUrl = c.toDataURL('image/jpeg', 0.8);
      resolve({ dataUrl, b64: dataUrl.split(',')[1], mime:'image/jpeg' });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('この写真は読み込めませんでした')); };
    img.src = url;
  });
}

    if(ctx.expl==="ng") pending.push("本人・家族への説明・了解");

/* 結果のあとに出す「記録する」帳票（存在する帳票だけ表示・スタッフのみ） */
const MN_NEXT = {
  injury:['事故報告書', 'ヒヤリハット報告書', '家族連絡記録'], heat:['事故報告書', 'ヒヤリハット報告書'],
  fire:['事故報告書'], quake:['事故報告書'], health:['感染症報告', '検温管理', '待機期間管理'],
  abuse:['虐待チェックシート'], rs:['支援経過記録'], comp:['支援経過記録', '家族連絡記録'], cust:['ヒヤリハット報告書']
};
const MN_TONE = { danger:'すぐ対応', warn:'注意して対応', ok:'対応の目安', info:'案内' };
let MN = { cat:null, stack:[], answers:[], lastLog:'' };
const mnContacts = () => Object.assign({}, MN_CONTACTS_DEFAULT, LS.get('fb_mn_contacts', {}));
const mnCtx = () => MN.stack.length ? MN.stack[MN.stack.length - 1].ctx : {};
function mnTmpl(t){
  if (!t) return t;
  const C = mnContacts();
  return t.replace(/\{\{(.+?)\}\}/g, (m, k) => mnCtx()[k] != null ? mnTmpl(mnCtx()[k]) : C[k] != null ? C[k] : '');
}
/* 電話番号をタップ発信リンクに（「人権110番」の110は除外） */
function mnPhones(html){
  const tl = (n, l) => `<a class="mn-tel" href="tel:${n}">${l}</a>`;
  html = html.replace(/0570-003-110/g, tl('0570003110', '0570-003-110')).replace(/人権110番/g, '人権11\u00010番')
    .replace(/119番/g, tl('119', '119番')).replace(/110番/g, tl('110', '110番')).replace(/#9110/g, tl('9110', '#9110')).replace(/189（/g, tl('189', '189') + '（');
  return html.replace(/\u0001/g, '');
}
const mnShort = q => { const l = (q.split('\n').pop() || q).replace(/^[【\s]*/, ''); const m = l.match(/[^。]*？/); return (m ? m[0] : l).replace(/^[^\p{L}\p{N}（【]+/u, '').slice(0, 32); };
const mnEntry = () => `<a class="mn-entry" href="#/manual"><span class="ic" aria-hidden="true">🚨</span><span><b>緊急・対応マニュアル</b><small>ケガ・熱中症・火災・地震・体調／ハラスメント・虐待・苦情</small></span>${ICON.chev}</a>`;
const mnMenuFor = () => MN_MENU.filter(m => !(m.staff && isMember()));

function showManual(arg){
  const m = arg ? MN_MENU.find(x => x.key === arg) : null;
  if (m && !(m.staff && isMember())) {
    setTop({ title: m.title, back:true });
    MN.cat = m; MN.stack = [{ id:m.to, ctx:{} }]; MN.answers = [];
    mnRender();
  } else mnMenu();
  if (signedIn()) api({ app:'manualConf' }).then(j => { if (j && j.contacts) LS.set('fb_mn_contacts', j.contacts); }).catch(() => {});
}

function mnMenu(){
  setTop({ title:'緊急・対応マニュアル', back: true });
  let html = `<div class="mn-call"><span>緊急時はまず通報</span><a href="tel:119">119</a><a href="tel:110">110</a></div>`;
  html += `<a class="mn-entry" href="#/info/shelter" style="border-color:var(--g2);background:var(--g2-bg)"><span class="ic" aria-hidden="true">🗺</span><span><b style="color:var(--g2)">ハザードマップ・避難場所</b><small>浸水・土砂災害・津波の区域と避難場所を地図で</small></span>${ICON.chev}</a>`;
  let cur = '';
  html += trainBox();
  mnMenuFor().forEach(m => {
    if (m.group !== cur) { if (cur) html += '</div>'; html += `<div class="sec-title">${esc(m.group)}</div><div class="mn-grid">`; cur = m.group; }
    html += `<a class="mn-tile${m.group === '緊急・災害' ? ' em' : ''}" href="#/manual/${m.key}"><span class="ic" aria-hidden="true">${m.icon}</span><b>${esc(m.title)}</b><small>${esc(m.desc)}</small></a>`;
  });

  if (isAdmin()) mnLogs();

async function mnLogs(){
  const token = viewToken;
  try {
    const j = await api({ app:'manualLogs' });
    if (token !== viewToken || !$('mnLogs')) return;
    const rows = j.rows || [];
    $('mnLogs').innerHTML = `<div class="sec-title">最近の対応記録（管理者）</div>${rows.length ? rows.map(r =>
      `<div class="card mn-log ${r.tone || 'info'}"><div class="mn-log-h"><b>${esc(r.category)}</b><span>${esc(r.date)}${r.name ? '　' + esc(r.name) : ''}</span></div>
       <div class="small">${esc(r.summary)}</div><div class="mn-log-r">${esc(MN_TONE[r.tone] || '')}：${esc(String(r.result || '').slice(0, 80))}</div></div>`).join('')
      : '<div class="empty">まだ記録はありません</div>'}`;
  } catch (e) {}
}

function mnRender(){
  const top = MN.stack[MN.stack.length - 1];
  let node = MN_NODES[top.id];
  if (node.build) { const r = MN_BUILDERS[node.build](mnCtx()); node = { result:true, text:r.text, tone:r.tone }; }
  const c = MN.cat;
  let html = `<div class="mn-head"><span class="ic" aria-hidden="true">${c.icon}</span><b>${esc(c.title)}</b><span class="mn-step">${node.result ? '対応の目安' : '質問 ' + (MN.answers.length + 1)}</span></div>`;
  if (MN.answers.length) html += `<ol class="mn-ans">${MN.answers.map(a => `<li><span>${esc(a.q)}</span><b>${esc(a.a)}</b></li>`).join('')}</ol>`;
  if (!node.result) {
    const t = mnTmpl(node.q).split('\n\n');
    const q = t.pop();
    if (t.length) html += `<div class="mn-guide">${mnPhones(esc(t.join('\n\n')))}</div>`;
    html += `<div class="mn-q">${mnPhones(esc(q))}</div><div class="mn-opts">${node.options.map((o, i) => `<button class="btn s wide mn-opt" data-i="${i}">${esc(o.label)}</button>`).join('')}</div>`;
  } else {
    const tone = node.tone || 'info';
    html += `<div class="mn-result ${tone}"><div class="mn-rl">${esc(MN_TONE[tone] || '')}</div>${mnPhones(esc(mnTmpl(node.text)))}</div>`;
    const nums = tone === 'danger' ? ['119', '110'].filter(n => mnTmpl(node.text).replace(/人権110番/g, '').includes(n + '番')) : [];
    if (nums.length) html += `<div class="mn-calls">${nums.map(n => `<a class="btn p" href="tel:${n}" style="--gc:var(--err)">📞 ${n}番に電話</a>`).join('')}</div>`;
    html += `<div id="mnLogNote" class="small" style="color:var(--sub);margin:8px 2px"></div>`;
    const forms = getForms() || [];
    const next = isMember() ? [] : (MN_NEXT[c.key] || []).filter(s => forms.some(f => f.sheet === s));
    if (next.length) html += `<div class="sec-title">続けて記録する</div><div class="mn-next">${next.map(s =>
      `<a class="row" href="#/form/${encodeURIComponent(s)}" style="color:inherit;text-decoration:none"><span class="name">${esc(s)}</span>${ICON.chev}</a>`).join('')}</div>
      <button class="btn s wide" id="mnCopy" style="margin-top:8px">経過をコピー（記録に貼り付け用）</button>`;
    if (c.key === 'quake' || c.key === 'fire') html += `<div class="mn-nav" style="margin-top:10px"><a class="btn s" href="#/info/shelter">🗺 避難場所の地図</a><a class="btn s" href="#/contact">安否を報告する</a></div>`;
  }
  html += `<div class="mn-nav">${MN.stack.length > 1 ? '<button class="btn s" id="mnBack">ひとつ戻る</button>' : ''}<button class="btn s" id="mnRestart">最初から</button><a class="btn s" href="#/manual">メニュー</a></div>`;
  $('view').innerHTML = html;
  window.scrollTo(0, 0);
  $('view').querySelectorAll('.mn-opt').forEach(b => b.onclick = () => {
    const opt = node.options[Number(b.dataset.i)];
    MN.answers.push({ q: mnShort(mnTmpl(node.q)), a: opt.label });
    MN.stack.push({ id: opt.to, ctx: Object.assign({}, mnCtx(), opt.set || {}) });
    mnRender();
  });
  if ($('mnBack')) $('mnBack').onclick = () => { MN.stack.pop(); MN.answers.pop(); mnRender(); };
  $('mnRestart').onclick = () => { MN.stack = [MN.stack[0]]; MN.answers = []; mnRender(); };
  if ($('mnCopy')) $('mnCopy').onclick = async () => {
    const txt = `【${c.title}】` + ymd() + '\n' + MN.answers.map(a => '・' + a.q + '→' + a.a).join('\n') + '\n対応：' + mnTmpl(node.text);
    try { await navigator.clipboard.writeText(txt); toast('コピーしました。記録の欄に貼り付けてください'); } catch (e) { toast('コピーできませんでした'); }
  };
  if (node.result) mnLog(node);
}

/* 結果をスプレッドシートへ（失敗しても手順は止めない） */
async function mnLog(node){
  const c = MN.cat;
  const summary = MN.answers.map(a => a.q + '→' + a.a).join(' / ');
  const sig = c.key + '|' + summary;
  const note = t => { if ($('mnLogNote')) $('mnLogNote').textContent = t; };
  if (sig === MN.lastLog) return;
  if (!signedIn()) { note('ログインしていないため、記録は残りません。'); return; }
  MN.lastLog = sig;
  try {
    const j = await apiPost({ app:'manualLog', group:c.group, category:c.title, mk:c.key, tone:node.tone || 'info', summary, result:mnTmpl(node.text) });
    note((c.group === '権利・福祉' ? '名前を付けずに記録しました。' : '記録しました。') + (j.notified ? '管理者へ通知しました。' : ''));
  } catch (e) { MN.lastLog = ''; note('記録できませんでした（' + e.message + '）'); }
}

/* 署名パッド：指・ペン・マウス。保存時は余白を切り取ったPNG */
function sigPad(c){
  const ctx = c.getContext('2d'); let drawing = false, dirty = false, last = null;
  const fit = () => { const r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1; const old = dirty ? c.toDataURL() : null; c.width = r.width * d; c.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; ctx.lineWidth = 2.6; if (old) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = old; } };
  fit();
  const pt = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top, e.pressure || .5]; };
  c.addEventListener('pointerdown', e => { e.preventDefault(); c.setPointerCapture(e.pointerId); drawing = true; last = pt(e); ctx.beginPath(); ctx.arc(last[0], last[1], 1.2, 0, Math.PI * 2); ctx.fillStyle = '#111'; ctx.fill(); dirty = true; c.classList.add('on'); });
  c.addEventListener('pointermove', e => { if (!drawing) return; e.preventDefault(); const p = pt(e); ctx.lineWidth = e.pointerType === 'pen' ? 1.4 + p[2] * 2.6 : 2.6; ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; });
  const end = () => { drawing = false; };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end); c.addEventListener('pointerleave', end);
  return {
    el: c, empty: () => !dirty,
    clear(){ ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height); ctx.restore(); dirty = false; c.classList.remove('on'); },
    png(){
      const w = c.width, h = c.height, d = ctx.getImageData(0, 0, w, h).data;
      let x0 = w, y0 = h, x1 = 0, y1 = 0;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 < x0) return '';
      const pad = 8 * (window.devicePixelRatio || 1); x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w, x1 + pad); y1 = Math.min(h, y1 + pad);
      const o = document.createElement('canvas'); o.width = x1 - x0; o.height = y1 - y0;
      o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
      return o.toDataURL('image/png');
    }
  };
}

/* ================= 衛生管理の記録（店舗のHACCP＋事業所の衛生・感染対策） ================= */
let EI = { tab:'day', place: '', date:'', ym:'', vals:{} };
const eiJudge = (it, v) => {
  if (it.type !== 'temp' || v === '' || v == null) return v === '×' ? 'ng' : v ? 'ok' : '';
  const n = Number(String(v).replace(/[^\d.\-]/g, '')); const m = String(it.rule || '').match(/^(<=|>=|<|>)\s*(-?[\d.]+)/);
  if (isNaN(n) || !m) return 'ok';
  const t = Number(m[2]); return (m[1] === '<=' ? n <= t : m[1] === '>=' ? n >= t : m[1] === '<' ? n < t : n > t) ? 'ok' : 'ng';
};
async function showEisei(){
  setTop({ title:'衛生管理の記録', back:true });
  EI.place = EI.place || LS.get('fb_ei_place', '');
  EI.date = EI.date || ymd().replace(/\//g, '-');
  EI.ym = EI.ym || EI.date.slice(0, 7);
  if (EI.tab === 'month') return eiMonth();
  const token = viewToken;
  $('view').innerHTML = '<div class="empty">読み込んでいます…</div>';
  try { const j = await api({ app:'eisei', place: EI.place, date: EI.date }); if (token !== viewToken) return; EI.place = j.place; LS.set('fb_ei_place', j.place); eiDay(j); }
  catch (e) { if (token === viewToken) $('view').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
}
function eiHead(places){
  return `<div class="tabs mini" role="tablist" style="margin:12px 0 10px">${[['day', '記録する'], ['month', '月の記録表']].map(([k, l]) => `<button class="tab" role="tab" data-et="${k}" aria-selected="${k === EI.tab}">${l}</button>`).join('')}</div>
    <div class="chips" style="margin-bottom:10px">${(places || []).map(p => `<button class="chip" data-ep="${esc(p.name)}" aria-pressed="${p.name === EI.place}" style="--gc:${p.kind === '店舗' ? 'var(--g3)' : 'var(--g2)'}">${esc(p.name)}</button>`).join('')}</div>`;
}
function eiBindHead(){
  $('view').querySelectorAll('[data-et]').forEach(b => b.onclick = () => { EI.tab = b.dataset.et; showEisei(); });
  $('view').querySelectorAll('[data-ep]').forEach(b => b.onclick = () => { EI.place = b.dataset.ep; LS.set('fb_ei_place', EI.place); showEisei(); });
}
function eiDay(j){
  EI.vals = {};
  j.items.forEach(i => { EI.vals[i.name] = { result: i.result || '', note: i.memo || '' }; });
  const daily = j.items.filter(i => i.freq === '毎日'), other = j.items.filter(i => i.freq !== '毎日');
  const done = daily.filter(i => i.result).length;
  const card = i => {
    const v = EI.vals[i.name], st = eiJudge(i, v.result);
    const ctl = i.type === 'temp'
      ? `<div class="ei-temp"><input type="number" inputmode="decimal" step="0.1" data-tv="${esc(i.name)}" value="${esc(v.result)}" placeholder="—"><span>℃</span><small>基準 ${esc(String(i.rule).replace('<=', '').replace('>=', '') + (/^</.test(i.rule) ? '℃以下' : /^>/.test(i.rule) ? '℃以上' : ''))}</small></div>`
      : `<div class="ei-ox"><button data-ok="${esc(i.name)}" aria-pressed="${v.result === '○'}">○ できた</button><button data-ng="${esc(i.name)}" aria-pressed="${v.result === '×'}">× できなかった</button></div>`;
    return `<div class="ei-card ${st}" data-card="${esc(i.name)}"><div class="ei-t"><b>${esc(i.name)}</b>${i.freq !== '毎日' ? `<span class="ei-f">${esc(i.freq)}</span>` : ''}</div>
      ${i.note ? `<div class="ei-n">${esc(i.note)}</div>` : ''}
      ${i.freq !== '毎日' ? `<div class="ei-n" style="color:${i.due ? 'var(--warn)' : 'var(--sub)'}">${i.last ? '前回 ' + esc(i.last.slice(5).replace('-', '/')) : 'まだ記録がありません'}${i.next ? '　次の目安 ' + esc(i.next.slice(5).replace('-', '/')) : ''}${i.due ? '　← そろそろ実施' : ''}</div>` : ''}
      ${ctl}
      <textarea class="ei-memo" data-memo="${esc(i.name)}" placeholder="できなかった・基準外のとき：どう対応したか（必須）" ${st === 'ng' || v.note ? '' : 'hidden'}>${esc(v.note)}</textarea>
      ${i.who ? `<div class="ei-who">記録：${esc(i.who)}</div>` : ''}</div>`;
  };
  let html = eiHead(j.places) + `<div class="ei-date"><input type="date" id="eiDate" value="${esc(j.date)}"><span>${done}/${daily.length} 記録済み</span></div>
    <div class="sec-title">毎日の点検</div>${daily.map(card).join('') || '<div class="empty">毎日の項目はありません</div>'}
    ${other.length ? `<div class="sec-title">毎週・毎月・定期（委員会・研修など）</div>${other.map(card).join('')}` : ''}
    <p class="small" style="color:var(--sub);margin:10px 2px 90px">項目は「衛生チェック項目」シートで増やしたり直したりできます。</p>
    <div class="bar" style="position:sticky;bottom:calc(var(--nav-h, 64px) + 8px)"><span class="saved" id="eiCount"></span><button class="btn p" id="eiSave">記録する</button></div>`;
  $('view').innerHTML = html;
  eiBindHead();
  const refresh = name => {
    const it = j.items.find(i => i.name === name), c = $('view').querySelector(`[data-card="${CSS.escape(name)}"]`), v = EI.vals[name], st = eiJudge(it, v.result);
    c.classList.remove('ok', 'ng'); if (st) c.classList.add(st);
    c.querySelectorAll('[data-ok],[data-ng]').forEach(b => b.setAttribute('aria-pressed', (b.dataset.ok && v.result === '○') || (b.dataset.ng && v.result === '×')));
    const m = c.querySelector('.ei-memo'); m.hidden = !(st === 'ng' || v.note);
    if (st === 'ng' && !v.note) m.focus();
    $('eiCount').textContent = Object.keys(EI.vals).filter(k => EI.vals[k].result).length + '項目 入力中';
  };
  $('view').querySelectorAll('[data-ok]').forEach(b => b.onclick = () => { const v = EI.vals[b.dataset.ok]; v.result = v.result === '○' ? '' : '○'; refresh(b.dataset.ok); });
  $('view').querySelectorAll('[data-ng]').forEach(b => b.onclick = () => { const v = EI.vals[b.dataset.ng]; v.result = v.result === '×' ? '' : '×'; refresh(b.dataset.ng); });
  $('view').querySelectorAll('[data-tv]').forEach(i => i.oninput = () => { EI.vals[i.dataset.tv].result = i.value; refresh(i.dataset.tv); });
  $('view').querySelectorAll('[data-memo]').forEach(t => t.oninput = () => { EI.vals[t.dataset.memo].note = t.value; });
  $('eiDate').onchange = e => { EI.date = e.target.value || EI.date; showEisei(); };
  $('eiSave').onclick = () => {
    const rows = Object.keys(EI.vals).filter(k => EI.vals[k].result !== '').map(k => ({ item: k, result: EI.vals[k].result, note: EI.vals[k].note }));
    if (!rows.length) { toast('まだ何も入力されていません'); return; }
    const miss = rows.find(r => eiJudge(j.items.find(i => i.name === r.item), r.result) === 'ng' && !String(r.note || '').trim());
    if (miss) { toast('「' + miss.item + '」の対応を書いてください'); const c = $('view').querySelector(`[data-card="${CSS.escape(miss.item)}"] .ei-memo`); c.hidden = false; c.focus(); return; }
    runAction(() => apiPost({ app:'eiseiSave', place: j.place, date: j.date, rows }), () => showEisei());
  };
  $('eiCount').textContent = daily.length - done ? `あと${daily.length - done}項目` : '今日の毎日の点検は完了';
}
async function eiMonth(){
  const token = viewToken;
  $('view').innerHTML = '<div class="empty">読み込んでいます…</div>';
  let j;
  try { j = await api({ app:'eiseiMonth', place: EI.place, ym: EI.ym }); } catch (e) { if (token === viewToken) $('view').innerHTML = `<div class="note err">${esc(e.message)}</div>`; return; }
  if (token !== viewToken) return;
  EI.place = j.place;
  const [y, m] = j.ym.split('-').map(Number), last = new Date(y, m, 0).getDate();
  const cell = {}; j.records.forEach(r => cell[r.date + '|' + r.item] = r);
  const nums = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮'.split('');
  const notes = j.records.filter(r => r.note).sort((a, b) => a.date.localeCompare(b.date));
  const whos = {}; j.records.forEach(r => { (whos[r.date] = whos[r.date] || new Set()).add(r.who); });
  const shift = d => { const t = new Date(y, m - 1 + d, 1); EI.ym = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0'); eiMonth(); };
  let html = eiHead(j.places) + `<div class="ei-mnav"><button class="btn s" id="eiPrev">‹ 前の月</button><b>${y}年${m}月</b><button class="btn s" id="eiNext">次の月 ›</button></div>
    <div class="ei-print"><h2 class="ei-ptitle">衛生管理 月次記録表　${esc(j.place)}　${y}年${m}月</h2>
    <div class="ei-scroll"><table class="ei-tbl"><thead><tr><th>日</th>${j.items.map((it, i) => `<th title="${esc(it.name)}">${nums[i] || i + 1}</th>`).join('')}<th>記録者</th></tr></thead><tbody>
    ${Array.from({ length: last }, (_, k) => { const d = j.ym + '-' + String(k + 1).padStart(2, '0'), wd = new Date(y, m - 1, k + 1).getDay();
      return `<tr class="${wd === 0 ? 'sun' : wd === 6 ? 'sat' : ''}"><td>${k + 1}<small>${'日月火水木金土'[wd]}</small></td>${j.items.map(it => { const r = cell[d + '|' + it.name]; return `<td class="${r && r.ng ? 'ng' : ''}">${r ? esc(r.result) : ''}</td>`; }).join('')}<td class="who">${whos[d] ? esc([...whos[d]].join('・')) : ''}</td></tr>`; }).join('')}
    </tbody></table></div>
    <ol class="ei-legend">${j.items.map((it, i) => `<li><b>${nums[i] || i + 1}</b> ${esc(it.name)}${it.type === 'temp' ? '（℃・基準 ' + esc(it.rule) + '）' : ''}</li>`).join('')}</ol>
    <div class="sec-title">特記事項（できなかった・基準外のときの対応）</div>
    ${notes.length ? `<ul class="ei-notes">${notes.map(r => `<li><b>${esc(r.date.slice(5).replace('-', '/'))} ${esc(r.item)}</b>（${esc(r.result)}）${esc(r.note)}<small>　${esc(r.who)}</small></li>`).join('')}</ul>` : '<div class="small" style="color:var(--sub)">ありません</div>'}
    <div class="ei-sign">確認者：＿＿＿＿＿＿＿＿　　確認日：　　年　　月　　日</div></div>
    <button class="btn p wide" id="eiPrint" style="margin:14px 0 24px">🖨 印刷・PDFにする</button>`;
  $('view').innerHTML = html;
  eiBindHead();
  $('eiPrev').onclick = () => shift(-1); $('eiNext').onclick = () => shift(1);
  $('eiPrint').onclick = () => { document.body.classList.add('ei-printing'); setTimeout(() => { window.print(); document.body.classList.remove('ei-printing'); }, 50); };
}

async function sgZip(buf){

const sgCellRe = ref => new RegExp('<c r="' + ref + '"(\\s[^>]*?)?(?:/>|>([\\s\\S]*?)</c>)');

  if (m[2] && /<f[\s>]/.test(m[2])) throw new Error('セル ' + ref + ' は数式のため書き込みませんでした');

/* 選んだファイルが Excel（.xlsx）かを中身で確かめる（スマホでは名前に .xlsx が付かないことがある） */

  const buf = await f.arrayBuffer(), u = new Uint8Array(buf.slice(0, 8));

  if (isXls) throw new Error('古い形式の Excel（.xls）です。Excel で開いて「名前を付けて保存」→「Excel ブック（.xlsx）」で保存し直してから選んでください。');

  if (!/\.xlsx$/i.test(name)) name = name.replace(/\.[^.]*$/, '') + '.xlsx';
  return { buf, name };
}

   ・送迎実績状況表（市別紙23）… 打刻ログの「送迎:往復／往／復」から毎月
   ・加算の届出書 … 様式第６号＋国別紙１（該当行）＋各別紙（いまは送迎加算＝国別紙48） */
const KS_TPL = { pref_A:'福岡県（A型）加算届出書', city_A:'福岡市 A型', city_B:'福岡市 B型' };
const KS_SVC = { A:'就労継続支援Ａ型', B:'就労継続支援Ｂ型' };

const ksYmLabel = ym => { const [y, m] = ym.split('-').map(Number); return `令和${y - 2018}年${m}月`; };

/* ---------- 汎用：.xlsx の読み書き（ブラウザで XML を直接書き換える） ---------- */
async function xlOpen(buf, need){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', () => window.JSZip);
  const zip = await JSZip.loadAsync(buf);
  const wb = await zip.file('xl/workbook.xml').async('string'), rels = await zip.file('xl/_rels/workbook.xml.rels').async('string');
  const map = {}, order = [];
  for (const m of wb.matchAll(/<sheet\b[^>]*?name="([^"]+)"[^>]*?r:id="([^"]+)"/g)) {
    const t = rels.match(new RegExp('<Relationship[^>]*Id="' + m[2] + '"[^>]*Target="([^"]+)"')) || rels.match(new RegExp('<Relationship[^>]*Target="([^"]+)"[^>]*Id="' + m[2] + '"'));
    const name = sgXmlUnesc(m[1]);
    if (t) { map[name] = 'xl/' + t[1].replace(/^\/?xl\//, '').replace(/^\//, ''); order.push(name); }
  }
  (need || []).forEach(n => { if (!xlFind(map, n)) throw new Error('この Excel には「' + n + '」のシートがありません（様式を確かめてください）'); });
  return { zip, map, order };
}
/* シート名は全角・半角や空白の違いをゆるく照合する */
const xlNorm = s => String(s).normalize('NFKC').replace(/[\s　]/g, '').replace(/[ー－‐−-]/g, '-');
function xlFind(map, name){
  if (map[name]) return name;
  const n = xlNorm(name);
  return Object.keys(map).find(k => xlNorm(k) === n) || '';
}
async function xlReader(zip, map){
  const ssx = zip.file('xl/sharedStrings.xml') ? await zip.file('xl/sharedStrings.xml').async('string') : '';
  const ss = [...ssx.matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m => sgXmlUnesc([...m[1].replace(/<rPh\b[\s\S]*?<\/rPh>/g, '').matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x => x[1]).join('')));
  const cache = {};
  return async (sheet, ref) => {
    const path = map[xlFind(map, sheet)];
    const x = cache[path] || (cache[path] = await zip.file(path).async('string'));
    const m = x.match(sgCellRe(ref)); if (!m || !m[2]) return '';
    const t = ((m[1] || '').match(/\st="([^"]+)"/) || [])[1], v = (m[2].match(/<v>([\s\S]*?)<\/v>/) || [])[1];
    if (t === 's') return ss[Number(v)] || '';
    if (t === 'inlineStr') return sgXmlUnesc([...m[2].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x => x[1]).join(''));
    if (v == null) return '';
    return t === 'str' || t === 'e' ? sgXmlUnesc(v) : (isNaN(Number(v)) ? sgXmlUnesc(v) : Number(v));
  };
}
const xlCol = ref => { const s = ref.match(/^[A-Z]+/)[0]; let n = 0; for (const ch of s) n = n * 26 + ch.charCodeAt(0) - 64; return n; };
const xlColName = n => { let s = ''; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; };
/* セルの値を書き換える（無いセル・行は作る。数式のセルには書かない） */
function xlSet(x, ref, v){
  const cellXml = attrs => {
    if (v === '' || v == null) return `<c r="${ref}"${attrs}/>`;
    if (typeof v === 'number') return `<c r="${ref}"${attrs}><v>${v}</v></c>`;
    return `<c r="${ref}"${attrs} t="inlineStr"><is><t xml:space="preserve">${sgXmlEsc(v)}</t></is></c>`;
  };
  const m = x.match(sgCellRe(ref));
  if (m) {
    if (m[2] && /<f[\s>]/.test(m[2])) return x;   // 数式は残す
    return x.replace(m[0], cellXml((m[1] || '').replace(/\s+t="[^"]*"/, '')));
  }
  if (v === '' || v == null) return x;
  const r = Number(ref.match(/\d+$/)[0]), col = xlCol(ref);
  const rowRe = new RegExp('<row r="' + r + '"([^>]*?)(/>|>([\\s\\S]*?)</row>)');
  const rm = x.match(rowRe);
  if (rm) {
    if (rm[2] === '/>') return x.replace(rm[0], `<row r="${r}"${rm[1]}>${cellXml('')}</row>`);
    let body = rm[3], done = false;
    body = body.replace(/<c r="([A-Z]+)\d+"/g, (all, c) => { if (!done && xlCol(c) > col) { done = true; return cellXml('') + all; } return all; });
    if (!done) body += cellXml('');
    return x.replace(rm[0], `<row r="${r}"${rm[1]}>${body}</row>`);
  }
  // 行が無い：番号順の位置に入れる
  let placed = false;
  x = x.replace(/<row r="(\d+)"/g, (all, n) => { if (!placed && Number(n) > r) { placed = true; return `<row r="${r}">${cellXml('')}</row>` + all; } return all; });
  if (!placed) x = x.replace('</sheetData>', `<row r="${r}">${cellXml('')}</row></sheetData>`).replace('<sheetData/>', `<sheetData><row r="${r}">${cellXml('')}</row></sheetData>`);
  return x;
}
/* writes = { シート名: { セル: 値 } } を書いて、開いたときに再計算・指定のシートを前に */
async function xlBuild(zip, map, order, writes, active){
  for (const [sheet, cells] of Object.entries(writes)) {
    const path = map[xlFind(map, sheet)];
    let x = await zip.file(path).async('string');
    for (const [ref, v] of Object.entries(cells)) x = xlSet(x, ref, v);
    zip.file(path, x);
  }
  let wb = await zip.file('xl/workbook.xml').async('string');
  wb = /<calcPr\b/.test(wb) ? wb.replace(/<calcPr\b([^>]*?)\/?>/, (m, a) => '<calcPr' + a.replace(/\s*fullCalcOnLoad="[^"]*"/, '') + ' fullCalcOnLoad="1"/>') : wb.replace('</workbook>', '<calcPr fullCalcOnLoad="1"/></workbook>');
  const act = active ? order.indexOf(xlFind(map, active)) : -1;
  if (act >= 0) {
    wb = wb.replace(/<workbookView\b([^>]*?)(\/?)>/, (m, a, sl) => '<workbookView' + a.replace(/\s*(activeTab|firstSheet)="[^"]*"/g, '') + ` activeTab="${act}"` + sl + '>');
    for (const [name, path] of Object.entries(map)) {
      let x = await zip.file(path).async('string');
      const on = name === order[act];
      const y = x.replace(/<sheetView\b([^>]*?)>/, (m, a) => '<sheetView' + a.replace(/\s*tabSelected="[^"]*"/, '') + (on ? ' tabSelected="1"' : '') + '>');
      if (y !== x) zip.file(path, y);
    }
  }
  zip.file('xl/workbook.xml', wb);
  return zip.generateAsync({ type:'blob', compression:'DEFLATE', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
async function xlDownloadAndSave(blob, name, folder, out){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  out.innerHTML = `✓ 「${esc(name)}」を作りました。<a href="${url}" download="${esc(name)}">もう一度ダウンロード</a>`;
  if (isDemo()) return;
  try { const j = await apiPost({ app:'xlsxFileSave', folder, name, b64: sgB64(await blob.arrayBuffer()) }); out.insertAdjacentHTML('beforeend', `<br>Drive にも保存しました：<a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.name)}</a>`); }
  catch (e) { out.insertAdjacentHTML('beforeend', `<br><span style="color:var(--warn)">Drive への保存はできませんでした（${esc(e.message)}）</span>`); }
}
async function ksTplBuf(key){
  if (KSN.bufs[key]) return KSN.bufs[key];
  if (!KSN.tpl[key]) throw new Error('「' + KS_TPL[key] + '」のひな形がまだ登録されていません（設定タブ）');
  const j = await api({ app:'xlsxTpl', tk: key });
  return KSN.bufs[key] = sgFromB64(j.b64);
}
/* 「１．なし　　３．Ⅰ」の中の選んだものを【】で囲む */
const ksMark = (text, label) => { const t = String(text || ''); const n = xlNorm(label); if (!label) return t; const i = t.indexOf(label); if (i >= 0) return t.slice(0, i) + '【' + label + '】' + t.slice(i + label.length); const j = [...t].findIndex((c, k) => xlNorm(t.slice(k, k + label.length)) === n); return j >= 0 ? t.slice(0, j) + '【' + t.slice(j, j + label.length) + '】' + t.slice(j + label.length) : t; };
const ksInitial = kana => {
  const R = { あ:'A',い:'I',う:'U',え:'E',お:'O',か:'K',き:'K',く:'K',け:'K',こ:'K',が:'G',ぎ:'G',ぐ:'G',げ:'G',ご:'G',さ:'S',し:'S',す:'S',せ:'S',そ:'S',ざ:'Z',じ:'J',ず:'Z',ぜ:'Z',ぞ:'Z',た:'T',ち:'C',つ:'T',て:'T',と:'T',だ:'D',ぢ:'J',づ:'Z',で:'D',ど:'D',な:'N',に:'N',ぬ:'N',ね:'N',の:'N',は:'H',ひ:'H',ふ:'F',へ:'H',ほ:'H',ば:'B',び:'B',ぶ:'B',べ:'B',ぼ:'B',ぱ:'P',ぴ:'P',ぷ:'P',ぺ:'P',ぽ:'P',ま:'M',み:'M',む:'M',め:'M',も:'M',や:'Y',ゆ:'Y',よ:'Y',ら:'R',り:'R',る:'R',れ:'R',ろ:'R',わ:'W',を:'W' };
  const toH = s => String(s || '').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  const parts = toH(kana).trim().split(/[\s　]+/).filter(Boolean);
  const z = c => String.fromCharCode(c.charCodeAt(0) + 0xFEE0);
  return parts.map(p => R[p[0]] ? z(R[p[0]]) + '．' : '').join('');
};

  const st = KSN.sg = KSN.sg || { office: (KSN.conf.offices[0] || {}).id || '', ym: prev, data: null, skip: {} };

    <div class="small" style="color:var(--sub);margin-bottom:6px">「実績記録のチェック」で読み取った手書きの実績記録の送迎欄（往・復の〇）と、打刻の「送迎：往復・往・復」から、利用者ごと・日ごとの送迎回数（片道1・往復2）と迎え・送りの実施日を入れます。同じ人・同じ月に両方あれば用紙の方を使います。氏名はイニシャルで書きます。</div>

}
function ksSgCalc(st){
  const [Y, M] = st.ym.split('-').map(Number), days = new Date(Y, M, 0).getDate();
  const users = (st.data.users || []).filter(u => !st.skip[u.key]);
  const mukae = new Set(), okuri = new Set();
  users.forEach(u => { (u.ou || []).forEach(d => mukae.add(d)); (u.fuku || []).forEach(d => okuri.add(d)); });
  const nobe = users.reduce((a, u) => a + Object.values(u.days).reduce((x, y) => x + y, 0), 0);
  const kai = mukae.size + okuri.size, avg = kai ? nobe / kai : 0;
  const dset = new Set(); users.forEach(u => Object.keys(u.days).forEach(d => { if (u.days[d]) dset.add(Number(d)); }));
  const perWeek = Math.floor(dset.size / days * 7 * 10) / 10;

/* ===== シート全体を読む（見出しの文字から書く欄を探すため） ===== */
async function xlSheetAll(zip, map, sheet){
  const path = map[xlFind(map, sheet)];
  if (!path) throw new Error('「' + sheet + '」のシートがありません');
  const ssx = zip.file('xl/sharedStrings.xml') ? await zip.file('xl/sharedStrings.xml').async('string') : '';
  const ss = [...ssx.matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m => sgXmlUnesc([...m[1].replace(/<rPh\b[\s\S]*?<\/rPh>/g, '').matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x => x[1]).join('')));
  const x = await zip.file(path).async('string'), cells = {};
  for (const m of x.matchAll(/<c r="([A-Z]+\d+)"(\s[^>]*?)?(?:\/>|>([\s\S]*?)<\/c>)/g)) {
    if (!m[3]) continue;
    const t = ((m[2] || '').match(/\st="([^"]+)"/) || [])[1], v = (m[3].match(/<v>([\s\S]*?)<\/v>/) || [])[1];
    let val = '';
    if (t === 's') val = ss[Number(v)] || '';
    else if (t === 'inlineStr') val = sgXmlUnesc([...m[3].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(y => y[1]).join(''));
    else if (v != null) val = t === 'str' || t === 'e' ? sgXmlUnesc(v) : (isNaN(Number(v)) ? sgXmlUnesc(v) : Number(v));
    if (val !== '') cells[m[1]] = val;
  }
  const merges = [...x.matchAll(/<mergeCell ref="([A-Z]+)(\d+):([A-Z]+)(\d+)"/g)].map(m => ({ c1: xlCol(m[1] + '1'), r1: +m[2], c2: xlCol(m[3] + '1'), r2: +m[4] }));
  const rc = ref => ({ c: xlCol(ref), r: Number(ref.match(/\d+$/)[0]) });
  const mergeOf = ref => { const { c, r } = rc(ref); return merges.find(g => c >= g.c1 && c <= g.c2 && r >= g.r1 && r <= g.r2); };
  const find = (test, rows) => Object.keys(cells).filter(k => { const r = rc(k).r; return (!rows || (r >= rows[0] && r <= rows[1])) && test(xlNorm(cells[k]), cells[k]); })
    .sort((a, b) => rc(a).r - rc(b).r || rc(a).c - rc(b).c);
  /* 見出しのセルの右どなり（結合していれば結合の右端の次）を返す */
  const rightOf = ref => { const g = mergeOf(ref), { c, r } = rc(ref); return xlColName((g ? g.c2 : c) + 1) + (g ? g.r1 : r); };
  return { cells, merges, find, rightOf, rc };
}
/* B型は 4・5月分 と 6月以降 の2枚。適用開始日で選ぶ */

  if (!hit.length) return '';
  if (hit.length === 1) return hit[0];
  const m = Number(String(start).slice(5, 7));
  return hit.find(x => (m >= 4 && m <= 5) === /4月|４月|5月|５月/.test(xlNorm(x))) || hit[0];

  const hr = S.rc(head).r, cols = {};
  Object.keys(S.cells).filter(k => S.rc(k).r === hr).forEach(k => {

const kmDays = v => String(v || '').split(/[^\d]+/).map(Number).filter(n => n >= 1 && n <= 31);
const kmScanOf = (st, key) => st.doc.scan && st.doc.scan.ym === st.ym ? (st.doc.scan.people || {})[key] || null : null;
const kmSrc = (st, s, a) => { const sc = kmScanOf(st, s.key); if (a.src && (a.src !== 'scan' || sc)) return a.src; return sc ? 'scan' : Object.keys(s.days || {}).length ? 'log' : 'pat'; };
const kmUsePat = (s, a) => a.src ? a.src === 'pat' : !Object.keys(s.days || {}).length;
function kmRows(st){
  const doc = st.doc, [Y, M] = st.ym.split('-').map(Number), last = new Date(Y, M, 0).getDate();
  const list = (st.data.staff || []).map(s => {
    const a = doc.people[s.key] || {};
    const days = {}; let total = 0, paid = s.paid || [];
    const src = kmSrc(st, s, a), sc = kmScanOf(st, s.key);
    if (src === 'scan') {
      paid = sc.paid || [];
      Object.entries(sc.days || {}).forEach(([d, h]) => { if (Number(d) <= last && h) { days[d] = h; total += h; } });
    } else if (src === 'pat') {
      const pat = a.pat || {}, off = kmDays(a.off); paid = kmDays(a.paidDays);

        if (off.includes(d) || paid.includes(d)) continue;

        if (h) { days[d] = h; total += h; }
      }

/* 写真・PDFを1枚ずつの読み取り単位にする（PDFはページごと） */
async function scanItems(files){
  const items = [];
  for (const f of files) {
    if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name || '')) {
      const { PDFDocument } = await loadPdfLib();
      const src = await PDFDocument.load(await f.arrayBuffer(), { ignoreEncryption:true });
      const n = src.getPageCount();
      for (let i = 0; i < n; i++) {
        const one = await PDFDocument.create(); const [pg] = await one.copyPages(src, [i]); one.addPage(pg);
        items.push({ label: (f.name || 'PDF') + (n > 1 ? `（${i + 1}/${n}枚目）` : ''), b64: await one.saveAsBase64(), mime:'application/pdf' });
      }
    } else if (/^image\//.test(f.type)) { const img = await shrinkImage(f, 2200); items.push({ label: f.name, b64: img.b64, mime: img.mime }); }
  }
  return items;
}
/* スタッフの出勤簿を読み取って、その月の日ごとの時間にする */
async function kmScan(files){
  const st = KSN.km, doc = st.doc, out = $('kmScanOut');
  const staff = st.data.staff || [];
  const line = t => { out.innerHTML = `<div class="small" style="margin-top:6px">${t}</div>`; };
  let items;
  try { line('ファイルを準備しています…'); items = await scanItems(files); } catch (e) { line(`<span style="color:var(--err)">${esc(e.message)}</span>`); return; }
  if (!items.length) { line('<span style="color:var(--err)">写真かPDFを選んでください</span>'); return; }
  if (!doc.scan || doc.scan.ym !== st.ym) doc.scan = { ym: st.ym, people: {} };
  const results = [];
  for (let i = 0; i < items.length; i++) {
    let tries = 0;
    for (;;) {
      line(`読み取っています… ${i + 1}／${items.length}枚${tries ? '（混み合っているため待って読み直し中）' : ''}`);
      try {
        const r = await apiPost({ app:'kasanStaffScan', month: st.ym, file: { b64: items[i].b64, mime: items[i].mime } });
        const k = r.key, hit = staff.find(x => x.key === k) || staff.find(x => k && (x.key.includes(k) || k.includes(x.key)));
        results.push({ label: items[i].label, r, hit });
        break;
      } catch (e) {
        if (/quota|RESOURCE_EXHAUSTED|rate.?limit|429|Too Many/i.test(e.message) && tries < 3) { tries++; await new Promise(res => setTimeout(res, 45000)); continue; }
        results.push({ label: items[i].label, err: e.message }); break;
      }
    }
  }
  const put = (key, r) => {
    const days = {}, paid = [];
    (r.rows || []).forEach(x => { if (/有給/.test(x.kind)) paid.push(x.day); else if (x.work) days[x.day] = Math.round(Number(x.work) * 10) / 10; });
    doc.scan.people[key] = { days, paid, name: r.name };
    (doc.people[key] = doc.people[key] || {}).src = 'scan';
  };
  results.forEach(x => { if (x.hit && x.r.ym === st.ym) put(x.hit.key, x.r); });
  try { LS.set('fb_kasan_' + st.dk, doc); } catch (e) {}
  const ng = results.filter(x => x.err || !x.hit || x.r.ym !== st.ym);
  kmDraw();
  const o = $('kmScanOut');
  o.innerHTML = `<div class="small" style="margin-top:6px">✓ ${results.length - ng.length}人分を読み取りました。${ng.length ? '下の分は確かめてください。' : ''}</div>` + ng.map((x, i) => `<div class="km-ng">${esc(x.label)}：${x.err ? `<span style="color:var(--err)">${esc(x.err)}</span>` : x.r.ym !== st.ym ? `用紙の年月が ${esc(x.r.ym || '不明')} でした（選んでいる月と違います）` : `「${esc(x.r.name || '名前なし')}」が名簿に見つかりません →
    <select data-kmng="${i}"><option value="">だれの出勤簿か選ぶ</option>${staff.map(s => `<option value="${esc(s.key)}">${esc(s.name)}</option>`).join('')}</select>`}</div>`).join('');
  o.querySelectorAll('[data-kmng]').forEach(sel => sel.onchange = () => { if (!sel.value) return; put(sel.value, ng[Number(sel.dataset.kmng)].r); try { LS.set('fb_kasan_' + st.dk, doc); } catch (e) {} sel.closest('.km-ng').remove(); kmDraw(); });
}

}

        set(kSheet, 'F20', n(sm.c1)); set(kSheet, 'F21', n(sm.c2)); set(kSheet, 'G21', pc(sm.c2, sm.c1));
        set(kSheet, kubun === 'Ⅲ' ? 'I15' : 'I11', '【有】・無');
      }
    }
    const blob = await xlBuild(zip, map, order, W, cover);
    await xlDownloadAndSave(blob, `加算届_${K.label}_${office.name || ''}_${D.text}.xlsx`, '届出/' + (office.name || '事業所'), out);
    out.insertAdjacentHTML('beforeend', `<br>選んだ項目は【　】で囲んでいます。${esc(cover)}・${esc(taiseiSheet)}・${esc(kSheet)} を確かめて、要るシートを印刷してください。`);
  } catch (e) { msgSheet('Excel を作れませんでした', e.message); }
  finally { $('busy').classList.remove('on'); }

function fieldHtml(f, raw){
  const id = 'f' + f.index, val = esc(raw), opts = f.options || [];
  const req = f.required ? '<span class="req">必須</span>' : '';
  let label = `<label for="${id}">${esc(f.label)}${req}</label>`;
  let body;
  if (f.multi && opts.length) {
    const sel = splitMulti(raw);
    label = `<div class="label" id="${id}l">${esc(f.label)}${req}<span class="hint">いくつでも選べます</span></div>`;
    body = `<div class="chips" role="group" aria-labelledby="${id}l">${opts.map(o =>
      `<button type="button" class="chip" data-f="${f.index}" data-v="${esc(o)}" data-mode="multi" aria-pressed="${sel.includes(o)}">${esc(o)}</button>`).join('')}</div>`;
  } else if (f.strict && opts.length > 8) {
    body = `<button type="button" class="picker" id="${id}" data-f="${f.index}" data-mode="pick">${raw ? `<span>${val}</span>` : '<span class="ph">選んでください</span>'}${ICON.down}</button>`;
  } else if (f.strict && opts.length) {
    label = `<div class="label" id="${id}l">${esc(f.label)}${req}</div>`;
    body = `<div class="chips" role="radiogroup" aria-labelledby="${id}l">${opts.map(o =>
      `<button type="button" class="chip" data-f="${f.index}" data-v="${esc(o)}" data-mode="one" aria-pressed="${raw === o}">${esc(o)}</button>`).join('')}</div>`;
  } else if (f.type === 'image') {
    const cur = F.files[f.index] ? null : (/^https?:/.test(String(raw)) ? { dataUrl: driveImg(raw, 400) } : null);
    const ph = F.files[f.index] || cur;
    label = `<div class="label">${esc(f.label)}${req}<span class="hint">写真は下書きに残りません</span></div>`;
    body = `<div class="photo">${ph ? `<img src="${ph.dataUrl}" alt="選んだ写真">` : ''}
      <label class="pbtn">${ph ? '撮り直す' : '写真を撮る・選ぶ'}<input type="file" accept="image/*" data-photo="${f.index}"></label>
      ${ph ? `<button type="button" class="link" style="color:var(--sub)" data-unphoto="${f.index}">外す</button>` : ''}</div>`;
  } else if (f.type === 'check') {
    label = `<div class="label" id="${id}l">${esc(f.label)}${req}</div>`;
    body = `<div class="chips" role="radiogroup" aria-labelledby="${id}l">${['はい','いいえ'].map(o => {
      const v = o === 'はい' ? 'TRUE' : 'FALSE';
      return `<button type="button" class="chip" data-f="${f.index}" data-v="${v}" data-mode="one" aria-pressed="${String(raw).toUpperCase() === v}">${o}</button>`; }).join('')}</div>`;
  } else if (f.type === 'textarea') {
    body = `<textarea class="in" id="${id}" data-f="${f.index}">${val}</textarea>`;
  } else {
    const t = { date:'date', time:'time', number:'number', datetime:'datetime-local' }[f.type] || 'text';
    const list = opts.length > 8 ? ` list="dl${f.index}"` : '';
    body = `<input class="in" id="${id}" data-f="${f.index}" type="${t}" value="${val}"${t === 'number' ? ' inputmode="decimal"' : ''}${list}>`;
    if (list) body += `<datalist id="dl${f.index}">${opts.map(o => `<option value="${esc(o)}">`).join('')}</datalist>`;
    if (t === 'datetime-local') body += `<div class="chips after"><button type="button" class="chip mini" data-now="${f.index}">今の時刻</button></div>`;
    if (t === 'date') body += `<div class="chips after"><button type="button" class="chip mini" data-date="0" data-f="${f.index}">今日</button><button type="button" class="chip mini" data-date="-1" data-f="${f.index}">昨日</button></div>`;
    else if (opts.length && opts.length <= 8) body += `<div class="chips after">${opts.map(o =>
      `<button type="button" class="chip mini" data-f="${f.index}" data-v="${esc(o)}" data-mode="fill">${esc(o)}</button>`).join('')}</div>`;
  }
  const has = f.type === 'image' ? !!(F.files[f.index] || String(raw).trim()) : !!String(raw).trim();
  return `<div class="field${has ? ' filled' : ''}" id="w${f.index}">${label}${body}</div>`;
}

/* ===== 選んだ内容によって出す欄（例：欠席理由が「その他」のときだけ、理由を書く欄） =====
   target：出し入れする欄の見出し　when：きっかけの欄の見出し　is：出す条件　label：出すときの見出し　req：出したときは必須 */
const FORM_COND = {
  '欠席時対応(加算)記録表': [
    // N列（14列目）＝転記で「その他」として帳票の欠席理由「その他」の行に入る列。見出しが空でも使う
    { col: 13, target: /^その他$/, when: /^欠席理由$/, is: v => /その他/.test(v), label: 'その他の理由（欠席理由の内容）', req: true }
  ]
};
function condRules(){
  const rules = (F && FORM_COND[F.sheet]) || [];
  return rules.map(r => ({ r, t: r.col != null ? F.fields.find(f => f.index === r.col) : F.fields.find(f => !f.hidden && r.target.test(String(f.label).trim())), w: F.fields.find(f => !f.hidden && r.when.test(String(f.label).trim())) })).filter(x => x.t && x.w && !x.t.auto);
}
function applyCond(){
  if (!F) return;
  F.condHidden = F.condHidden || {};
  condRules().forEach(({ r, t, w }) => {
    const on = r.is(String(F.values[w.index] ?? ''));
    F.condHidden[t.index] = !on;
    const tw = $('w' + t.index), ww = $('w' + w.index);
    if (!tw || !ww) return;
    if (ww.nextElementSibling !== tw) ww.after(tw);
    tw.style.display = on ? '' : 'none';
    tw.classList.toggle('cond', on);
    if (r.label && !tw.dataset.relabeled) {
      const lab = tw.querySelector('label, .label');
      if (lab && lab.firstChild && lab.firstChild.nodeType === 3) lab.firstChild.textContent = r.label;
      if (lab && r.req && !lab.querySelector('.req')) lab.insertAdjacentHTML('beforeend', '<span class="req">必須</span>');
      tw.dataset.relabeled = '1';
    }

}
let saveTimer;
function saveDraft(){

function updateProgress(){

function bindForm(){

  v.querySelectorAll('.chip[data-date]').forEach(ch => ch.onclick = () => {

  });

  v.querySelectorAll('[data-photo]').forEach(inp => inp.onchange = async () => {

    redrawField(i);

  v.querySelectorAll('[data-unphoto]').forEach(b => b.onclick = () => { const i = b.dataset.unphoto; if (F.files[i]) delete F.files[i]; else F.values[i] = ''; redrawField(i); });
  v.querySelectorAll('.picker').forEach(p => p.onclick = () => openPicker(F.fields.find(f => String(f.index) === p.dataset.f)));
  $('send').onclick = () => (F && !F.edit && BATCH_FORMS[F.sheet] && getBatch(F.sheet).length) ? openBatchReview() : openReview();
  if ($('fPrev')) $('fPrev').onclick = () => {
    const vis = F.fields.filter(f => !f.hidden);
    if (!vis.some(f => String(F.values[f.index] ?? '').trim())) { toast('まだ何も入力されていません'); return; }
    pdfOverlay(F.sheet + '（入力中・まだ送信していません）', async () => {
      try { return await apiPost({ app:'formPreview', sheet: F.sheet, data: F.values }); }

    }, '入力中の内容を書式に入れています…');

}

/* ===== まとめて送る（1枚に1か月分ある帳票）=====
   1日入力 →「この日を一時保存して次の日へ」→ … →「内容を確認（○日分）」で一度に送信。
   PDF は月ごとに1回、LINE 通知も1回だけ（GAS の submitBatch） */
const BATCH_FORMS = { '施設外実績記録表': true };
const batchKey = s => 'fb_batch_' + s;
const getBatch = s => LS.get(batchKey(s), []) || [];
function formMissing(show){
  const vis = F.fields.filter(f => !f.hidden);
  const missing = vis.filter(f => !(F.condHidden || {})[f.index] && f.required && (f.type === 'image' ? !F.files[f.index] : !String(F.values[f.index] ?? '').trim()));
  condRules().forEach(({ r, t }) => { if (r.req && !(F.condHidden || {})[t.index] && !String(F.values[t.index] ?? '').trim() && !missing.includes(t)) missing.push({ ...t, label: r.label || t.label }); });
  if (missing.length && show) {
    missing.forEach(f => $('w' + f.index)?.classList.add('miss'));
    $('w' + missing[0].index)?.scrollIntoView({ behavior:'smooth', block:'center' });
    toast('必須の項目が空いています：' + missing.map(f => f.label).join('、'), 3600);
  }
  return missing;
}
const batchFresh = () => !!(F && F.batchBase && JSON.stringify(F.values) === F.batchBase);
const batchDateField = () => F.fields.find(f => !f.hidden && f.type === 'date');
function batchSummary(values){
  const pick = re => { const f = F.fields.find(x => !x.hidden && re.test(x.label)); return f ? String(values[f.index] ?? '').trim() : ''; };
  const st = pick(/開始/), en = pick(/終了/), who = pick(/参加利用者|利用者/), co = pick(/企業|就労先/);
  return [st || en ? `${st}〜${en}` : '', who ? splitMulti(who).length + '名' : '', co].filter(Boolean).join('　');
}
const batchUtc = v => { const m = String(v || '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); return m ? new Date(Date.UTC(+m[1], m[2] - 1, +m[3])) : null; };
const batchMd = v => { const d = batchUtc(v); return !d ? (v || '日付なし') : `${d.getUTCMonth() + 1}/${d.getUTCDate()}(${'日月火水木金土'[d.getUTCDay()]})`; };
function drawSendBatch(){
  const box = $('batchBox'); if (!box || !F) return;
  const list = getBatch(F.sheet), fd = batchDateField();
  box.innerHTML = `<div class="box batch"><div class="batch-h"><b>まとめて送る</b><span class="small">${list.length ? list.length + '日分を一時保存中' : '1日ずつ入れて、最後にまとめて送信'}</span></div>
    ${list.length ? `<ul class="batch-list">${list.map((it, i) => `<li><button type="button" class="batch-day" data-open="${i}"><b>${esc(batchMd(fd ? it.values[fd.index] : ''))}</b><span>${esc(batchSummary(it.values))}</span></button><button type="button" class="link" data-rm="${i}" aria-label="この日を外す">✕</button></li>`).join('')}</ul>` : ''}
    <button type="button" class="btn s wide" id="batchAdd">この日を一時保存して次の日へ</button>
    ${list.length ? '<button type="button" class="btn s wide" id="batchPrev" style="margin-top:8px">📄 一時保存した日をまとめて書式で見る</button>' : ''}
    <p class="small" style="color:var(--sub);margin:8px 2px 0">作業のない日があるときは、上の「日付」を次に作業した日に直してから保存してください（空いた日は保存しなくて大丈夫です）。一時保存した日は、最後に「内容を確認」でまとめて送ります。PDFとLINEの通知は1回だけです。一覧の日付をタップすると、その日を直せます。</p></div>`;
  $('batchAdd').onclick = batchAdd;
  if ($('batchPrev')) $('batchPrev').onclick = batchPreview;
  box.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    const l = getBatch(F.sheet); const it = l.splice(Number(b.dataset.rm), 1)[0];
    LS.set(batchKey(F.sheet), l); drawSendBatch(); updateBatchBtn(); toast(batchMd(fd ? it.values[fd.index] : '') + ' を外しました');
  });
  box.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
    const l = getBatch(F.sheet); const it = l.splice(Number(b.dataset.open), 1)[0];
    LS.set(batchKey(F.sheet), l);
    LS.set(draftKey(F.sheet), { values: it.values, at: it.at, ts: Date.now() });
    renderForm(F.sheet, F.fields, { ...it.values });
    toast('この日を直せます。直したら「一時保存して次の日へ」か「内容を確認」');
  });
  updateBatchBtn();
}
function updateBatchBtn(){
  const n = F && getBatch(F.sheet).length, b = $('send');
  if (b && !F.edit) b.textContent = n ? `内容を確認（${n}日分〜）` : '内容を確認';
  updateDraftDot();
}
/* 今の入力を一時保存（同じ日付があれば置き換え）。次の日付にして、ほかの欄はそのまま残す */
function batchPut(){
  if (!String(F.values[(batchDateField() || {}).index] ?? '').trim()) { toast('実施日を入れてください'); return false; }
  if (formMissing(true).length) return false;
  const fd = batchDateField(), day = F.values[fd.index];
  const l = getBatch(F.sheet).filter(it => it.values[fd.index] !== day);
  const replaced = l.length < getBatch(F.sheet).length;
  l.push({ values: { ...F.values }, at: new Date().toLocaleString('ja-JP') });
  l.sort((a, b) => String(a.values[fd.index]).localeCompare(String(b.values[fd.index])));
  LS.set(batchKey(F.sheet), l);
  return { day, replaced };
}
function batchAdd(){
  const r = batchPut(); if (!r) return;
  const fd = batchDateField();
  const d = batchUtc(r.day); d.setUTCDate(d.getUTCDate() + 1);
  const next = { ...F.values, [fd.index]: d.toISOString().slice(0, 10) };
  LS.set(draftKey(F.sheet), { values: next, at: new Date().toLocaleString('ja-JP'), ts: Date.now() });
  renderForm(F.sheet, F.fields, next);
  F.batchBase = JSON.stringify(next);   // 次の日は前の日の写し。中身を変えるまでは「確認」に含めない
  window.scrollTo(0, 0);
  toast(`${batchMd(r.day)} を${r.replaced ? '置き換えて' : ''}一時保存しました。次は ${batchMd(next[fd.index])}`, 3200);
}
/* 一時保存した日＋（入力していれば）今の画面の日を、日付順に */
function batchCollect(){
  const vis = F.fields.filter(f => !f.hidden), fd = batchDateField();
  const day = F.values[fd.index], inList = getBatch(F.sheet).some(it => it.values[fd.index] === day);
  const touched = !batchFresh() && vis.some(f => f !== fd && String(F.values[f.index] ?? '').trim());
  let cur = 'none';
  if (touched && !formMissing(false).length) cur = inList ? 'replace' : 'add';
  const list = getBatch(F.sheet).slice();
  if (cur !== 'none') { const i = list.findIndex(it => it.values[fd.index] === day); if (i >= 0) list.splice(i, 1); list.push({ values: { ...F.values }, current: true }); list.sort((a, b) => String(a.values[fd.index]).localeCompare(String(b.values[fd.index]))); }
  return { list, cur, touched, day, fd };
}
function batchPreview(){
  const { list } = batchCollect();
  if (!list.length) { toast('まだ一時保存した日がありません'); return; }
  pdfOverlay(`${F.sheet}（${list.length}日分・まだ送信していません）`,
    () => apiPost({ app:'formPreviewBatch', sheet: F.sheet, list: list.map(it => it.values) }),
    `${list.length}日分を書式に入れています…`);
}
function openBatchReview(){
  // 今の画面の日も入っていれば加える（必須が空なら、今の日は入れない）
  const { list, cur, touched, day, fd } = batchCollect();
  const months = [...new Set(list.map(it => String(it.values[fd.index]).slice(0, 7)))];
  openSheet(`${list.length}日分をまとめて送信しますか？`,
    `<ul class="batch-list rv">${list.map(it => `<li><span class="batch-day"><b>${esc(batchMd(it.values[fd.index]))}</b><span>${esc(batchSummary(it.values))}${it.current ? '　<em>（今の画面）</em>' : ''}</span></span></li>`).join('')}</ul>
     ${touched && cur === 'none' ? '<p class="small" style="color:var(--warn)">今の画面の日は、必須の項目が空いているので入りません。</p>' : batchFresh() ? `<p class="small" style="color:var(--sub)">今の画面（${esc(batchMd(day))}）はまだ入力していないので入りません。この日も送るときは、内容を直すか「一時保存して次の日へ」を押してください。</p>` : ''}
     <p class="small" style="margin-top:12px">日付の順に記録し、PDFは${months.length > 1 ? '月ごとに1回（' + months.length + '回）' : '1回'}、LINEの通知は1回だけ送ります。</p>`,
    `<button class="btn s" id="rvBack">戻って直す</button><button class="btn s" id="rvPrev">📄 書式</button><button class="btn p" id="rvSend">${list.length}日分を送信</button>`, gClass(F.group));
  $('rvBack').onclick = closeSheet;
  $('rvPrev').onclick = () => { closeSheet(); batchPreview(); };
  $('rvSend').onclick = () => submitBatch(list.map(it => it.values), cur !== 'none');
}
async function submitBatch(list, withCurrent){
  closeSheet();
  $('busy').classList.add('on');
  const sheet = F.sheet, fd = batchDateField();
  try {
    const j = await apiPost({ app:'submitBatch', sheet, list });
    // 記録できた日を一時保存から外す
    const sent = new Set(list.slice(0, j.done || 0).map(v => v[fd.index]));
    LS.set(batchKey(sheet), getBatch(sheet).filter(it => !sent.has(it.values[fd.index])));
    if ((withCurrent && sent.has(F.values[fd.index])) || (batchFresh() && j.ok !== false)) LS.del(draftKey(sheet));
    if (!getBatch(sheet).length) LS.del(batchKey(sheet));
    if (j.done) LS.set('fb_history', [{ sheet, ts:Date.now(), pdfs:j.pdfs || [], note:(j.done + '日分をまとめて記録') + (j.note ? '　' + j.note : ''), who:'' }, ...getHistory()].slice(0, 50));
    if (j.ok === false) {
      openSheet('途中で止まりました', `<p>${j.done ? `${j.done}日分は記録しました。` : ''}${esc(batchMd(list[j.done || 0][fd.index]))} の記録でエラーになりました。</p><p class="small">${esc(j.error || '')}</p><p class="small">残りの日は一時保存に残っています。</p>`, '<button class="btn p wide" id="errOk">閉じる</button>');
      $('errOk').onclick = () => { closeSheet(); renderForm(sheet, F.fields); };
      return;
    }
    F = null;
    location.replace('#/done/' + encodeURIComponent(sheet));
  } catch (e) {
    openSheet('送信できませんでした', `<p>${esc(e.message)}</p><p class="small">一時保存した日はそのまま残っています。</p>`, '<button class="btn p wide" id="errOk">閉じる</button>');
    $('errOk').onclick = closeSheet;
  } finally {
    $('busy').classList.remove('on');
  }
}

/* ===== 送信前の確認 ===== */
function openReview(){
  const vis = F.fields.filter(f => !f.hidden && !(F.condHidden || {})[f.index]);
  if (!vis.some(f => String(F.values[f.index] ?? '').trim()) && !Object.keys(F.files).length) { toast('まだ何も入力されていません'); return; }
  if (formMissing(true).length) return;
  const filled = vis.filter(f => f.type === 'image' ? (F.files[f.index] || String(F.values[f.index] ?? '').trim()) : String(F.values[f.index] ?? '').trim());
  const show = f => {
    if (f.type === 'image') return `<img src="${F.files[f.index] ? F.files[f.index].dataUrl : esc(driveImg(F.values[f.index], 400))}" alt="" style="width:120px;border-radius:8px">`;
    const v = F.values[f.index];
    if (f.type === 'check') return String(v).toUpperCase() === 'TRUE' ? 'はい' : 'いいえ';
    if (f.type === 'datetime') return esc(String(v).replace('T', ' '));
    return esc(f.multi ? splitMulti(v).join('、') : v);
  };
  const condLabel = {}; condRules().forEach(({ r, t }) => { if (r.label) condLabel[t.index] = r.label; });
  const rows = filled.map(f => `<dt>${esc(condLabel[f.index] || f.label)}</dt><dd>${show(f)}</dd>`).join('');
  const blanks = vis.length - filled.length;
  if (F.edit) {
    const o = F.edit.orig || {};
    const changed = vis.filter(f => F.files[f.index] || String(F.values[f.index] ?? '') !== String(o[f.index] ?? ''));
    const was = f => { const v = o[f.index]; return v === '' || v == null ? '（空欄）' : f.type === 'image' ? '（前の写真）' : f.type === 'check' ? (String(v).toUpperCase() === 'TRUE' ? 'はい' : 'いいえ') : esc(f.multi ? splitMulti(v).join('、') : String(v).replace('T', ' ')); };
    const now = f => (f.type === 'image' ? (F.files[f.index] || String(F.values[f.index] ?? '').trim()) : String(F.values[f.index] ?? '').trim()) ? show(f) : '（空欄）';
    const crow = changed.map(f => `<dt>${esc(f.label)}</dt><dd><span class="small" style="text-decoration:line-through">${was(f)}</span><br>${now(f)}</dd>`).join('');
    if (!changed.length && !F.edit.hasPdf) { toast('変更されていません'); return; }
    openSheet(changed.length ? `${changed.length}項目を修正しますか？` : '変更はありません',
      `${changed.length ? `<dl class="review">${crow}</dl>` : '<p class="small">項目は変わっていません。PDFだけ作り直すこともできます。</p>'}${F.edit.hasPdf ? `<label class="small" style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" id="rvRegen" checked style="width:20px;height:20px">修正した内容でPDFも作り直す</label>` : ''}`,
      `<button class="btn s" id="rvBack">戻って直す</button><button class="btn p" id="rvSend">修正を保存</button>`, gClass(F.group));
    $('rvBack').onclick = closeSheet;
    $('rvSend').onclick = submitEdit;
    return;
  }
  openSheet('この内容で送信しますか？',
    `<dl class="review">${rows}</dl>${blanks ? `<p class="small" style="margin-top:14px">未記入の項目が ${blanks} 件あります。そのまま送信できます。</p>` : ''}`,
    `<button class="btn s" id="rvBack">戻って直す</button><button class="btn p" id="rvSend">送信する</button>`, gClass(F.group));
  $('rvBack').onclick = closeSheet;
  $('rvSend').onclick = submitForm;
}

async function submitForm(){
  closeSheet();
  $('busy').classList.add('on');
  const { sheet, values } = F;
  try {
    const files = {};
    Object.keys(F.files).forEach(i => { files[i] = { b64:F.files[i].b64, mime:F.files[i].mime }; });
    const j = await apiPost({ app:'submit', sheet, data: values, files });
    LS.del(draftKey(sheet));
    const rec = { sheet, ts:Date.now(), pdfs:j.pdfs || [], note:j.note || '', who: values[F.fields.find(f => !f.hidden && f.strict && (f.options || []).length > 8)?.index] || '' };
    LS.set('fb_history', [rec, ...getHistory()].slice(0, 50));
    F = null;
    location.replace('#/done/' + encodeURIComponent(sheet));
  } catch (e) {
    openSheet('送信できませんでした', `<p>${esc(e.message)}</p><p class="small">入力内容は下書きに残っています。</p>`,
      `<button class="btn p wide" id="errOk">閉じる</button>`);
    $('errOk').onclick = closeSheet;
  } finally {
    $('busy').classList.remove('on');
  }
}

async function submitEdit(){
  const regen = !!($('rvRegen') && $('rvRegen').checked);
  closeSheet();
  $('busy').classList.add('on');
  const { sheet, values } = F, row = F.edit.row;
  try {
    const files = {};
    Object.keys(F.files).forEach(i => { files[i] = { b64:F.files[i].b64, mime:F.files[i].mime }; });
    const j = await apiPost({ app:'update', sheet, row, data: values, files, regen });
    LS.del('fb_rec_' + sheet + '_' + row);

    const qq = q.replace(/\s/g, '');

    $('rcount').textContent = `${people.field}ごと ${list.length}人`;

    $('rlist').innerHTML = list.length ? gyos.map(g => `<div class="sec-title" id="gy_${g}">${g}${g === '他' ? '（読み未登録）' : '行'}</div><div class="sheet" style="border-radius:var(--r-m)">${list.filter(x => x.gyo === g).map(x =>
      `<a class="row" href="#/records/${encodeURIComponent(sheet + '|' + x.name)}" style="color:inherit;text-decoration:none"><span class="name">${esc(x.name)}<span class="small" style="display:block">${x.kana ? esc(x.kana) + '　' : ''}${x.count}件${x.last ? '　最新 ' + esc(x.last) : ''}</span></span>${ICON.chev}</a>`).join('')}</div>`).join('')
      : `<div class="empty">${q ? '見つかりませんでした。' : 'まだ記録はありません。'}</div>`;
    $('rgyo').querySelectorAll('[data-gy]').forEach(b => b.onclick = () => { const el = $('gy_' + b.dataset.gy); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - 70, behavior:'smooth' }); });
    $('rmore').innerHTML = '';
  };
  const load = async reset => {
    if (reset) { page = 0; items = []; }
    try {
      if (mode === 'name') {
        if (!people) people = await api({ app:'recordPeople', sheet });
        if (token !== viewToken) return;
        if (!people.field) { REC_MODE = 'date'; return showRecords(sheet); }
        return drawPeople();
      }
      const j = await api({ app:'records', sheet, q, page, person: person || '' });
      if (token !== viewToken) return;
      items = items.concat(j.items || []);
      $('rcount').textContent = q ? `「${q}」で ${j.total}件` : `全 ${j.total}件（新しい順）`;
      $('rlist').innerHTML = items.length ? items.map(it => `<a class="card" href="#/record/${encodeURIComponent(sheet)}/${it.row}" style="display:block;color:inherit;text-decoration:none">

      $('rmore').innerHTML = j.hasMore ? '<button class="btn s wide" id="rmoreBtn" style="margin-bottom:20px">もっと見る</button>' : '';
