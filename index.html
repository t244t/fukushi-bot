<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<title>福祉ボット２</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== 色とかたち ===== */
:root{
  --bg:#edf1eb; --paper:#ffffff; --ink:#1f2a24; --sub:#5b6a61; --rule:#d7dfd6; --soft:#f5f8f4;
  --brand:#2f6b4f; --brand-ink:#ffffff;
  --g1:#3c8a5a; --g1-bg:#e4f1e8;   /* 日々の記録：若竹 */
  --g2:#2e5b88; --g2-bg:#e2ebf4;   /* 支援計画・会議：藍 */
  --g3:#a9741a; --g3-bg:#f6ecd8;   /* アセスメント・採用：山吹 */
  --g4:#8a4767; --g4-bg:#f3e4ec;   /* 届出・報告：葡萄 */
  --warn:#9a5b10; --warn-bg:#fdf1de; --err:#b3352b; --err-bg:#fbe7e5;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --shadow:0 1px 0 var(--rule);
  --on:#fff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121815; --paper:#1a221e; --ink:#e4ebe6; --sub:#9aa9a0; --rule:#2b3630; --soft:#202a25;
    --brand:#4f9a75;
    --g1:#6cc08b; --g1-bg:#1e3328; --g2:#7fa9d6; --g2-bg:#1c2836;
    --g3:#e0ab4f; --g3-bg:#33291a; --g4:#d390b1; --g4-bg:#33222b;
    --warn:#e7b066; --warn-bg:#33281a; --err:#ef8a80; --err-bg:#3a201d;
    --on:#10201a;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
main.wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.no-nav main.wrap{padding-bottom:0}

/* ===== 上部バー ===== */
.top{position:sticky;top:0;z-index:10;background:var(--brand);color:var(--brand-ink);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:8px;height:56px}
.top h1{flex:1;margin:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;margin:0 -6px;border:0;background:transparent;color:inherit;border-radius:50% }
.icon-btn svg{width:24px;height:24px}
.top.group{background:var(--paper);color:var(--ink);border-bottom:1px solid var(--rule)}
.top.group .band{position:absolute;left:0;right:0;bottom:-1px;height:4px;background:var(--gc)}
.progress{height:4px;background:var(--rule);position:absolute;left:0;right:0;bottom:-1px}
.progress i{display:block;height:100%;width:0;background:var(--gc);transition:width .25s}

/* ===== ホーム ===== */
.today{padding:18px 0 6px;display:flex;align-items:center;gap:14px}
.today .logo{width:84px;height:84px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}
.today .date{font-size:26px;font-weight:700;letter-spacing:.02em}
.today .stat{color:var(--sub);font-size:14px;margin-top:2px}
.search{position:relative;display:block;margin:12px 0 4px}
.search input{width:100%;height:48px;padding:0 14px 0 44px;border:1px solid var(--rule);border-radius:var(--r-m);background:var(--paper);color:var(--ink);font:inherit}
.search svg{position:absolute;left:14px;top:13px;width:22px;height:22px;color:var(--sub)}
.sec-title{font-size:14px;color:var(--sub);font-weight:700;margin:20px 0 8px}
.pins{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pin{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--paper);border:1px solid var(--rule);border-left:5px solid var(--gc);border-radius:var(--r-s);font-weight:700;font-size:15px}

/* 見出しタブ（バインダーのインデックス） */
.tabs{display:flex;gap:4px;margin-top:20px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1 0 auto;border:0;padding:10px 8px 9px;border-radius:var(--r-m) var(--r-m) 0 0;background:var(--soft);color:var(--sub);font-weight:700;font-size:13px;border-top:4px solid transparent}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);border-top-color:var(--gc)}
.tabs.mini{margin-top:0;background:var(--soft);border-radius:var(--r-m);padding:4px}.tabs.mini .tab{border-radius:var(--r-s);border-top:0;padding:10px 8px;font-size:14px}.tabs.mini .tab[aria-selected="true"]{box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sheet{background:var(--paper);border-radius:0 var(--r-m) var(--r-m) var(--r-m);border-top:4px solid var(--gc);margin-bottom:24px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 16px;border:0;background:transparent;text-align:left;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row:active{background:var(--soft)}
.row .name{flex:1;font-size:16px}
.row .grp{display:block;font-size:12px;color:var(--sub)}
.chev{width:18px;height:18px;color:var(--sub);flex:0 0 auto}
.tag{flex:0 0 auto;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--warn-bg);color:var(--warn)}
.empty{padding:28px 16px;text-align:center;color:var(--sub)}

/* ===== 入力フォーム ===== */
.form-head{display:flex;justify-content:space-between;align-items:center;padding:14px 0 6px;color:var(--sub);font-size:14px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:var(--r-s);padding:10px 12px;font-size:14px;margin:10px 0}
.note.err{background:var(--err-bg);color:var(--err)}
.field{background:var(--paper);border-radius:var(--r-m);padding:14px;margin-bottom:10px;border:2px solid transparent}
.field.filled{box-shadow:inset 4px 0 0 var(--gc)}
.field.miss{border-color:var(--err)}
.field>label,.field>.label{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;margin-bottom:8px}
.req{font-size:11px;font-weight:700;color:var(--err);background:var(--err-bg);border-radius:4px;padding:1px 6px}
.hint{font-size:12px;color:var(--sub);font-weight:400;margin-left:auto}
.in,select.in,textarea.in{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r-s);background:var(--soft);color:var(--ink);font:inherit}
textarea.in{min-height:120px;resize:vertical;line-height:1.7}
.in:focus{border-color:var(--gc);background:var(--paper);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--gc) 25%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.after{margin-top:8px}
.chip{min-height:44px;padding:8px 14px;border:1px solid var(--rule);border-radius:var(--r-s);background:var(--soft);font-size:15px;text-align:left}
.chip[aria-pressed="true"]{background:var(--gc);border-color:var(--gc);color:var(--on);font-weight:700}
.chip.mini{min-height:36px;padding:4px 12px;font-size:14px}
.picker{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r-s);background:var(--soft);text-align:left}
.picker .ph{color:var(--sub)}
.picker svg{width:18px;height:18px;color:var(--sub);flex:0 0 auto}

.bar{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px;align-items:center}
.saved{font-size:12px;color:var(--sub);flex:1}
.btn{border:0;border-radius:var(--r-m);min-height:52px;padding:0 22px;font-size:16px;font-weight:700}
.btn.p{background:var(--gc,var(--brand));color:var(--on)}
.btn.s{background:var(--paper);border:1px solid var(--rule)}
.btn.wide{width:100% }
.btn:disabled{opacity:.5}

/* ===== 下から出るシート ===== */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.scrim.on{display:block}
.bsheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:var(--r-l) var(--r-l) 0 0;max-height:82vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s ease-out;padding-bottom:env(safe-area-inset-bottom)}
.bsheet.on{transform:none}
.bsheet .grab{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:8px auto 4px}
.bsheet h2{font-size:17px;margin:4px 16px 10px}
.bsheet .body{overflow:auto;padding:0 16px 12px}
.bsheet .foot{display:flex;gap:10px;padding:10px 16px 14px;border-top:1px solid var(--rule)}
.bsheet .foot .btn{flex:1}
.opt{display:block;width:100%;min-height:52px;padding:12px 8px;border:0;border-bottom:1px solid var(--rule);background:transparent;text-align:left;font-size:16px}
.opt[aria-selected="true"]{font-weight:700;color:var(--gc)}
.photo{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo img{width:96px;height:96px;object-fit:cover;border-radius:var(--r-s);border:1px solid var(--rule)}
.photo .pbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;border:1px dashed var(--gc);border-radius:var(--r-s);color:var(--gc);font-weight:700;background:var(--soft);cursor:pointer}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.review dt{font-size:13px;color:var(--sub);margin-top:10px}
.review dd{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}

/* ===== 送信完了 ===== */
.done{text-align:center;padding:48px 0 24px}
.done .mark{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;background:var(--gc);display:grid;place-items:center;color:var(--on)}
.done .mark svg{width:46px;height:46px}
.done h2{margin:0 0 4px;font-size:24px}
.done p{margin:0;color:var(--sub)}
.stack{display:grid;gap:10px;margin-top:24px}

/* ===== 下部ナビ ===== */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;color:var(--sub);text-decoration:none;font-size:11px;position:relative}
.nav a svg{width:24px;height:24px}
.nav a[aria-current="page"]{color:var(--brand);font-weight:700}
.nav .dot{position:absolute;top:4px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:var(--on);font-size:11px;line-height:18px;text-align:center}

.list-item{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:var(--r-m);padding:14px;margin-bottom:8px;border-left:5px solid var(--gc)}
.list-item .main{flex:1;min-width:0}
.list-item .t{font-weight:700}
.list-item .m{font-size:13px;color:var(--sub)}
.link{border:0;background:transparent;color:var(--gc);font-weight:700;padding:8px;text-decoration:none}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r-m);font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90% }
.toast.on{opacity:1;transform:translateX(-50%)}
.busy{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);display:none;place-items:center;text-align:center;padding:24px}
.busy.on{display:grid}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--rule);border-top-color:var(--brand);margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important} }
.g1{--gc:var(--g1);--gbg:var(--g1-bg)} .g2{--gc:var(--g2);--gbg:var(--g2-bg)}
.g3{--gc:var(--g3);--gbg:var(--g3-bg)} .g4{--gc:var(--g4);--gbg:var(--g4-bg)}
.small{font-size:13px;color:var(--sub)}

/* ===== 連絡 ===== */
.sos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sos button{min-height:64px;border:0;border-radius:var(--r-m);color:var(--on);font-size:17px;font-weight:700}
.st-ok{background:#3c8a5a}.st-hurt{background:#c62f22}.st-evac{background:#c98a00}.st-lost{background:#7a4a8a}.st-none{background:#7d8a83}
.counts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.counts div{border-radius:var(--r-s);padding:8px 2px;text-align:center;color:var(--on)}
.counts b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.counts span{font-size:11px}
.box{background:var(--paper);border-radius:var(--r-m);padding:14px 16px;margin-bottom:10px}
.box h3{margin:0 0 4px;font-size:16px}
.box .row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.box .row2 .btn{flex:1 1 140px;min-height:46px;font-size:15px;padding:0 12px}
.who{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.7}
.evt .meta{font-size:13px;color:var(--sub)}
.evt .chips{margin-top:10px}
.admin-mark{font-size:11px;font-weight:700;color:var(--brand);border:1px solid var(--brand);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px}

/* ===== 管理 ===== */
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--rule)}
.task:last-child{border-bottom:0}
.task button.ck{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:2px solid var(--brand);background:transparent;display:grid;place-items:center;color:var(--on)}
.task button.ck[aria-pressed="true"]{background:var(--brand)}
.task button.ck svg{width:18px;height:18px}
.task.done .tx{color:var(--sub);text-decoration:line-through}
.dl{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
.dl .d{font-variant-numeric:tabular-nums;white-space:nowrap}
.red{color:var(--err);font-weight:700}.amber{color:var(--warn);font-weight:700}
.sthumb{width:56px;height:56px;flex:0 0 auto;border-radius:var(--r-s);object-fit:cover;background:var(--soft)}
.stock-n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
.stepper{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0}
.stepper button{width:56px;height:56px;border-radius:50%;border:1px solid var(--rule);background:var(--soft);font-size:26px}
.stepper input{width:110px;text-align:center;font-size:30px;font-weight:700;border:0;background:transparent;color:var(--ink)}
table.mt{width:100%;border-collapse:collapse;font-size:14px;background:var(--paper);border-radius:var(--r-m);overflow:hidden}
table.mt th,table.mt td{padding:8px 6px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
table.mt th:first-child,table.mt td:first-child{text-align:left}
table.mt th{font-size:12px;color:var(--sub);font-weight:700}
.tscroll{overflow-x:auto;border-radius:var(--r-m)}

/* ===== 情報を見る ===== */
.heat{display:block;color:inherit;text-decoration:none;background:var(--paper);border-radius:var(--r-l);padding:18px 18px 16px;margin-top:16px;border-top:6px solid var(--lv)}
.heat .row1{display:flex;align-items:baseline;gap:12px}
.heat .num{font-size:52px;font-weight:700;line-height:1;color:var(--lv);font-variant-numeric:tabular-nums}
.heat .lvname{font-size:20px;font-weight:700}
.heat .meta{color:var(--sub);font-size:13px;margin-top:6px}
.scale{display:grid;grid-template-columns:21fr 4fr 3fr 3fr 4fr;gap:2px;margin-top:14px}
.scale span{height:8px;border-radius:2px;opacity:.35}
.scale span.on{opacity:1;height:12px;margin-top:-2px}
.scale-l{display:grid;grid-template-columns:21fr 4fr 3fr 3fr 4fr;gap:2px;font-size:11px;color:var(--sub);margin-top:4px}
.card{background:var(--paper);border-radius:var(--r-m);padding:14px 16px;margin-bottom:10px;border-left:5px solid var(--gc)}
.card .d{font-size:12px;color:var(--sub)}
.card .t{font-weight:700;margin:2px 0 4px;line-height:1.5}
.card .b{white-space:pre-wrap;word-break:break-word;font-size:14px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.open .b{display:block}
.card .acts{display:flex;gap:4px;margin:6px -8px -6px;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;background:var(--gbg);color:var(--gc);margin-left:6px;vertical-align:2px}
.wb{display:inline-block;min-width:52px;text-align:center;font-weight:700;color:#fff;border-radius:var(--r-s);padding:4px 8px;margin-right:10px;font-variant-numeric:tabular-nums}
.thumb{width:112px;height:63px;object-fit:cover;border-radius:6px;flex:0 0 auto;background:var(--soft)}
.step{display:grid;grid-template-columns:40px 1fr;gap:12px;background:var(--paper);border-radius:var(--r-m);padding:14px;margin-bottom:10px}
.step .n{width:36px;height:36px;border-radius:50%;background:var(--gc);color:var(--on);display:grid;place-items:center;font-weight:700}
.step img{width:100%;max-height:240px;object-fit:contain;border-radius:var(--r-s);margin-top:8px;background:var(--soft)}
.step .b{white-space:pre-wrap;font-size:15px;margin-top:4px}
.hz-chips{margin:0 0 8px}
.hz-legend{background:var(--paper);border-radius:var(--r-s);padding:8px 10px;margin:0 0 8px;color:var(--sub);display:grid;gap:4px;line-height:1.5}
.train{background:var(--paper);border-radius:var(--r-m);padding:12px 14px;margin-bottom:8px;border-left:5px solid var(--sub)}
.train.ok{border-left-color:var(--g1)}.train.ng{border-left-color:var(--err);background:var(--err-bg)}
.train-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.train-st{font-weight:700}.train.ok .train-st{color:var(--g1)}.train.ng .train-st{color:var(--err)}
.train-d{font-size:14px;margin-top:6px;line-height:1.6}.train-f{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12.5px;color:var(--sub)}
.pmap-wrap{position:relative;margin:0 0 10px}
.pmap{height:300px;border-radius:var(--r-m);overflow:hidden;background:var(--soft);border:1px solid var(--rule);z-index:0}
.pmap-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:14px;pointer-events:none}
.pmap-bar{display:flex;align-items:center;gap:10px;margin:0 0 10px}.pmap-bar .btn{min-height:44px;padding:0 16px;font-size:15px}.pmap-bar .small{color:var(--sub)}
.pill.near{background:var(--g2-bg);color:var(--g2)}
.leaflet-popup-content{font-size:14px;line-height:1.5}
.place .addr{font-size:14px;color:var(--sub)}
.place details{margin-top:8px;font-size:14px}
.place summary{cursor:pointer;color:var(--gc);font-weight:700;padding:4px 0}
.place ul{margin:6px 0 0;padding-left:18px}
.lines{list-style:none;margin:8px 0 0;padding:0}.lines li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px dashed var(--rule)}.lines li b{white-space:nowrap}
.kv{margin:8px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:6px 12px}.kv dt{color:var(--sub);font-size:13px}.kv dd{margin:0;white-space:pre-wrap}
.hf-path{font-size:13px;color:var(--sub);margin:0 0 10px}.hf-now{background:var(--paper);border-radius:var(--r-m);padding:14px;box-shadow:var(--shadow)}
.hf-ans{display:grid;gap:10px}.hf-call{display:grid;place-items:center;text-decoration:none;margin:12px 0;--gc:var(--err);font-size:18px}
.only-member{display:none!important}body.member .nav .wrap{grid-template-columns:1fr 1fr}body.member .only-member{display:flex!important}body.member .no-member{display:none!important}

/* ================= サーバー呼び出し（GETのみ） ================= */
async function api(params, override){
  if (isDemo()) return demoApi(params);
  const c = override || cfg;
  const auth = idToken && !override ? { idt:idToken } : { key:c.key };
  const url = c.url + '?' + new URLSearchParams({ ...params, ...auth });
  if (url.length > 7500) throw new Error('文章が長すぎて一度に送れません（約' + url.length + '文字）。長い欄を少し短くしてください。');
  let r;
  try { r = await fetch(url); } catch (e) { throw new Error('通信できませんでした。電波の良い場所でもう一度お試しください。'); }
  const j = await r.json().catch(() => { throw new Error('サーバーの応答を読み取れませんでした。設定のURLを確認してください。'); });
  if (!j.ok) throw new Error(j.error || 'エラーが発生しました');
  return j;
}

async function apiPost(body){
  if (isDemo()) return demoApi(body);
  let r;
  const auth = idToken ? { idt:idToken } : { key:cfg.key };
  try { r = await fetch(cfg.url, { method:'POST', body: JSON.stringify({ ...body, ...auth }) }); }
  catch (e) { throw new Error('通信できませんでした。電波の良い場所でもう一度お試しください。'); }
  const j = await r.json().catch(() => { throw new Error('サーバーの応答を読み取れませんでした。少し待ってからもう一度お試しください。'); });
  if (!j.ok) throw new Error(j.error || 'エラーが発生しました');
  return j;
}

/* 写真を縮小してから送る（長い辺 1280px・JPEG） */
function shrinkImage(file, maxSize){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = maxSize || 1280, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const dataUrl = c.toDataURL('image/jpeg', 0.8);
      resolve({ dataUrl, b64: dataUrl.split(',')[1], mime:'image/jpeg' });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('この写真は読み込めませんでした')); };
    img.src = url;
  });
}

    if(pending.length) text="⚠️ 未了の手続きがあります："+pending.join("、")+"。実施前に必ず完了してください。\n\n"+text;
    return {text, tone: pending.length?"warn":"ok"};

};

const mnContacts = () => Object.assign({}, MN_CONTACTS_DEFAULT, LS.get('fb_mn_contacts', {}));
const mnCtx = () => MN.stack.length ? MN.stack[MN.stack.length - 1].ctx : {};
function mnTmpl(t){
  if (!t) return t;
  const C = mnContacts();
  return t.replace(/\{\{(.+?)\}\}/g, (m, k) => mnCtx()[k] != null ? mnTmpl(mnCtx()[k]) : C[k] != null ? C[k] : '');
}
/* 電話番号をタップ発信リンクに（「人権110番」の110は除外） */
function mnPhones(html){
  const tl = (n, l) => `<a class="mn-tel" href="tel:${n}">${l}</a>`;
  html = html.replace(/0570-003-110/g, tl('0570003110', '0570-003-110')).replace(/人権110番/g, '人権11\u00010番')
    .replace(/119番/g, tl('119', '119番')).replace(/110番/g, tl('110', '110番')).replace(/#9110/g, tl('9110', '#9110')).replace(/189（/g, tl('189', '189') + '（');
  return html.replace(/\u0001/g, '');
}

function mnRender(){
  const top = MN.stack[MN.stack.length - 1];

    const t = mnTmpl(node.q).split('\n\n');

    if (t.length) html += `<div class="mn-guide">${mnPhones(esc(t.join('\n\n')))}</div>`;
    html += `<div class="mn-q">${mnPhones(esc(q))}</div><div class="mn-opts">${node.options.map((o, i) => `<button class="btn s wide mn-opt" data-i="${i}">${esc(o.label)}</button>`).join('')}</div>`;
  } else {
    const tone = node.tone || 'info';
    html += `<div class="mn-result ${tone}"><div class="mn-rl">${esc(MN_TONE[tone] || '')}</div>${mnPhones(esc(mnTmpl(node.text)))}</div>`;

    if (nums.length) html += `<div class="mn-calls">${nums.map(n => `<a class="btn p" href="tel:${n}" style="--gc:var(--err)">📞 ${n}番に電話</a>`).join('')}</div>`;
    html += `<div id="mnLogNote" class="small" style="color:var(--sub);margin:8px 2px"></div>`;
    const forms = getForms() || [];

    if (next.length) html += `<div class="sec-title">続けて記録する</div><div class="mn-next">${next.map(s =>
      `<a class="row" href="#/form/${encodeURIComponent(s)}" style="color:inherit;text-decoration:none"><span class="name">${esc(s)}</span>${ICON.chev}</a>`).join('')}</div>
      <button class="btn s wide" id="mnCopy" style="margin-top:8px">経過をコピー（記録に貼り付け用）</button>`;
    if (c.key === 'quake' || c.key === 'fire') html += `<div class="mn-nav" style="margin-top:10px"><a class="btn s" href="#/info/shelter">🗺 避難場所の地図</a><a class="btn s" href="#/contact">安否を報告する</a></div>`;
  }
  html += `<div class="mn-nav">${MN.stack.length > 1 ? '<button class="btn s" id="mnBack">ひとつ戻る</button>' : ''}<button class="btn s" id="mnRestart">最初から</button><a class="btn s" href="#/manual">メニュー</a></div>`;
  $('view').innerHTML = html;

  $('view').querySelectorAll('.mn-opt').forEach(b => b.onclick = () => {
    const opt = node.options[Number(b.dataset.i)];
    MN.answers.push({ q: mnShort(mnTmpl(node.q)), a: opt.label });

  if ($('mnBack')) $('mnBack').onclick = () => { MN.stack.pop(); MN.answers.pop(); mnRender(); };
  $('mnRestart').onclick = () => { MN.stack = [MN.stack[0]]; MN.answers = []; mnRender(); };

}

async function mnLog(node){

/* 署名パッド：指・ペン・マウス。保存時は余白を切り取ったPNG */
function sigPad(c){
  const ctx = c.getContext('2d'); let drawing = false, dirty = false, last = null;
  const fit = () => { const r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1; const old = dirty ? c.toDataURL() : null; c.width = r.width * d; c.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; ctx.lineWidth = 2.6; if (old) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = old; } };
  fit();
  const pt = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top, e.pressure || .5]; };
  c.addEventListener('pointerdown', e => { e.preventDefault(); c.setPointerCapture(e.pointerId); drawing = true; last = pt(e); ctx.beginPath(); ctx.arc(last[0], last[1], 1.2, 0, Math.PI * 2); ctx.fillStyle = '#111'; ctx.fill(); dirty = true; c.classList.add('on'); });
  c.addEventListener('pointermove', e => { if (!drawing) return; e.preventDefault(); const p = pt(e); ctx.lineWidth = e.pointerType === 'pen' ? 1.4 + p[2] * 2.6 : 2.6; ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; });
  const end = () => { drawing = false; };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end); c.addEventListener('pointerleave', end);
  return {
    el: c, empty: () => !dirty,
    clear(){ ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height); ctx.restore(); dirty = false; c.classList.remove('on'); },
    png(){
      const w = c.width, h = c.height, d = ctx.getImageData(0, 0, w, h).data;
      let x0 = w, y0 = h, x1 = 0, y1 = 0;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 < x0) return '';
      const pad = 8 * (window.devicePixelRatio || 1); x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w, x1 + pad); y1 = Math.min(h, y1 + pad);
      const o = document.createElement('canvas'); o.width = x1 - x0; o.height = y1 - y0;
      o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
      return o.toDataURL('image/png');
    }
  };
}

const groupOf = sheet => (getForms() || []).find(f => f.sheet === sheet)?.group || GROUPS[0];
const getPins = () => LS.get('fb_pins', []);
const getHistory = () => LS.get('fb_history', []);
function listDrafts(){
  return LS.keys().filter(k => k.indexOf('fb_draft_') === 0)
    .map(k => ({ sheet: k.slice(9), ...LS.get(k, {}) }))
    .filter(d => d.values && Object.values(d.values).some(v => String(v).trim()))
    .sort((a, b) => (b.ts || 0) - (a.ts || 0));
}
function updateDraftDot(){ const n = listDrafts().length; const d = $('draftDot'); d.hidden = !n; d.textContent = n; }

/* ================= ホーム ================= */
let homeTab = LS.get('fb_tab', GROUPS[0]);
async function showHome(){
  setTop({ title:'福祉ボット２' });
  const token = viewToken;
  const v = $('view');
  const draw = () => {
    const forms = getForms();
    const drafts = listDrafts();
    const todayCount = getHistory().filter(h => ymd(new Date(h.ts)) === ymd()).length;
    const d = jst();
    const week = '日月火水木金土'[d.getUTCDay()];
    let html = `<div class="today"><img class="logo" src="logo.png" alt="Fukushi 記録Bot II" width="84" height="84"><div><div class="date">${d.getUTCMonth() + 1}月${d.getUTCDate()}日（${week}）</div>
      <div class="stat">今日の送信 ${todayCount}件　下書き ${drafts.length}件</div></div></div>`;
    if (authError) html += `<div class="note err">${esc(authError)}</div>`;
    else if (!signedIn()) html += `<div class="note">LINEから開くと、そのまま使えます。<br>パソコンなどでは${liffReady() ? '<button class="link" style="padding:0" onclick="lineLogin()">LINEでログイン</button>するか、' : ''}<a class="link" style="padding:0" href="#/settings">設定</a>でアプリキーを入力してください。</div>`;
    else if (ME && ME.name) html = html.replace('<div class="stat">', `<div class="stat">${esc(ME.name)} さん${isAdmin() ? '<span class="admin-mark">管理者</span>' : ''}<br>`);
    if (isDemo()) html += `<div class="note">デモ表示です。入力しても記録はされません。</div>`;
    if (!authError) html += attendStrip();
    html += mnEntry();
    html += `<label class="search">${ICON.search}<input id="q" type="search" placeholder="帳票をさがす（例：欠席、面談）" aria-label="帳票をさがす"></label>`;
    if (!forms) { v.innerHTML = html + '<div class="empty">帳票の一覧を読み込んでいます…</div>'; return; }

    const pins = getPins().filter(p => forms.some(f => f.sheet === p));
    if (pins.length) {
      html += `<div class="sec-title">よく使う</div><div class="pins">${pins.map(p =>
        `<a class="pin ${gClass(groupOf(p))}" href="#/form/${encodeURIComponent(p)}" style="color:inherit;text-decoration:none">${esc(p)}</a>`).join('')}</div>`;
    }
    const groups = GROUPS.filter(g => forms.some(f => f.group === g));
    if (!groups.includes(homeTab)) homeTab = groups[0];
    html += `<div class="tabs" role="tablist">${groups.map(g =>
      `<button class="tab ${gClass(g)}" role="tab" aria-selected="${g === homeTab}" data-tab="${esc(g)}">${esc(TAB_LABEL[g] || g)}</button>`).join('')}</div>`;
    html += `<div class="sheet ${gClass(homeTab)}" id="list"></div>`;
    v.innerHTML = html;

    const renderList = q => {
      const list = $('list');
      const items = q ? forms.filter(f => f.sheet.includes(q)) : forms.filter(f => f.group === homeTab);
      list.className = 'sheet ' + gClass(q ? GROUPS[0] : homeTab);
      document.querySelector('.tabs').style.display = q ? 'none' : '';
      if (q) list.style.borderTopLeftRadius = 'var(--r-m)'; else list.style.borderTopLeftRadius = '';
      list.innerHTML = items.length ? items.map(f => {
        const hasDraft = drafts.some(d => d.sheet === f.sheet);
        return `<a class="row ${gClass(f.group)}" href="#/form/${encodeURIComponent(f.sheet)}" style="color:inherit;text-decoration:none">
          <span class="name">${esc(f.sheet)}${q ? `<span class="grp">${esc(f.group)}</span>` : ''}</span>
          ${hasDraft ? '<span class="tag">下書きあり</span>' : ''}${ICON.chev}</a>`;
      }).join('') : `<div class="empty">「${esc(q)}」に合う帳票はありません。</div>`;
    };
    renderList('');
    $('q').oninput = e => renderList(e.target.value.trim());
    v.querySelectorAll('.tab').forEach(t => t.onclick = () => { homeTab = t.dataset.tab; LS.set('fb_tab', homeTab); draw(); });
  };
  draw(); updateDraftDot();
  if (!signedIn()) return;
  refreshStrip(() => token === viewToken);
  try {
    const j = await api({ app:'forms' });
    LS.set('fb_forms_' + (isDemo() ? 'demo' : 'live'), j.forms);
    if (token === viewToken) { const q = $('q')?.value; draw(); if (q) { $('q').value = q; $('q').dispatchEvent(new Event('input')); } }
    prefetchFields(j.forms);
  } catch (e) {
    if (token !== viewToken) return;
    if (!getForms()) $('view').insertAdjacentHTML('beforeend', `<div class="note err">${esc(e.message)}</div>`);
    else toast('一覧を更新できませんでした（前回の一覧を表示中）');
  }
}

/* まだ開いていない帳票の入力欄を裏で先読み */
let prefetching = false;
async function prefetchFields(forms){
  if (prefetching || isDemo()) return;
  prefetching = true;
  try {
    for (const f of forms) {
      if (LS.get(fieldsKey(f.sheet), null)) continue;
      try { const j = await api({ app:'fields', sheet:f.sheet }); LS.set(fieldsKey(f.sheet), j.fields); } catch (e) {}
    }
  } finally { prefetching = false; }
}

/* ================= 入力フォーム ================= */
let F = null; // 今開いているフォームの状態 { sheet, fields, values }
async function showForm(sheet){
  const group = groupOf(sheet);
  setTop({ title:sheet, back:true, group, pin:getPins().includes(sheet) });
  $('pinBtn').onclick = () => {
    let pins = getPins();
    const on = !pins.includes(sheet);
    pins = on ? [sheet, ...pins] : pins.filter(p => p !== sheet);
    LS.set('fb_pins', pins.slice(0, 8));
    setTop({ title:sheet, back:true, group, pin:on });
    toast(on ? 'よく使うに追加しました' : 'よく使うから外しました');
  };
  const token = viewToken;
  const cached = LS.get(fieldsKey(sheet), null);
  if (cached) {
    renderForm(sheet, cached);
    api({ app:'fields', sheet }).then(j => {
      LS.set(fieldsKey(sheet), j.fields);
      if (token === viewToken && JSON.stringify(j.fields) !== JSON.stringify(cached)) renderForm(sheet, j.fields, F.values);
    }).catch(() => {});
    return;
  }
  $('view').innerHTML = '<div class="empty">入力欄を準備しています…<br><span class="small">はじめて開く帳票は少し時間がかかります。</span></div>';
  try {
    const j = await api({ app:'fields', sheet });
    LS.set(fieldsKey(sheet), j.fields);
    if (token === viewToken) renderForm(sheet, j.fields);
  } catch (e) {
    if (token === viewToken) $('view').innerHTML = `<div class="note err">${esc(e.message)}</div><button class="btn s wide" onclick="route()">もう一度読み込む</button>`;
  }
}

function renderForm(sheet, fields, keepValues, edit){
  const group = groupOf(sheet);
  const draft = keepValues ? null : LS.get(draftKey(sheet), null);
  const values = keepValues || (draft ? { ...draft.values } : {});
  if (!draft && !keepValues) { const fd = fields.find(f => !f.hidden && f.type === 'date'); if (fd) values[fd.index] = ymd(); }
  const files = (F && F.sheet === sheet && keepValues) ? F.files : {};
  F = { sheet, fields, values, group, files, edit: edit || null };
  const vis = fields.filter(f => !f.hidden);

  let html = `<div class="${gClass(group)}">`;
  if (edit) html += `<div class="note">記録を修正しています（${esc(edit.label || '')}）。保存すると元の記録が書き換わります。</div>`;
  else {
    const priv = isPrivate(sheet);
    if (!priv || isAdmin()) html += `<a class="list-item" href="#/records/${encodeURIComponent(sheet)}" style="color:inherit;text-decoration:none;margin-top:12px"><div class="main"><div class="t" style="font-weight:400">これまでの記録を見る${priv ? '<span class="admin-mark">管理者</span>' : ''}</div><div class="m">さがす・修正する</div></div>${ICON.chev}</a>`;
    else html += `<div class="note">この帳票の過去の記録は、管理者だけが見られます。</div>`;
    if (draft && draft.at) html += `<div class="note">${esc(draft.at)} の下書きから続けています。</div>`;
    if (VOICE_FORMS[sheet] && !isMember()) html += `<button type="button" class="vc-start" id="vcOpen"><span class="vc-ic">${ICON_MIC}</span><span><b>面談を録音して下書きを作る</b><small>録音から「${esc(VOICE_FORMS[sheet])}」などを自動で書きます</small></span></button><div id="vcResult"></div>`;
  }
  html += `<div class="form-head"><span>${vis.length}項目</span><span id="count"></span></div>`;
  vis.forEach(f => { html += fieldHtml(f, values[f.index] ?? ''); });
  html += `<div class="bar"><span class="saved" id="saved">${edit ? '' : draft ? '下書き保存済み' : '入力は自動で下書き保存されます'}</span>
    <button class="btn p" id="send">${edit ? '修正内容を確認' : '内容を確認'}</button></div></div>`;
  $('view').innerHTML = html;
  bindForm();
  updateProgress();
  if ($('vcOpen')) $('vcOpen').onclick = () => openVoice(sheet);
}

function fieldHtml(f, raw){
  const id = 'f' + f.index, val = esc(raw), opts = f.options || [];
  const req = f.required ? '<span class="req">必須</span>' : '';
  let label = `<label for="${id}">${esc(f.label)}${req}</label>`;
  let body;
  if (f.multi && opts.length) {
    const sel = splitMulti(raw);
    label = `<div class="label" id="${id}l">${esc(f.label)}${req}<span class="hint">いくつでも選べます</span></div>`;
    body = `<div class="chips" role="group" aria-labelledby="${id}l">${opts.map(o =>
      `<button type="button" class="chip" data-f="${f.index}" data-v="${esc(o)}" data-mode="multi" aria-pressed="${sel.includes(o)}">${esc(o)}</button>`).join('')}</div>`;
  } else if (f.strict && opts.length > 8) {
    body = `<button type="button" class="picker" id="${id}" data-f="${f.index}" data-mode="pick">${raw ? `<span>${val}</span>` : '<span class="ph">選んでください</span>'}${ICON.down}</button>`;
  } else if (f.strict && opts.length) {
    label = `<div class="label" id="${id}l">${esc(f.label)}${req}</div>`;
    body = `<div class="chips" role="radiogroup" aria-labelledby="${id}l">${opts.map(o =>
      `<button type="button" class="chip" data-f="${f.index}" data-v="${esc(o)}" data-mode="one" aria-pressed="${raw === o}">${esc(o)}</button>`).join('')}</div>`;
  } else if (f.type === 'image') {
    const cur = F.files[f.index] ? null : (/^https?:/.test(String(raw)) ? { dataUrl: driveImg(raw, 400) } : null);
    const ph = F.files[f.index] || cur;
    label = `<div class="label">${esc(f.label)}${req}<span class="hint">写真は下書きに残りません</span></div>`;
    body = `<div class="photo">${ph ? `<img src="${ph.dataUrl}" alt="選んだ写真">` : ''}
      <label class="pbtn">${ph ? '撮り直す' : '写真を撮る・選ぶ'}<input type="file" accept="image/*" data-photo="${f.index}"></label>
      ${ph ? `<button type="button" class="link" style="color:var(--sub)" data-unphoto="${f.index}">外す</button>` : ''}</div>`;
  } else if (f.type === 'check') {
    label = `<div class="label" id="${id}l">${esc(f.label)}${req}</div>`;
    body = `<div class="chips" role="radiogroup" aria-labelledby="${id}l">${['はい','いいえ'].map(o => {
      const v = o === 'はい' ? 'TRUE' : 'FALSE';
      return `<button type="button" class="chip" data-f="${f.index}" data-v="${v}" data-mode="one" aria-pressed="${String(raw).toUpperCase() === v}">${o}</button>`; }).join('')}</div>`;
  } else if (f.type === 'textarea') {
    body = `<textarea class="in" id="${id}" data-f="${f.index}">${val}</textarea>`;
  } else {
    const t = { date:'date', time:'time', number:'number', datetime:'datetime-local' }[f.type] || 'text';
    const list = opts.length > 8 ? ` list="dl${f.index}"` : '';
    body = `<input class="in" id="${id}" data-f="${f.index}" type="${t}" value="${val}"${t === 'number' ? ' inputmode="decimal"' : ''}${list}>`;
    if (list) body += `<datalist id="dl${f.index}">${opts.map(o => `<option value="${esc(o)}">`).join('')}</datalist>`;
    if (t === 'datetime-local') body += `<div class="chips after"><button type="button" class="chip mini" data-now="${f.index}">今の時刻</button></div>`;
    if (t === 'date') body += `<div class="chips after"><button type="button" class="chip mini" data-date="0" data-f="${f.index}">今日</button><button type="button" class="chip mini" data-date="-1" data-f="${f.index}">昨日</button></div>`;
    else if (opts.length && opts.length <= 8) body += `<div class="chips after">${opts.map(o =>
      `<button type="button" class="chip mini" data-f="${f.index}" data-v="${esc(o)}" data-mode="fill">${esc(o)}</button>`).join('')}</div>`;
  }
  const has = f.type === 'image' ? !!(F.files[f.index] || String(raw).trim()) : !!String(raw).trim();
  return `<div class="field${has ? ' filled' : ''}" id="w${f.index}">${label}${body}</div>`;
}

function setValue(i, v){
  F.values[i] = v;
  const w = $('w' + i);
  if (w) { w.classList.toggle('filled', !!String(v).trim()); w.classList.remove('miss'); }
  saveDraft(); updateProgress();
}
let saveTimer;
function saveDraft(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!F || F.edit) return;
    const at = fmtTime(Date.now());
    LS.set(draftKey(F.sheet), { values:F.values, at, ts:Date.now() });
    const s = $('saved'); if (s) s.textContent = '下書き保存 ' + at.split(' ').pop();
    updateDraftDot();
  }, 400);
}
function updateProgress(){
  const vis = F.fields.filter(f => !f.hidden);
  const done = vis.filter(f => f.type === 'image' ? (F.files[f.index] || String(F.values[f.index] ?? '').trim()) : String(F.values[f.index] ?? '').trim()).length;
  const c = $('count'); if (c) c.textContent = `記入 ${done} / ${vis.length}`;
  const bar = $('prog').querySelector('i'); bar.style.width = (vis.length ? done / vis.length * 100 : 0) + '%';
}

function bindForm(){
  const v = $('view');
  v.querySelectorAll('input.in, textarea.in').forEach(el => {
    el.oninput = () => setValue(el.dataset.f, el.value);
    el.onchange = el.oninput;
  });
  v.querySelectorAll('.chip[data-mode]').forEach(ch => ch.onclick = () => {
    const i = ch.dataset.f, o = ch.dataset.v, mode = ch.dataset.mode;
    if (mode === 'multi') {
      const sel = splitMulti(F.values[i]);
      const k = sel.indexOf(o); if (k === -1) sel.push(o); else sel.splice(k, 1);
      ch.setAttribute('aria-pressed', k === -1);
      setValue(i, sel.join(','));
    } else if (mode === 'one') {
      const next = F.values[i] === o ? '' : o;
      v.querySelectorAll(`.chip[data-f="${i}"]`).forEach(c => c.setAttribute('aria-pressed', c.dataset.v === next));
      setValue(i, next);
    } else {
      const el = $('f' + i); el.value = o; setValue(i, o);
    }
  });
  v.querySelectorAll('.chip[data-date]').forEach(ch => ch.onclick = () => {
    const d = new Date(Date.now() + Number(ch.dataset.date) * 864e5);
    const el = $('f' + ch.dataset.f); el.value = ymd(d); setValue(ch.dataset.f, el.value);
  });
  v.querySelectorAll('[data-now]').forEach(ch => ch.onclick = () => {
    const el = $('f' + ch.dataset.now); el.value = jst().toISOString().slice(0, 16); setValue(ch.dataset.now, el.value);
  });
  v.querySelectorAll('[data-photo]').forEach(inp => inp.onchange = async () => {
    const file = inp.files && inp.files[0]; if (!file) return;
    const i = inp.dataset.photo;
    try { F.files[i] = await shrinkImage(file); } catch (e) { toast(e.message); return; }
    redrawField(i);
  });
  v.querySelectorAll('[data-unphoto]').forEach(b => b.onclick = () => { const i = b.dataset.unphoto; if (F.files[i]) delete F.files[i]; else F.values[i] = ''; redrawField(i); });
  v.querySelectorAll('.picker').forEach(p => p.onclick = () => openPicker(F.fields.find(f => String(f.index) === p.dataset.f)));
  $('send').onclick = openReview;
}

function redrawField(i){
  const f = F.fields.find(x => String(x.index) === String(i));
  const w = $('w' + i); if (!f || !w) return;
  w.outerHTML = fieldHtml(f, F.values[i] ?? '');
  bindForm(); updateProgress();
}

/* ===== 下から出るシート（JS） ===== */
function openSheet(title, body, foot, cls){
  $('bsTitle').textContent = title;
  $('bsBody').innerHTML = body;
  $('bsFoot').innerHTML = foot || '';
  $('bsheet').className = 'bsheet on ' + (cls || '');
  $('scrim').classList.add('on');
  setTimeout(() => ($('bsheet').querySelector('input,button') || $('bsheet')).focus(), 60);
}
function closeSheet(){ $('bsheet').classList.remove('on'); $('scrim').classList.remove('on'); }
$('scrim').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function openPicker(f){
  const opts = f.options || [];
  const cur = F.values[f.index] ?? '';
  const search = opts.length > 12 ? `<label class="search" style="margin-top:0">${ICON.search}<input id="pq" type="search" placeholder="名前の一部で絞り込み" aria-label="絞り込み"></label>` : '';
  openSheet(f.label, search + '<div id="plist"></div>',
    `<button class="btn s" id="pclear">選択をはずす</button><button class="btn s" id="pclose">閉じる</button>`, gClass(F.group));
  const draw = q => {
    const items = opts.filter(o => !q || o.includes(q));
    $('plist').innerHTML = items.length ? items.map(o =>
      `<button class="opt" data-v="${esc(o)}" aria-selected="${o === cur}">${esc(o)}</button>`).join('') : '<div class="empty">見つかりません</div>';
    $('plist').querySelectorAll('.opt').forEach(b => b.onclick = () => choose(b.dataset.v));
  };
  const choose = val => {
    setValue(f.index, val);
    const p = $('f' + f.index);
    p.innerHTML = (val ? `<span>${esc(val)}</span>` : '<span class="ph">選んでください</span>') + ICON.down;
    closeSheet(); p.focus();
  };
  draw('');
  if ($('pq')) $('pq').oninput = e => draw(e.target.value.trim());
  $('pclear').onclick = () => choose('');
  $('pclose').onclick = closeSheet;
}

/* ===== 送信前の確認 ===== */
function openReview(){
  const vis = F.fields.filter(f => !f.hidden);
  if (!vis.some(f => String(F.values[f.index] ?? '').trim()) && !Object.keys(F.files).length) { toast('まだ何も入力されていません'); return; }
  const missing = vis.filter(f => f.required && (f.type === 'image' ? !F.files[f.index] : !String(F.values[f.index] ?? '').trim()));
  if (missing.length) {
    missing.forEach(f => $('w' + f.index)?.classList.add('miss'));
    $('w' + missing[0].index)?.scrollIntoView({ behavior:'smooth', block:'center' });
    toast('必須の項目が空いています：' + missing.map(f => f.label).join('、'), 3600);
    return;
  }
  const filled = vis.filter(f => f.type === 'image' ? (F.files[f.index] || String(F.values[f.index] ?? '').trim()) : String(F.values[f.index] ?? '').trim());
  const show = f => {
    if (f.type === 'image') return `<img src="${F.files[f.index] ? F.files[f.index].dataUrl : esc(driveImg(F.values[f.index], 400))}" alt="" style="width:120px;border-radius:8px">`;
    const v = F.values[f.index];
    if (f.type === 'check') return String(v).toUpperCase() === 'TRUE' ? 'はい' : 'いいえ';
    if (f.type === 'datetime') return esc(String(v).replace('T', ' '));
    return esc(f.multi ? splitMulti(v).join('、') : v);
  };
  const rows = filled.map(f => `<dt>${esc(f.label)}</dt><dd>${show(f)}</dd>`).join('');
  const blanks = vis.length - filled.length;
  if (F.edit) {
    const o = F.edit.orig || {};
    const changed = vis.filter(f => F.files[f.index] || String(F.values[f.index] ?? '') !== String(o[f.index] ?? ''));
    const was = f => { const v = o[f.index]; return v === '' || v == null ? '（空欄）' : f.type === 'image' ? '（前の写真）' : f.type === 'check' ? (String(v).toUpperCase() === 'TRUE' ? 'はい' : 'いいえ') : esc(f.multi ? splitMulti(v).join('、') : String(v).replace('T', ' ')); };
    const now = f => (f.type === 'image' ? (F.files[f.index] || String(F.values[f.index] ?? '').trim()) : String(F.values[f.index] ?? '').trim()) ? show(f) : '（空欄）';
    const crow = changed.map(f => `<dt>${esc(f.label)}</dt><dd><span class="small" style="text-decoration:line-through">${was(f)}</span><br>${now(f)}</dd>`).join('');
    if (!changed.length && !F.edit.hasPdf) { toast('変更されていません'); return; }
    openSheet(changed.length ? `${changed.length}項目を修正しますか？` : '変更はありません',
      `${changed.length ? `<dl class="review">${crow}</dl>` : '<p class="small">項目は変わっていません。PDFだけ作り直すこともできます。</p>'}${F.edit.hasPdf ? `<label class="small" style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" id="rvRegen" checked style="width:20px;height:20px">修正した内容でPDFも作り直す</label>` : ''}`,
      `<button class="btn s" id="rvBack">戻って直す</button><button class="btn p" id="rvSend">修正を保存</button>`, gClass(F.group));
    $('rvBack').onclick = closeSheet;
    $('rvSend').onclick = submitEdit;
    return;
  }
  openSheet('この内容で送信しますか？',
    `<dl class="review">${rows}</dl>${blanks ? `<p class="small" style="margin-top:14px">未記入の項目が ${blanks} 件あります。そのまま送信できます。</p>` : ''}`,
    `<button class="btn s" id="rvBack">戻って直す</button><button class="btn p" id="rvSend">送信する</button>`, gClass(F.group));
  $('rvBack').onclick = closeSheet;
  $('rvSend').onclick = submitForm;
}

async function submitForm(){
  closeSheet();
  $('busy').classList.add('on');

      : `<div class="empty">${q ? '見つかりませんでした。' : 'まだ記録はありません。'}</div>`;
    $('rgyo').querySelectorAll('[data-gy]').forEach(b => b.onclick = () => { const el = $('gy_' + b.dataset.gy); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - 70, behavior:'smooth' }); });
    $('rmore').innerHTML = '';
  };
  const load = async reset => {
    if (reset) { page = 0; items = []; }
    try {
      if (mode === 'name') {
        if (!people) people = await api({ app:'recordPeople', sheet });
        if (token !== viewToken) return;
        if (!people.field) { REC_MODE = 'date'; return showRecords(sheet); }
        return drawPeople();
      }
      const j = await api({ app:'records', sheet, q, page, person: person || '' });
      if (token !== viewToken) return;
      items = items.concat(j.items || []);
      $('rcount').textContent = q ? `「${q}」で ${j.total}件` : `全 ${j.total}件（新しい順）`;
      $('rlist').innerHTML = items.length ? items.map(it => `<a class="card" href="#/record/${encodeURIComponent(sheet)}/${it.row}" style="display:block;color:inherit;text-decoration:none">

  };

  $('rq').oninput = e => { clearTimeout(t); t = setTimeout(() => { q = e.target.value.trim(); mode === 'name' && people ? drawPeople() : load(true); }, mode === 'name' ? 150 : 450); };
  load(true);
}

/* 帳票のプレビュー：PDFを受け取り、PDF.js でページを画像にして表示・印刷 */
async function loadPdfJs(){
  if (window.pdfjsLib) return window.pdfjsLib;
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', () => window.pdfjsLib);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return window.pdfjsLib;
}
function previewRecord(sheet, row){ return pdfOverlay(sheet, () => api({ app:'recordPdf', sheet, row })); }
async function pdfOverlay(title, loader, msg){
  const ov = document.createElement('div');
  ov.className = 'pv'; ov.id = 'pv';
  ov.innerHTML = `<div class="pv-bar"><button class="btn s" id="pvClose">閉じる</button><span class="pv-t">${esc(title)}</span><button class="btn p" id="pvPrint" style="--gc:var(--brand)" disabled>印刷</button></div>
    <div class="pv-body" id="pvBody"><div class="empty" style="color:#fff"><div class="spin" style="margin:0 auto 12px"></div>${msg || 'テンプレートに書いています…'}<br><span class="small" style="color:#ddd">10〜20秒ほどかかります</span></div></div>`;
  document.body.appendChild(ov);
  document.body.classList.add('pv-on');
  const close = () => { ov.remove(); document.body.classList.remove('pv-on'); };
  $('pvClose').onclick = close;
  try {
    const [j, lib] = await Promise.all([loader(), loadPdfJs()]);
    if (!document.getElementById('pv')) return;
    const body = $('pvBody'); body.innerHTML = '';
    let blobUrl = '';
    for (const f of j.files || []) {
      const bin = Uint8Array.from(atob(f.b64), c => c.charCodeAt(0));
      blobUrl = blobUrl || URL.createObjectURL(new Blob([bin], { type:'application/pdf' }));
      const pdf = await lib.getDocument({ data: bin }).promise;
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const vp = page.getViewport({ scale: 2 });
        const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
        const img = new Image(); img.src = c.toDataURL('image/png'); img.alt = f.name + ' ' + i + 'ページ'; img.className = 'pv-page';
        body.appendChild(img);
      }
    }
    if (j.url) body.insertAdjacentHTML('afterbegin', `<div class="note" style="margin:0 0 12px;background:var(--g1-bg);color:var(--g1)">${esc(j.message || '保存しました')}　<a class="link" style="padding:0" href="${esc(j.url)}" target="_blank" rel="noopener">ドライブで開く</a></div>`);
    if (blobUrl) body.insertAdjacentHTML('beforeend', `<a class="pv-open" href="${blobUrl}" target="_blank" rel="noopener" download="${esc((j.files[0] || {}).name || 'preview.pdf')}">PDFファイルとして開く・保存</a>`);
    $('pvPrint').disabled = false;
    $('pvPrint').onclick = () => window.print();
  } catch (e) { $('pvBody').innerHTML = `<div class="note err" style="margin:16px">${esc(e.message)}</div>`; }
}

/* Googleドライブの画像URL（uc?export=view など）を、表示できるサムネイルURLに変換 */
function driveImg(url, size){
  const u = String(url || '').trim();
  const id = (u.match(/[?&]id=([\w-]{10,})/) || u.match(/\/d\/([\w-]{10,})/) || [])[1];
  if (id && /drive\.google|googleusercontent/.test(u)) return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + (size || 600);
  return u;
}

/* 熱中症の対応手順：いまの状態を選ぶと、次にやることだけを出す */
let heatAll = false;
const HEAT_FLOW = {

  '意識異常':          { cond:'意識異常', call:true, a:[['救急車を待つ間：冷却を続ける', '作業離脱・身体冷却']] },
  '意識正常':          { cond:'意識正常', q:'自分で水分をとれましたか？', a:[['とれた → 様子を見る', '経過観察'], ['とれない・吐いてしまう', '医療機関搬送', 'err']] },

};
const heatFlowOk = items => items.some(it => it.cond === '症状確認');
function heatFlow(items, key, path, viewId, data){
  const st = HEAT_FLOW[key]; const it = items.find(x => x.cond === st.cond);

  const crumbs = path.map(k => HEAT_FLOW[k].cond || '').filter(Boolean);

  if (it) h += `<div class="step hf-now"><div class="n">${esc(String(it.step || '').replace(/\D/g, '') || '・')}</div><div><div class="t" style="font-weight:700;font-size:18px">${esc(it.title)}</div>
    <div class="b">${esc(it.body)}</div>${it.img ? `<img src="${esc(driveImg(it.img, 800))}" alt="" loading="lazy" onerror="this.remove()">` : ''}</div></div>`;
  else if (st.msg) h += `<div class="card"><div class="b">${esc(st.msg)}</div></div>`;
  if (st.call) h += `<a class="btn p wide hf-call" href="tel:119">📞 119番に電話する</a>`;
  if (st.q) h += `<div class="sec-title">${esc(st.q)}</div>`;
  h += `<div class="hf-ans">${(st.a || []).map((a, i) => `<button class="btn ${a[2] ? 'p' : 's'} wide" data-go="${i}"${a[2] ? ` style="--gc:var(--${a[2]})"` : ''}>${esc(a[0])}</button>`).join('')}</div>
    <div class="row2" style="margin-top:14px">${path.length ? '<button class="btn s" id="hfPrev">ひとつ戻る</button><button class="btn s" id="hfReset">最初から</button>' : ''}<button class="btn s" id="hfAll">手順を全部見る</button></div>`;
  box.innerHTML = h;
  box.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { heatFlow(items, st.a[b.dataset.go][1], [...path, key], viewId, data); window.scrollTo(0, 0); });
  if ($('hfPrev')) $('hfPrev').onclick = () => heatFlow(items, path[path.length - 1], path.slice(0, -1), viewId, data);
  if ($('hfReset')) $('hfReset').onclick = () => heatFlow(items, 'start', [], viewId, data);
  $('hfAll').onclick = () => { heatAll = true; renderView(viewId, data); };
}

/* 「33.5465, 130.2312」→ [緯度, 経度]（順番が逆でも直す） */
function parseGeo(g){
  const m = String(g || '').match(/-?\d+(?:\.\d+)?/g);
  if (!m || m.length < 2) return null;
  let a = Number(m[0]), b = Number(m[1]);
  if (Math.abs(a) > 90) [a, b] = [b, a];
  return isFinite(a) && isFinite(b) && (a || b) ? [a, b] : null;
}
function geoKm(p, q){
  const R = 6371, r = x => x * Math.PI / 180, dLa = r(q[0] - p[0]), dLo = r(q[1] - p[1]);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(p[0])) * Math.cos(r(q[0])) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js', () => window.L && L.map);
}

function bindPlaces(items){
  let area = '', here = null, cap = PLACE_CAP, map = null, layer = null, hereMk = null, fitted = false;

    const q = ($('pq2').value || '').trim();
    let list = items.filter(it => (!area || String(it.area).indexOf(area) === 0) && (!q || (it.title + it.addr + it.area + (it.sub || '')).includes(q)));
    if (here) { list.forEach(it => it._km = it._ll ? geoKm(here, it._ll) : 1e9); list = list.slice().sort((a, b) => a._km - b._km); }
    return list;
  };

    if (!map) return;

    list.forEach(it => {
      if (!it._ll) return;

      mk.addTo(layer); pts.push(it._ll);
    });
    if (here) pts.push(here);
    if (here && list[0] && list[0]._ll) map.fitBounds(L.latLngBounds([here, ...list.slice(0, 5).filter(x => x._ll).map(x => x._ll)]).pad(.2), { maxZoom: 15 });
    else if (pts.length && (!fitted || area || $('pq2').value)) { map.fitBounds(L.latLngBounds(pts).pad(.1), { maxZoom: 15 }); fitted = true; }

      return `<div class="card place" id="pl${it._i}"><div class="t">${esc(it.title)}${it.tag ? `<span class="pill">${esc(it.tag)}</span>` : ''}${here && it._km < 1e8 ? `<span class="pill near">約${it._km.toFixed(1)}km</span>` : ''}</div>
        <div class="addr">${esc(it.addr || it.area)}</div>${it.sub ? `<div class="small">対象：${esc(it.sub)}</div>` : ''}
        ${needs.length ? `<details open><summary>今必要なもの（${needs.length}件）</summary><ul>${needs.map(n => `<li>${esc(n.what)}${n.level ? `（緊急度${esc(n.level)}）` : ''}${pic(n)}<span class="small">　${esc(n.who || '')} ${esc(n.date || '')}</span></li>`).join('')}</ul></details>` : ''}
        ${coms.length ? `<details><summary>届けます・応援（${coms.length}件）</summary><ul>${coms.map(r => `<li>${esc(r.text)}${pic(r)}<span class="small">　${esc(r.who || '')} ${esc(r.date || '')}</span></li>`).join('')}</ul></details>` : ''}
        ${revs.length ? `<details><summary>現地の声（${revs.length}件）</summary><ul>${revs.map(r => `<li>${r.title ? '<b>' + esc(r.title) + '</b> ' : ''}${esc(r.text)}${pic(r)}<span class="small">　${esc(r.who || '')} ${esc(r.date || '')}</span></li>`).join('')}</ul></details>` : ''}
        <div class="acts">${it._ll ? `<button class="link" data-fly="${it._i}">地図で場所を見る</button>` : ''}<a class="link" href="${map}" target="_blank" rel="noopener">Googleマップ</a>
          <button class="link" data-post="shelterReview" data-target="${esc(it.title)}">口コミを書く</button>
          <button class="link" data-post="shelterNeed" data-target="${esc(it.title)}">必要なものを登録</button>

    }).join('') : '<div class="empty">合う避難場所はありません。</div>') + (all.length > cap ? `<button class="btn s wide" id="pMore">あと${all.length - cap}件を表示</button>` : '');
    bindPosts('shelter');
    if ($('pMore')) $('pMore').onclick = () => { cap += PLACE_CAP * 2; draw(); };
    $('plist2').querySelectorAll('[data-fly]').forEach(b => b.onclick = () => {
      const it = items[Number(b.dataset.fly)]; if (!map || !it._ll) return;
      $('pmap').scrollIntoView({ behavior:'smooth', block:'center' });
      map.setView(it._ll, 16);
      layer.eachLayer(m => { const ll = m.getLatLng(); if (ll.lat === it._ll[0] && ll.lng === it._ll[1]) m.openPopup(); });
    });
  };
  $('pq2').oninput = () => { cap = PLACE_CAP; draw(); };
  $('pNear').onclick = () => {
    if (!navigator.geolocation) { toast('この端末では現在地を使えません'); return; }
    $('pNear').disabled = true; $('pNear').textContent = '📍 現在地を確認中…';
    navigator.geolocation.getCurrentPosition(pos => {
      here = [pos.coords.latitude, pos.coords.longitude]; cap = PLACE_CAP;
      $('pNear').disabled = false; $('pNear').textContent = '📍 現在地を更新';
      if (map) { if (hereMk) hereMk.remove(); hereMk = L.circleMarker(here, { radius: 8, weight: 3, color: '#fff', fillColor: '#2e6fd8', fillOpacity: 1 }).bindTooltip('現在地').addTo(map); }
      draw();
    }, e => { $('pNear').disabled = false; $('pNear').textContent = '📍 現在地から近い順'; toast(e.code === 1 ? '位置情報の利用が許可されていません（設定で許可してください）' : '現在地を取得できませんでした'); }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  };
  $('pmap').addEventListener('click', e => { const g = e.target.closest('[data-goto]'); if (!g) return; e.preventDefault(); const el = $('pl' + g.dataset.goto); if (el) { if (!el.isConnected) return; el.scrollIntoView({ behavior:'smooth', block:'start' }); } else { cap = 1e6; draw(); const el2 = $('pl' + g.dataset.goto); if (el2) el2.scrollIntoView({ behavior:'smooth', block:'start' }); } });
  const token = viewToken;
  loadLeaflet().then(() => {
    if (token !== viewToken || !$('pmap')) return;
    map = L.map('pmap', { preferCanvas: true, zoomControl: true, attributionControl: true }).setView([33.557, 130.196], 12);
    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>' }).addTo(map);
    const hz = {};
    HZ_LAYERS.forEach(h => { hz[h.id] = L.layerGroup(h.tiles.map(t => L.tileLayer(HZ_SRC + t + '/{z}/{x}/{y}.png', { maxNativeZoom: 17, maxZoom: 18, opacity: .65, attribution: '<a href="https://disaportal.gsi.go.jp/hazardmap/copyright/opendata.html" target="_blank" rel="noopener">ハザードマップポータル</a>' }))); });
    const on = new Set(LS.get('fb_hz', []));
    const syncHz = () => {
      HZ_LAYERS.forEach(h => { const b = $('view').querySelector(`[data-hz="${h.id}"]`); if (b) b.setAttribute('aria-pressed', on.has(h.id)); if (on.has(h.id)) hz[h.id].addTo(map); else hz[h.id].remove(); });
      const lg = HZ_LAYERS.filter(h => on.has(h.id));
      $('hzLegend').hidden = !lg.length;
      $('hzLegend').innerHTML = lg.map(h => `<div><b style="color:${h.c}">${h.label}</b>　${esc(h.legend)}</div>`).join('') + (lg.length ? '<div>出典：国土交通省・国土地理院「重ねるハザードマップ」（<a class="link" style="padding:0;min-height:0" href="https://disaportal.gsi.go.jp/maps/" target="_blank" rel="noopener">詳しい凡例はこちら</a>）。市のハザードマップもあわせて確認してください。</div>' : '');
      LS.set('fb_hz', [...on]);
      if (layer) layer.eachLayer(m => m.bringToFront && m.bringToFront());
    };
    $('view').querySelectorAll('[data-hz]').forEach(b => b.onclick = () => { const id = b.dataset.hz; if (on.has(id)) on.delete(id); else on.add(id); syncHz(); });
    layer = L.layerGroup().addTo(map);
    syncHz();
    $('pmapMsg').remove();
    draw();
  }).catch(e => { if ($('pmapMsg')) $('pmapMsg').textContent = '地図を表示できませんでした（' + e.message + '）'; });
  $('view').querySelectorAll('[data-area]').forEach(b => b.onclick = () => {
    area = area === b.dataset.area ? '' : b.dataset.area;
    $('view').querySelectorAll('[data-area]').forEach(x => x.setAttribute('aria-pressed', x.dataset.area === area));
    draw();
  });
  draw();
}

/* ================= 出退勤 ================= */
const AT_STATE = {
  none:   { label:'未出勤',   color:'var(--sub)' },
  notice: { label:'連絡済み', color:'var(--warn)' },
  in:     { label:'出勤中',   color:'var(--g1)' },
  away:   { label:'離席中',   color:'var(--g3)' },
  out:    { label:'退勤済み', color:'var(--g2)' }
};
const AT_REASONS = { late:['電車遅延','バス遅延','通院のため','体調不良','その他'], absent:['体調不良','家庭の事情','悪天候・災害','通院のため','その他'], early:['体調不良','家庭の事情','通院のため','その他'] };
const fmtMin = m => m ? (Math.floor(m / 60) ? Math.floor(m / 60) + '時間' : '') + (m % 60 ? (m % 60) + '分' : (Math.floor(m / 60) ? '' : '0分')) : '0分';
const atKey = () => 'fb_attend_' + (isDemo() ? 'demo' : 'live');

/* 位置を取る（だめでも打刻は止めない） */
function getPos(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res({ lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy }), () => res(null), { enableHighAccuracy:true, timeout:8000, maximumAge:30000 });
  });
}

async function showAttend(){
  setTop({ title:'出退勤', back: !isMember() });

  if (ME && ME.via !== 'line' && !isDemo()) { v.innerHTML = '<div class="note">出退勤の打刻は、LINEから開いたときに使えます（本人確認のため）。</div>'; return; }

  if (cached) drawAttend(cached); else v.innerHTML = '<div class="empty">読み込んでいます…</div>';

let atPickup = '';
function drawAttend(j){
  const t = j.today || {};
  const st = AT_STATE[t.state] || AT_STATE.none;
  const member = j.member;
  if (!atPickup) atPickup = j.lastPickup || '往復';
  const d = jst();
  const clock = String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
  let sub = '';
  if (t.state === 'in' || t.state === 'away') sub = `${esc(t.inTime)} 出勤　はたらいた時間 ${fmtMin(t.workMin)}${t.awayMin ? `（離席 ${fmtMin(t.awayMin)}）` : ''}`;
  else if (t.state === 'out') sub = `${esc(t.inTime)}〜${esc(t.outTime)}　${fmtMin(t.workMin)}`;
  else if (t.notes && t.notes.length) sub = esc(t.notes.join('／'));
  else sub = `${d.getUTCMonth() + 1}月${d.getUTCDate()}日（${'日月火水木金土'[d.getUTCDay()]}）`;

  let html = '';
  if (j.test) html += '<div class="note">テストモード（LINE_MUTE=1）：打刻は「打刻ログ（テスト）」に記録され、本番の利用者ログには入りません。</div>';
  html += `<div class="at-hero" style="--sc:${st.color}"><div style="font-weight:700">${esc(j.name || (ME && ME.name) || '')} さん</div>
    <div class="clock" id="atClock">${clock}</div><div style="margin:6px 0"><span class="st">${st.label}</span></div><div class="sub">${sub}</div>`;
  if (t.state === 'none' || t.state === 'notice') {
    if (member) html += `<div class="sec-title" style="text-align:left;margin-top:16px">送迎</div><div class="chips" id="atPick">${['往復','往','復','無し'].map(k =>
      `<button class="chip" data-pk="${k}" aria-pressed="${k === atPickup}" style="--gc:var(--g1);flex:1;text-align:center">${k}</button>`).join('')}</div>`;
    html += `<button class="at-big" style="--bc:var(--g1)" data-k="in">出勤する</button>
      <div class="at-row"><button class="btn s" data-k="tele">テレワーク</button><button class="btn s" data-k="contact">遅れる・休む</button></div>`;
  } else if (t.state === 'in') {
    html += `<button class="at-big" style="--bc:var(--g2)" data-k="out">退勤する</button>
      <div class="at-row"><button class="btn s" data-k="away">離席する</button><button class="btn s" data-k="contact">連絡する</button></div>`;
  } else if (t.state === 'away') {
    html += `<button class="at-big" style="--bc:var(--g3)" data-k="back">席に戻る</button>
      <div class="at-row"><button class="btn s" data-k="out">退勤する</button><button class="btn s" data-k="contact">連絡する</button></div>`;
  } else {
    html += `<div class="small" style="margin-top:12px">おつかれさまでした。</div><div class="at-row"><button class="btn s" data-k="contact">連絡する</button>${member ? '<button class="btn s" data-k="mendan">面談の時間</button>' : '<span></span>'}</div>`;
  }
  if (member && (t.state === 'in' || t.state === 'away')) html += `<button class="btn s wide" data-k="mendan" style="margin-top:10px;min-height:46px">面談の時間を記録する</button>`;
  if (qrToken()) html += `<div class="small" style="margin-top:12px;color:var(--g1);font-weight:700">✓ 事業所のQRコードを確認しました</div>`;
  else if (canScan() && t.state !== 'out') html += `<button class="btn s wide" id="atScan" style="margin-top:10px">QRコードを読み取って打刻する</button>`;
  html += `</div>`;
  if (!j.office) html += `<div class="small" style="margin:4px 2px 10px">位置も一緒に記録します（事業所の位置は未設定）。</div>`;
  html += `<div class="small" style="margin:4px 2px 10px">時刻は15分単位で記録します（出勤は切り上げ、退勤は切り捨て）。</div>`;
  if (j.book) html += `<a class="list-item" href="#/book/${encodeURIComponent(j.name)}" style="color:inherit;text-decoration:none;--gc:var(--g2)"><div class="main"><div class="t">自分の出勤簿を見る</div><div class="m">今月の出勤・退勤・送迎</div></div>${ICON.chev}</a>`;
  if ((t.logs || []).length) html += `<div class="sec-title">今日の記録</div><div class="box">${t.logs.map(l => `<div style="display:flex;gap:12px;padding:4px 0"><span class="n" style="font-variant-numeric:tabular-nums;color:var(--sub)">${esc(l.time)}</span><span>${esc(l.log)}</span></div>`).join('')}</div>`;
  if ((j.recent || []).length) html += `<div class="sec-title">これまで</div><div class="box">${j.recent.map(r => {

  }).join('')}</div>`;
  $('view').innerHTML = html;

  $('view').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {

    if (k === 'out' && member) return confirmSheet('退勤', '今日の出勤を、実績として記録します。よろしいですか？', 'はい、記録する', () => { closeSheet(); doPunch('out'); });
    doPunch(k);
  });
  if ($('atScan')) $('atScan').onclick = scanOfficeQr;
}

async function doPunch(kind, reason, hours){
  const btns = $('view').querySelectorAll('[data-k]'); btns.forEach(b => b.disabled = true);
  const label = { in:'出勤', tele:'テレワーク開始', out:'退勤', away:'離席', back:'着席', late:'遅延の連絡', absent:'欠席の連絡', early:'早退の連絡', mendan:'面談の時間' }[kind];
  toast(label + 'を記録しています…');
  try {
    const noPos = ['late', 'absent', 'early', 'tele', 'mendan'].includes(kind);
    const pos = noPos ? null : await getPos();
    const qr = noPos ? '' : qrToken();
    const j = await api({ app:'attendPunch', punch: JSON.stringify({ kind, pickup: atPickup, reason: reason || '', hours: hours || '', qr, ...(pos || {}) }) });
    LS.set(atKey(), j);
    if (location.hash.startsWith('#/attend')) drawAttend(j);
    const pj = j.punched || {};
    toast((pj.message || label + 'しました') + (/^QR確認/.test(pj.judge || '') ? '（QR確認済み）' : pj.judge === '事業所の外' ? '（事業所の外からの打刻として記録）' : pj.judge === '位置なし' && !noPos ? '（位置は取れませんでした）' : ''), 3500);
  } catch (e) { toast(e.message); btns.forEach(b => b.disabled = false); }
}

function openAttendContact(working){
  let kind = working ? 'early' : 'late', reason = '';
  const draw = () => `<div class="chips" style="margin-bottom:12px">${(working ? [['early','早退する']] : [['late','遅れる'],['absent','休む']]).map(([k, l]) =>

    <input class="in" id="rsOther" placeholder="その他の理由（任意）" style="margin-top:10px"><p class="small">管理者のLINEにも知らせます。</p>`;

  };
  bind();
  $('ctCancel').onclick = closeSheet;

  };
}

/* まとめて取込み：複数ファイル・複数ページのPDFを1枚ずつに分けて、順に読み取る */
let JS_BATCH = [];
async function loadPdfLib(){
  if (window.PDFLib) return window.PDFLib;
  await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js'; sc.onload = res; sc.onerror = () => rej(new Error('PDFの部品を読み込めませんでした')); document.head.appendChild(sc); });
  return window.PDFLib;
}
const fileToB64 = f => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = () => rej(new Error('ファイルを読み込めませんでした')); fr.readAsDataURL(f); });

async function readJissekiFiles(files){
  const items = [];
  $('jsOut').innerHTML = '<div class="box small">ファイルを準備しています…</div>';
  try {
    for (const f of files) {
      if (f.type === 'application/pdf') {
        const { PDFDocument } = await loadPdfLib();
        const src = await PDFDocument.load(await f.arrayBuffer(), { ignoreEncryption:true });
        const n = src.getPageCount();
        for (let i = 0; i < n; i++) {
          const one = await PDFDocument.create();
          const [pg] = await one.copyPages(src, [i]);
          one.addPage(pg);
          items.push({ label: f.name + (n > 1 ? `（${i + 1}/${n}枚目）` : ''), b64: await one.saveAsBase64(), mime:'application/pdf' });
        }
      } else if (/^image\//.test(f.type)) {
        const img = await shrinkImage(f, 2200);
        items.push({ label: f.name, b64: img.b64, mime: img.mime });
      }
    }
  } catch (err) { $('jsOut').innerHTML = `<div class="note err">${esc(err.message)}</div>`; return; }
  if (!items.length) { $('jsOut').innerHTML = '<div class="note err">画像かPDFを選んでください。</div>'; return; }
  const name = $('jsName').value, month = $('jsMonth').value;
  JS_BATCH = items.map(x => ({ ...x, state:'wait', res:null, err:'' }));
  drawBatch();
  // 2件ずつ並べて読み取る
  let next = 0;
  const worker = async () => {
    while (next < JS_BATCH.length) {
      const it = JS_BATCH[next++];
      it.state = 'run'; drawBatch();
      try { it.res = await apiPost({ app:'jissekiScan', name: items.length === 1 ? name : '', month, file: JSON.stringify({ b64: it.b64, mime: it.mime }) }); it.state = 'done'; }
      catch (err) { it.state = 'err'; it.err = err.message; }
      delete it.b64;
      drawBatch();
    }
  };
  await Promise.all([worker(), worker()]);
  if (JS_BATCH.length === 1 && JS_BATCH[0].res) openBatch(0);
}

function drawBatch(){
  if (!$('jsOut') || $('jsOut').dataset.detail === '1') return;
  const done = JS_BATCH.filter(x => x.state === 'done'), errs = JS_BATCH.filter(x => x.state === 'err');
  const need = done.filter(x => x.res.totals.issues || (x.res.headIssues || []).length);
  const running = JS_BATCH.length - done.length - errs.length;
  let html = `<div class="box"><h3>まとめて読み取り（${JS_BATCH.length}枚）</h3>
    <div class="counts" style="grid-template-columns:repeat(3,1fr)"><div style="background:var(--g2)"><b>${done.length}</b><span>読み取り済み</span></div><div style="background:${need.length ? 'var(--err)' : 'var(--g1)'}"><b>${need.length}</b><span>要確認の人</span></div><div style="background:${errs.length ? 'var(--warn)' : 'var(--g2)'}"><b>${errs.length}</b><span>読めなかった</span></div></div>
    ${running ? `<div class="small"><span class="spin" style="display:inline-block;width:16px;height:16px;border-width:3px;margin:0 6px -3px 0"></span>残り ${running}枚。1枚30秒ほどかかります。画面を閉じずにお待ちください。</div>` : '<div class="small">すべて読み取りました。名前を押すと、その人の結果を確認・修正できます。</div>'}</div>`;
  html += `<table class="at-tbl"><thead><tr><th style="width:42%">利用者</th><th>出勤（用紙／記録）</th><th>要確認</th></tr></thead><tbody>${JS_BATCH.map((x, i) => {
    if (x.state === 'wait') return `<tr><td>${esc(x.label)}</td><td colspan="2" class="small">待機中</td></tr>`;
    if (x.state === 'run') return `<tr><td>${esc(x.label)}</td><td colspan="2" class="small">読み取り中…</td></tr>`;
    if (x.state === 'err') return `<tr><td>${esc(x.label)}</td><td colspan="2" class="flag">${esc(x.err)}</td></tr>`;
    const r = x.res, n = r.totals.issues + (r.headIssues || []).length;
    return `<tr data-open="${i}" style="cursor:pointer${n ? ';background:var(--err-bg)' : ''}"><td><b class="link" style="padding:0">${esc(r.name || '（名前不明）')}</b><div class="small">${esc(String(r.month).replace('-', '/'))}${r.hasSys ? '' : '　記録が見つからない'}</div></td>
      <td class="n">${r.totals.paperDays}／${r.totals.sysDays}日</td><td class="n" style="${n ? 'color:var(--err);font-weight:700' : ''}">${n ? n + '件' : 'なし'}</td></tr>`;
  }).join('')}</tbody></table>`;
  $('jsOut').innerHTML = html;
  $('jsOut').querySelectorAll('[data-open]').forEach(tr => tr.onclick = () => openBatch(Number(tr.dataset.open)));
}

let JS_CUR = -1;
function openBatch(i){
  JS_CUR = i; JS_RES = JS_BATCH[i].res;
  $('jsOut').dataset.detail = JS_BATCH.length > 1 ? '1' : '';

}

    <div class="small">送迎（用紙／記録）：往 ${t.ou}／${t.sysOu}回　復 ${t.fuku}／${t.sysFuku}回　確認印なし ${t.stampMissing}日</div>
    ${j.hasSys ? '' : '<div class="note">この人のこの月の打刻・支援経過記録が見つかりません。用紙の中の確認だけ行っています（名前の書き方が違う場合は、利用者を選び直してください）。</div>'}
    ${(j.headIssues || []).map(x => `<div class="note">${esc(x)}</div>`).join('')}</div>`;

    : '<div class="note" style="background:var(--g1-bg);color:var(--g1)">すべての日で、用紙と記録が一致しました。</div>';

async function recheckJisseki(over){
  const j = JS_RES; if (!j) return;
  const rows = j.rows.map(r => ({ day:r.day, wd:r.wd, absent:r.absent, start:r.start, end:r.end, work:r.work, rest:r.rest, use:r.use, ou:r.ou, fuku:r.fuku, meal:r.meal, stamp:r.stamp, note:r.note, unsure:r.unsure }));
  try {
    toast('照合しています…');
    const res = await apiPost({ app:'jissekiCheck', name: over.name ?? j.name, month: over.month ?? j.month, rows: JSON.stringify(over.rows || rows),
      meta: JSON.stringify({ office:j.office, nameRead:j.nameRead, header:j.header, image:j.image }) });

/* ===== 感染症の待機期間（ガントチャート） ===== */
const qtKey = () => 'fb_qt_' + (isDemo() ? 'demo' : 'live');
const dnum = s => Math.round(new Date(s + 'T00:00:00+09:00').getTime() / 864e5);
const qtActive = j => (j.items || []).filter(x => x.start <= (j.today || ymd()) && x.end >= (j.today || ymd()));
let qtRange = 35;
async function showQuarantine(){
  setTop({ title:'感染症の待機期間', back:true });
  const token = viewToken;
  const cached = LS.get(qtKey(), null);
  if (cached) drawQuarantine(cached); else $('view').innerHTML = '<div class="empty">読み込んでいます…</div>';
  try { const j = await api({ app:'quarantine' }); LS.set(qtKey(), j); if (token === viewToken) drawQuarantine(j); }
  catch (e) { if (token === viewToken && !cached) $('view').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
}
function drawQuarantine(j){
  const today = j.today || ymd(), T = dnum(today);
  const items = j.items || [];
  const active = qtActive(j), soon = items.filter(x => x.start > today);
  const back = Math.round(qtRange * 0.4), from = T - back, to = from + qtRange - 1;
  const list = items.filter(x => dnum(x.end) >= from && dnum(x.start) <= to).sort((a, b) => a.start < b.start ? -1 : 1);
  const left = n => ((n - from) / qtRange * 100).toFixed(3) + '%';
  const md = n => { const x = new Date(n * 864e5 + 9 * 3600e3); return (x.getUTCMonth() + 1) + '/' + x.getUTCDate(); };
  const wdOf = n => new Date(n * 864e5 + 9 * 3600e3).getUTCDay();
  const step = qtRange <= 21 ? 2 : qtRange <= 42 ? 7 : 28;
  const st = x => x.end < today ? 'done' : x.start > today ? 'soon' : 'now';
  const remain = x => dnum(x.end) - T;
  let html = `<div style="padding-top:12px"><div class="counts" style="grid-template-columns:repeat(2,1fr)"><div style="background:${active.length ? 'var(--err)' : 'var(--g1)'}"><b>${active.length}</b><span>いま待機中</span></div><div style="background:var(--warn)"><b>${soon.length}</b><span>これから待機</span></div></div>`;
  if (active.length) html += `<div class="box">${active.map(x => `<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0"><span><b>${esc(x.name)}</b><span class="small">　${esc(x.kind)}</span></span><span class="small">${md(dnum(x.end))}まで（${remain(x) ? 'あと' + remain(x) + '日' : '今日まで'}）</span></div>`).join('')}</div>`;
  html += `<div class="chips" style="margin:6px 0 10px">${[[14,'2週間'],[35,'5週間'],[91,'3か月']].map(([n, l]) => `<button class="chip mini" data-rg="${n}" aria-pressed="${n === qtRange}" style="--gc:var(--g2)">${l}</button>`).join('')}</div>`;
  // チャート
  let grid = '', heads = '';
  for (let n = from; n <= to; n++) {
    const w = wdOf(n);
    if (w === 0 || w === 6) grid += `<div class="gt-we" style="left:${left(n)};width:${(100 / qtRange).toFixed(3)}%"></div>`;
    if ((n - from) % step === 0 && (n - from) / qtRange < 0.88) heads += `<div class="gt-tick" style="left:${left(n)}">${md(n)}</div>`;
  }
  const todayLine = T >= from && T <= to ? `<div class="gt-today" style="left:calc(${left(T)} + ${(50 / qtRange).toFixed(3)}%)"><span>今日</span></div>` : '';
  html += `<div class="gantt"><div class="gt-head"><div class="gt-name"></div><div class="gt-track">${heads}</div></div>
    ${list.length ? list.map((x, i) => {
      const s0 = Math.max(dnum(x.start), from), e0 = Math.min(dnum(x.end), to);
      const k = st(x);
      return `<div class="gt-row"><div class="gt-name"><b>${esc(x.name)}</b><span>${md(dnum(x.start))}〜${md(dnum(x.end))}</span></div><div class="gt-track">${grid}${todayLine}
        <button class="gt-bar gt-${k}" data-qi="${items.indexOf(x)}" style="left:${left(s0)};width:${((e0 - s0 + 1) / qtRange * 100).toFixed(3)}%" aria-label="${esc(x.name)} ${md(dnum(x.start))}から${md(dnum(x.end))}まで">${(e0 - s0 + 1) / qtRange > 0.2 ? (k === 'now' ? (remain(x) ? 'あと' + remain(x) + '日' : '今日まで') : k === 'soon' ? 'これから' : '') : ''}</button></div></div>`;
    }).join('') : `<div class="gt-row"><div class="gt-name"></div><div class="gt-track">${grid}${todayLine}<div class="small" style="position:absolute;inset:0;display:grid;place-items:center">この期間の待機はありません</div></div></div>`}
  </div>
  <div class="gt-legend"><span><i class="gt-now"></i>待機中</span><span><i class="gt-soon"></i>これから</span><span><i class="gt-done"></i>終了</span></div>
  <a class="btn p wide" href="#/form/${encodeURIComponent('待機期間管理')}" style="display:grid;place-items:center;text-decoration:none;margin-top:14px;--gc:var(--err)">待機期間を登録する</a></div>`;
  $('view').innerHTML = html;
  $('view').querySelectorAll('[data-rg]').forEach(b => b.onclick = () => { qtRange = Number(b.dataset.rg); drawQuarantine(j); });
  $('view').querySelectorAll('[data-qi]').forEach(b => b.onclick = () => {
    const x = items[Number(b.dataset.qi)];
    const days = dnum(x.end) - dnum(x.start) + 1;
    openSheet(x.name + ' さんの待機期間', `<p>${esc(x.kind)}<br>${md(dnum(x.start))} 〜 ${md(dnum(x.end))}（${days}日間）<br>${st(x) === 'now' ? (remain(x) ? 'あと' + remain(x) + '日' : '今日で終了') : st(x) === 'soon' ? (dnum(x.start) - T) + '日後から' : '終了しました'}${x.note ? '<br>' + esc(x.note) : ''}</p>`,
      `<button class="btn s" id="qtClose">閉じる</button><a class="btn p" href="#/record/${encodeURIComponent('待機期間管理')}/${x.row}" style="display:grid;place-items:center;text-decoration:none;--gc:var(--brand)">記録を開く・直す</a>`);
    $('qtClose').onclick = closeSheet;
  });
}

function loadScript(src, test){
