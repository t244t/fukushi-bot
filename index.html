    } catch (e) { if (token === viewToken) $('rlist').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
  };
  let t;
  $('rq').oninput = e => { clearTimeout(t); t = setTimeout(() => { q = e.target.value.trim(); mode === 'name' && people ? drawPeople() : load(true); }, mode === 'name' ? 150 : 450); };
  load(true);
}

/* 帳票のプレビュー：PDFを受け取り、PDF.js でページを画像にして表示・印刷 */
async function loadPdfJs(){
  if (window.pdfjsLib) return window.pdfjsLib;
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', () => window.pdfjsLib);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return window.pdfjsLib;
}
function previewRecord(sheet, row){ return pdfOverlay(sheet, () => api({ app:'recordPdf', sheet, row })); }
async function pdfOverlay(title, loader, msg){
  const ov = document.createElement('div');
  ov.className = 'pv'; ov.id = 'pv';
  ov.innerHTML = `<div class="pv-bar"><button class="btn s" id="pvClose">閉じる</button><span class="pv-t">${esc(title)}</span><button class="btn p" id="pvPrint" style="--gc:var(--brand)" disabled>印刷</button></div>
    <div class="pv-body" id="pvBody"><div class="empty" style="color:#fff"><div class="spin" style="margin:0 auto 12px"></div>${msg || 'テンプレートに書いています…'}<br><span class="small" style="color:#ddd">10〜20秒ほどかかります</span></div></div>`;
  document.body.appendChild(ov);
  document.body.classList.add('pv-on');
  const close = () => { ov.remove(); document.body.classList.remove('pv-on'); };
  $('pvClose').onclick = close;
  try {
    const [j, lib] = await Promise.all([loader(), loadPdfJs()]);
    if (!document.getElementById('pv')) return;
    const body = $('pvBody'); body.innerHTML = '';
    let blobUrl = '';
    for (const f of j.files || []) {
      const bin = Uint8Array.from(atob(f.b64), c => c.charCodeAt(0));
      blobUrl = blobUrl || URL.createObjectURL(new Blob([bin], { type:'application/pdf' }));
      const pdf = await lib.getDocument({ data: bin }).promise;
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const vp = page.getViewport({ scale: 2 });
        const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
        const img = new Image(); img.src = c.toDataURL('image/png'); img.alt = f.name + ' ' + i + 'ページ'; img.className = 'pv-page';
        body.appendChild(img);
      }
    }
    if (j.url) body.insertAdjacentHTML('afterbegin', `<div class="note" style="margin:0 0 12px;background:var(--g1-bg);color:var(--g1)">${esc(j.message || '保存しました')}　<a class="link" style="padding:0" href="${esc(j.url)}" target="_blank" rel="noopener">ドライブで開く</a></div>`);
    if (blobUrl) body.insertAdjacentHTML('beforeend', `<a class="pv-open" href="${blobUrl}" target="_blank" rel="noopener" download="${esc((j.files[0] || {}).name || 'preview.pdf')}">PDFファイルとして開く・保存</a>`);
    $('pvPrint').disabled = false;
    $('pvPrint').onclick = () => window.print();
  } catch (e) { $('pvBody').innerHTML = `<div class="note err" style="margin:16px">${esc(e.message)}</div>`; }
}

/* Googleドライブの画像URL（uc?export=view など）を、表示できるサムネイルURLに変換 */
function driveImg(url, size){
  const u = String(url || '').trim();
  const id = (u.match(/[?&]id=([\w-]{10,})/) || u.match(/\/d\/([\w-]{10,})/) || [])[1];
  if (id && /drive\.google|googleusercontent/.test(u)) return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + (size || 600);
  return u;
}

/* 熱中症の対応手順：いまの状態を選ぶと、次にやることだけを出す */
let heatAll = false;
const HEAT_FLOW = {

  '意識異常':          { cond:'意識異常', call:true, a:[['救急車を待つ間：冷却を続ける', '作業離脱・身体冷却']] },
  '意識正常':          { cond:'意識正常', q:'自分で水分をとれましたか？', a:[['とれた → 様子を見る', '経過観察'], ['とれない・吐いてしまう', '医療機関搬送', 'err']] },

};
const heatFlowOk = items => items.some(it => it.cond === '症状確認');
function heatFlow(items, key, path, viewId, data){

  if (it) h += `<div class="step hf-now"><div class="n">${esc(String(it.step || '').replace(/\D/g, '') || '・')}</div><div><div class="t" style="font-weight:700;font-size:18px">${esc(it.title)}</div>
    <div class="b">${esc(it.body)}</div>${it.img ? `<img src="${esc(driveImg(it.img, 800))}" alt="" loading="lazy" onerror="this.remove()">` : ''}</div></div>`;

  if (st.call) h += `<a class="btn p wide hf-call" href="tel:119">📞 119番に電話する</a>`;
  if (st.q) h += `<div class="sec-title">${esc(st.q)}</div>`;

    <div class="row2" style="margin-top:14px">${path.length ? '<button class="btn s" id="hfPrev">ひとつ戻る</button><button class="btn s" id="hfReset">最初から</button>' : ''}<button class="btn s" id="hfAll">手順を全部見る</button></div>`;
  box.innerHTML = h;
  box.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { heatFlow(items, st.a[b.dataset.go][1], [...path, key], viewId, data); window.scrollTo(0, 0); });
  if ($('hfPrev')) $('hfPrev').onclick = () => heatFlow(items, path[path.length - 1], path.slice(0, -1), viewId, data);
  if ($('hfReset')) $('hfReset').onclick = () => heatFlow(items, 'start', [], viewId, data);
  $('hfAll').onclick = () => { heatAll = true; renderView(viewId, data); };
}

/* 「33.5465, 130.2312」→ [緯度, 経度]（順番が逆でも直す） */
function parseGeo(g){
  const m = String(g || '').match(/-?\d+(?:\.\d+)?/g);
  if (!m || m.length < 2) return null;
  let a = Number(m[0]), b = Number(m[1]);
  if (Math.abs(a) > 90) [a, b] = [b, a];
  return isFinite(a) && isFinite(b) && (a || b) ? [a, b] : null;
}
function geoKm(p, q){
  const R = 6371, r = x => x * Math.PI / 180, dLa = r(q[0] - p[0]), dLo = r(q[1] - p[1]);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(p[0])) * Math.cos(r(q[0])) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js', () => window.L && L.map);
}

async function loadTrain(fresh){

}
function bindPlaces(items){
  let area = '', here = null, cap = PLACE_CAP, map = null, layer = null, hereMk = null, fitted = false;
  items.forEach((it, i) => { it._i = i; it._ll = parseGeo(it.geo); });
  const filtered = () => {
    const q = ($('pq2').value || '').trim();
    let list = items.filter(it => (!area || String(it.area).indexOf(area) === 0) && (!q || (it.title + it.addr + it.area + (it.sub || '')).includes(q)));
    if (here) { list.forEach(it => it._km = it._ll ? geoKm(here, it._ll) : 1e9); list = list.slice().sort((a, b) => a._km - b._km); }
    return list;
  };
  const drawMap = list => {
    if (!map) return;
    layer.clearLayers();
    const pts = [];
    list.forEach(it => {
      if (!it._ll) return;
      const need = (it.needs || []).length;
      const mk = L.circleMarker(it._ll, { radius: need ? 9 : 7, weight: 2, color: '#fff', fillColor: need ? '#b3352b' : '#2f6b4f', fillOpacity: .95 });
      mk.bindPopup(`<b>${esc(it.title)}</b>${it.tag ? `<br><small>${esc(it.tag)}</small>` : ''}<br>${esc(it.addr || '')}${need ? `<br><span style="color:#b3352b">今必要なもの ${need}件</span>` : ''}${here && it._km < 1e8 ? `<br>約${it._km.toFixed(1)}km` : ''}
        <div style="margin-top:6px;display:flex;gap:10px"><a href="https://www.google.com/maps/dir/?api=1&destination=${it._ll.join(',')}" target="_blank" rel="noopener">経路を見る</a><a href="#" data-goto="${it._i}">詳しく</a></div>`);
      mk.addTo(layer); pts.push(it._ll);
    });
    if (here) pts.push(here);
    if (here && list[0] && list[0]._ll) map.fitBounds(L.latLngBounds([here, ...list.slice(0, 5).filter(x => x._ll).map(x => x._ll)]).pad(.2), { maxZoom: 15 });
    else if (pts.length && (!fitted || area || $('pq2').value)) { map.fitBounds(L.latLngBounds(pts).pad(.1), { maxZoom: 15 }); fitted = true; }
  };
  const draw = () => {
    const all = filtered();
    const list = all.slice(0, cap);
    $('pCount').textContent = all.length + '件' + (all.filter(x => x._ll).length < all.length ? '（地図に出ないもの ' + (all.length - all.filter(x => x._ll).length) + '件）' : '');
    drawMap(all);
    $('plist2').innerHTML = (list.length ? list.map(it => {
      const map = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent((it.geo || '').replace(/\s/g, '') || it.addr || it.title);
      const needs = it.needs || [], revs = it.reviews || [], coms = it.comments || [];
      const pic = x => x.img && /^https?:/.test(x.img) ? ` <a class="link" style="padding:0" href="${esc(x.img)}" target="_blank" rel="noopener">写真</a>` : '';
      return `<div class="card place" id="pl${it._i}"><div class="t">${esc(it.title)}${it.tag ? `<span class="pill">${esc(it.tag)}</span>` : ''}${here && it._km < 1e8 ? `<span class="pill near">約${it._km.toFixed(1)}km</span>` : ''}</div>
        <div class="addr">${esc(it.addr || it.area)}</div>${it.sub ? `<div class="small">対象：${esc(it.sub)}</div>` : ''}
        ${needs.length ? `<details open><summary>今必要なもの（${needs.length}件）</summary><ul>${needs.map(n => `<li>${esc(n.what)}${n.level ? `（緊急度${esc(n.level)}）` : ''}${pic(n)}<span class="small">　${esc(n.who || '')} ${esc(n.date || '')}</span></li>`).join('')}</ul></details>` : ''}
        ${coms.length ? `<details><summary>届けます・応援（${coms.length}件）</summary><ul>${coms.map(r => `<li>${esc(r.text)}${pic(r)}<span class="small">　${esc(r.who || '')} ${esc(r.date || '')}</span></li>`).join('')}</ul></details>` : ''}
        ${revs.length ? `<details><summary>現地の声（${revs.length}件）</summary><ul>${revs.map(r => `<li>${r.title ? '<b>' + esc(r.title) + '</b> ' : ''}${esc(r.text)}${pic(r)}<span class="small">　${esc(r.who || '')} ${esc(r.date || '')}</span></li>`).join('')}</ul></details>` : ''}
        <div class="acts">${it._ll ? `<button class="link" data-fly="${it._i}">地図で場所を見る</button>` : ''}<a class="link" href="${map}" target="_blank" rel="noopener">Googleマップ</a>
          <button class="link" data-post="shelterReview" data-target="${esc(it.title)}">口コミを書く</button>
          <button class="link" data-post="shelterNeed" data-target="${esc(it.title)}">必要なものを登録</button>

      $('pmap').scrollIntoView({ behavior:'smooth', block:'center' });

      layer.eachLayer(m => { const ll = m.getLatLng(); if (ll.lat === it._ll[0] && ll.lng === it._ll[1]) m.openPopup(); });
    });
  };
  $('pq2').oninput = () => { cap = PLACE_CAP; draw(); };
  $('pNear').onclick = () => {
    if (!navigator.geolocation) { toast('この端末では現在地を使えません'); return; }

      if (map) { if (hereMk) hereMk.remove(); hereMk = L.circleMarker(here, { radius: 8, weight: 3, color: '#fff', fillColor: '#2e6fd8', fillOpacity: 1 }).bindTooltip('現在地').addTo(map); }
      draw();
    }, e => { $('pNear').disabled = false; $('pNear').textContent = '📍 現在地から近い順'; toast(e.code === 1 ? '位置情報の利用が許可されていません（設定で許可してください）' : '現在地を取得できませんでした'); }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  };
  $('pmap').addEventListener('click', e => { const g = e.target.closest('[data-goto]'); if (!g) return; e.preventDefault(); const el = $('pl' + g.dataset.goto); if (el) { if (!el.isConnected) return; el.scrollIntoView({ behavior:'smooth', block:'start' }); } else { cap = 1e6; draw(); const el2 = $('pl' + g.dataset.goto); if (el2) el2.scrollIntoView({ behavior:'smooth', block:'start' }); } });
  const token = viewToken;
  loadLeaflet().then(() => {
    if (token !== viewToken || !$('pmap')) return;
    map = L.map('pmap', { preferCanvas: true, zoomControl: true, attributionControl: true }).setView([33.557, 130.196], 12);
    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>' }).addTo(map);
    const hz = {};
    HZ_LAYERS.forEach(h => { hz[h.id] = L.layerGroup(h.tiles.map(t => L.tileLayer(HZ_SRC + t + '/{z}/{x}/{y}.png', { maxNativeZoom: 17, maxZoom: 18, opacity: .65, attribution: '<a href="https://disaportal.gsi.go.jp/hazardmap/copyright/opendata.html" target="_blank" rel="noopener">ハザードマップポータル</a>' }))); });
    const on = new Set(LS.get('fb_hz', []));
    const syncHz = () => {
      HZ_LAYERS.forEach(h => { const b = $('view').querySelector(`[data-hz="${h.id}"]`); if (b) b.setAttribute('aria-pressed', on.has(h.id)); if (on.has(h.id)) hz[h.id].addTo(map); else hz[h.id].remove(); });
      const lg = HZ_LAYERS.filter(h => on.has(h.id));
      $('hzLegend').hidden = !lg.length;
      $('hzLegend').innerHTML = lg.map(h => `<div><b style="color:${h.c}">${h.label}</b>　${esc(h.legend)}</div>`).join('') + (lg.length ? '<div>出典：国土交通省・国土地理院「重ねるハザードマップ」（<a class="link" style="padding:0;min-height:0" href="https://disaportal.gsi.go.jp/maps/" target="_blank" rel="noopener">詳しい凡例はこちら</a>）。市のハザードマップもあわせて確認してください。</div>' : '');
      LS.set('fb_hz', [...on]);
      if (layer) layer.eachLayer(m => m.bringToFront && m.bringToFront());
    };
    $('view').querySelectorAll('[data-hz]').forEach(b => b.onclick = () => { const id = b.dataset.hz; if (on.has(id)) on.delete(id); else on.add(id); syncHz(); });
    layer = L.layerGroup().addTo(map);
    syncHz();
    $('pmapMsg').remove();
    draw();
  }).catch(e => { if ($('pmapMsg')) $('pmapMsg').textContent = '地図を表示できませんでした（' + e.message + '）'; });
  $('view').querySelectorAll('[data-area]').forEach(b => b.onclick = () => {
    area = area === b.dataset.area ? '' : b.dataset.area;
    $('view').querySelectorAll('[data-area]').forEach(x => x.setAttribute('aria-pressed', x.dataset.area === area));
    draw();
  });
  draw();
}

function msgSheet(title, text){ openSheet(title, `<p>${esc(text)}</p>`, '<button class="btn p wide" id="mOk" style="--gc:var(--brand)">閉じる</button>'); $('mOk').onclick = closeSheet; }
function confirmSheet(title, text, okLabel, onOk, danger){
  openSheet(title, `<p>${esc(text)}</p>`, `<button class="btn s" id="cNo">やめる</button><button class="btn p" id="cOk" style="--gc:${danger ? 'var(--err)' : 'var(--brand)'}">${esc(okLabel)}</button>`);
  $('cNo').onclick = closeSheet;
  $('cOk').onclick = async () => { $('cOk').disabled = true; try { await onOk(); } finally { const b = $('cOk'); if (b) b.disabled = false; } };

/* ================= 出退勤 ================= */
const AT_STATE = {
  none:   { label:'未出勤',   color:'var(--sub)' },
  notice: { label:'連絡済み', color:'var(--warn)' },
  in:     { label:'出勤中',   color:'var(--g1)' },
  away:   { label:'離席中',   color:'var(--g3)' },
  out:    { label:'退勤済み', color:'var(--g2)' }
};
const AT_REASONS = { late:['電車遅延','バス遅延','通院のため','体調不良','その他'], absent:['体調不良','家庭の事情','悪天候・災害','通院のため','その他'], early:['体調不良','家庭の事情','通院のため','その他'] };
const fmtMin = m => m ? (Math.floor(m / 60) ? Math.floor(m / 60) + '時間' : '') + (m % 60 ? (m % 60) + '分' : (Math.floor(m / 60) ? '' : '0分')) : '0分';
const atKey = () => 'fb_attend_' + (isDemo() ? 'demo' : 'live');

/* 位置を取る（だめでも打刻は止めない） */
function getPos(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res({ lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy }), () => res(null), { enableHighAccuracy:true, timeout:8000, maximumAge:30000 });
  });
}

async function showAttend(){
  setTop({ title:'出退勤', back: !isMember() });
  const token = viewToken;
  const v = $('view');
  if (!signedIn() || authError) { v.innerHTML = `<div class="note${authError ? ' err' : ''}">${esc(authError || 'LINEから開くと打刻できます。')}</div>`; return; }
  if (ME && ME.via !== 'line' && !isDemo()) { v.innerHTML = '<div class="note">出退勤の打刻は、LINEから開いたときに使えます（本人確認のため）。</div>'; return; }
  const cached = LS.get(atKey(), null);
  if (cached) drawAttend(cached); else v.innerHTML = '<div class="empty">読み込んでいます…</div>';
  try {
    const j = await api({ app:'attendMe' });
    LS.set(atKey(), j);
    if (token === viewToken) drawAttend(j);
  } catch (e) { if (token === viewToken && !cached) v.innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
}

let atPickup = '';
function drawAttend(j){
  const t = j.today || {};
  const st = AT_STATE[t.state] || AT_STATE.none;
  const member = j.member;
  if (!atPickup) atPickup = j.lastPickup || '往復';
  const d = jst();
  const clock = String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
  let sub = '';
  if (t.state === 'in' || t.state === 'away') sub = `${esc(t.inTime)} 出勤　はたらいた時間 ${fmtMin(t.workMin)}${t.awayMin ? `（離席 ${fmtMin(t.awayMin)}）` : ''}`;
  else if (t.state === 'out') sub = `${esc(t.inTime)}〜${esc(t.outTime)}　${fmtMin(t.workMin)}`;
  else if (t.notes && t.notes.length) sub = esc(t.notes.join('／'));
  else sub = `${d.getUTCMonth() + 1}月${d.getUTCDate()}日（${'日月火水木金土'[d.getUTCDay()]}）`;

  let html = '';
  if (j.test) html += '<div class="note">テストモード（LINE_MUTE=1）：打刻は「打刻ログ（テスト）」に記録され、本番の利用者ログには入りません。</div>';
  html += `<div class="at-hero" style="--sc:${st.color}"><div style="font-weight:700">${esc(j.name || (ME && ME.name) || '')} さん</div>
    <div class="clock" id="atClock">${clock}</div><div style="margin:6px 0"><span class="st">${st.label}</span></div><div class="sub">${sub}</div>`;
  if (t.state === 'none' || t.state === 'notice') {
    if (member) html += `<div class="sec-title" style="text-align:left;margin-top:16px">送迎</div><div class="chips" id="atPick">${['往復','往','復','無し'].map(k =>
      `<button class="chip" data-pk="${k}" aria-pressed="${k === atPickup}" style="--gc:var(--g1);flex:1;text-align:center">${k}</button>`).join('')}</div>`;
    html += `<button class="at-big" style="--bc:var(--g1)" data-k="in">出勤する</button>
      <div class="at-row"><button class="btn s" data-k="tele">テレワーク</button><button class="btn s" data-k="contact">遅れる・休む</button></div>`;
  } else if (t.state === 'in') {
    html += `<button class="at-big" style="--bc:var(--g2)" data-k="out">退勤する</button>
      <div class="at-row"><button class="btn s" data-k="away">離席する</button><button class="btn s" data-k="contact">連絡する</button></div>`;
  } else if (t.state === 'away') {
    html += `<button class="at-big" style="--bc:var(--g3)" data-k="back">席に戻る</button>
      <div class="at-row"><button class="btn s" data-k="out">退勤する</button><button class="btn s" data-k="contact">連絡する</button></div>`;
  } else {
    html += `<div class="small" style="margin-top:12px">おつかれさまでした。</div><div class="at-row"><button class="btn s" data-k="contact">連絡する</button>${member ? '<button class="btn s" data-k="mendan">面談の時間</button>' : '<span></span>'}</div>`;
  }
  if (member && (t.state === 'in' || t.state === 'away')) html += `<button class="btn s wide" data-k="mendan" style="margin-top:10px;min-height:46px">面談の時間を記録する</button>`;
  if (qrToken()) html += `<div class="small" style="margin-top:12px;color:var(--g1);font-weight:700">✓ 事業所のQRコードを確認しました</div>`;
  else if (canScan() && t.state !== 'out') html += `<button class="btn s wide" id="atScan" style="margin-top:10px">QRコードを読み取って打刻する</button>`;
  html += `</div>`;
  if (!j.office) html += `<div class="small" style="margin:4px 2px 10px">位置も一緒に記録します（事業所の位置は未設定）。</div>`;
  html += `<div class="small" style="margin:4px 2px 10px">時刻は15分単位で記録します（出勤は切り上げ、退勤は切り捨て）。</div>`;
  if (j.book) html += `<a class="list-item" href="#/book/${encodeURIComponent(j.name)}" style="color:inherit;text-decoration:none;--gc:var(--g2)"><div class="main"><div class="t">自分の出勤簿を見る</div><div class="m">今月の出勤・退勤・送迎</div></div>${ICON.chev}</a>`;
  if ((t.logs || []).length) html += `<div class="sec-title">今日の記録</div><div class="box">${t.logs.map(l => `<div style="display:flex;gap:12px;padding:4px 0"><span class="n" style="font-variant-numeric:tabular-nums;color:var(--sub)">${esc(l.time)}</span><span>${esc(l.log)}</span></div>`).join('')}</div>`;
  if ((j.recent || []).length) html += `<div class="sec-title">これまで</div><div class="box">${j.recent.map(r => {
    const s2 = AT_STATE[r.state] || AT_STATE.none;
    const dd = new Date(r.date + 'T00:00:00+09:00');
    return `<div style="display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule)"><span><span class="at-dot" style="--sc:${s2.color}"></span>${dd.getMonth() + 1}/${dd.getDate()}（${'日月火水木金土'[dd.getDay()]}）</span>
      <span class="small" style="text-align:right">${r.inTime ? esc(r.inTime) + '〜' + esc(r.outTime || '') + '　' + fmtMin(r.workMin) : esc((r.notes || []).join('／') || s2.label)}</span></div>`;
  }).join('')}</div>`;
  $('view').innerHTML = html;
  $('view').querySelectorAll('[data-pk]').forEach(b => b.onclick = () => { atPickup = b.dataset.pk; $('view').querySelectorAll('[data-pk]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('view').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k === 'contact') return openAttendContact(t.state === 'in' || t.state === 'away');
    if (k === 'mendan') return openMendan();
    if (k === 'out' && member) return confirmSheet('退勤', '今日の出勤を、実績として記録します。よろしいですか？', 'はい、記録する', () => { closeSheet(); doPunch('out'); });
    doPunch(k);
  });
  if ($('atScan')) $('atScan').onclick = scanOfficeQr;
}

function openMendan(){
  openSheet('面談の時間', `<p class="small">今日の面談の時間を選んでください。出勤簿の「面談」に入り、休憩は「1時間−面談」になります。</p><div class="chips">${[0.25, 0.5, 0.75, 1].map(h => `<button class="chip" data-mh="${h}" style="flex:1;text-align:center">${h}時間</button>`).join('')}</div>`,
    '<button class="btn s wide" id="mhNo">やめる</button>');
  $('mhNo').onclick = closeSheet;
  $('bsBody').querySelectorAll('[data-mh]').forEach(b => b.onclick = () => { closeSheet(); doPunch('mendan', '', Number(b.dataset.mh)); });
}
async function doPunch(kind, reason, hours){
  const btns = $('view').querySelectorAll('[data-k]'); btns.forEach(b => b.disabled = true);
  const label = { in:'出勤', tele:'テレワーク開始', out:'退勤', away:'離席', back:'着席', late:'遅延の連絡', absent:'欠席の連絡', early:'早退の連絡', mendan:'面談の時間' }[kind];
  toast(label + 'を記録しています…');
  try {
    const noPos = ['late', 'absent', 'early', 'tele', 'mendan'].includes(kind);
    const pos = noPos ? null : await getPos();
    const qr = noPos ? '' : qrToken();
    const j = await api({ app:'attendPunch', punch: JSON.stringify({ kind, pickup: atPickup, reason: reason || '', hours: hours || '', qr, ...(pos || {}) }) });
    LS.set(atKey(), j);
    if (location.hash.startsWith('#/attend')) drawAttend(j);
    const pj = j.punched || {};
    toast((pj.message || label + 'しました') + (/^QR確認/.test(pj.judge || '') ? '（QR確認済み）' : pj.judge === '事業所の外' ? '（事業所の外からの打刻として記録）' : pj.judge === '位置なし' && !noPos ? '（位置は取れませんでした）' : ''), 3500);
  } catch (e) { toast(e.message); btns.forEach(b => b.disabled = false); }
}

function openAttendContact(working){
  let kind = working ? 'early' : 'late', reason = '';
  const draw = () => `<div class="chips" style="margin-bottom:12px">${(working ? [['early','早退する']] : [['late','遅れる'],['absent','休む']]).map(([k, l]) =>
      `<button class="chip" data-ck="${k}" aria-pressed="${k === kind}" style="--gc:var(--warn);flex:1;text-align:center">${l}</button>`).join('')}</div>
    <div class="label" style="margin-bottom:6px">理由</div><div class="chips">${AT_REASONS[kind].map(r => `<button class="chip mini" data-rs="${esc(r)}" aria-pressed="${r === reason}" style="--gc:var(--warn)">${esc(r)}</button>`).join('')}</div>
    <input class="in" id="rsOther" placeholder="その他の理由（任意）" style="margin-top:10px"><p class="small">管理者のLINEにも知らせます。</p>`;
  openSheet(working ? '早退の連絡' : '遅れる・休むの連絡', draw(), `<button class="btn s" id="ctCancel">やめる</button><button class="btn p" id="ctOk" style="--gc:var(--warn)">連絡する</button>`);

/* まとめて取込み：複数ファイル・複数ページのPDFを1枚ずつに分けて、順に読み取る */
let JS_BATCH = [];
async function loadPdfLib(){
  if (window.PDFLib) return window.PDFLib;
  await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js'; sc.onload = res; sc.onerror = () => rej(new Error('PDFの部品を読み込めませんでした')); document.head.appendChild(sc); });
  return window.PDFLib;
}
const fileToB64 = f => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = () => rej(new Error('ファイルを読み込めませんでした')); fr.readAsDataURL(f); });

async function readJissekiFiles(files){
  const items = [];
  $('jsOut').innerHTML = '<div class="box small">ファイルを準備しています…</div>';
  try {
    for (const f of files) {
      if (f.type === 'application/pdf') {
        const { PDFDocument } = await loadPdfLib();
        const src = await PDFDocument.load(await f.arrayBuffer(), { ignoreEncryption:true });
        const n = src.getPageCount();
        for (let i = 0; i < n; i++) {
          const one = await PDFDocument.create();
          const [pg] = await one.copyPages(src, [i]);
          one.addPage(pg);
          items.push({ label: f.name + (n > 1 ? `（${i + 1}/${n}枚目）` : ''), b64: await one.saveAsBase64(), mime:'application/pdf' });
        }
      } else if (/^image\//.test(f.type)) {
        const img = await shrinkImage(f, 2200);
        items.push({ label: f.name, b64: img.b64, mime: img.mime });
      }
    }
  } catch (err) { $('jsOut').innerHTML = `<div class="note err">${esc(err.message)}</div>`; return; }
  if (!items.length) { $('jsOut').innerHTML = '<div class="note err">画像かPDFを選んでください。</div>'; return; }
  const name = $('jsName').value, month = $('jsMonth').value;
  JS_BATCH = items.map(x => ({ ...x, state:'wait', res:null, err:'' }));
  drawBatch();
  // 2件ずつ並べて読み取る。Gemini の利用上限（1分あたりの回数など）に当たったら、待ってから読み直す
  let next = 0, slow = false;
  const isQuota = m => /quota|RESOURCE_EXHAUSTED|rate.?limit|429|Too Many/i.test(String(m));
  const worker = async (n) => {
    while (next < JS_BATCH.length) {
      if (slow && n > 0) return;                       // 上限に当たったら1件ずつにする
      const it = JS_BATCH[next++];
      for (let tryNo = 0; tryNo < 4; tryNo++) {
        it.state = 'run'; it.err = ''; drawBatch();
        try { it.res = await apiPost({ app:'jissekiScan', name: items.length === 1 ? name : '', month, file: JSON.stringify({ b64: it.b64, mime: it.mime }) }); it.state = 'done'; break; }
        catch (err) {
          it.state = 'err'; it.err = err.message;
          if (!isQuota(err.message) || tryNo === 3) break;
          slow = true;
          const wait = 45 + tryNo * 30;
          for (let sec = wait; sec > 0; sec -= 5) { it.state = 'run'; it.err = `読み取りの上限に当たったので、${sec}秒待ってから読み直します（${tryNo + 1}回目）`; drawBatch(); await new Promise(r => setTimeout(r, 5000)); }
        }
      }
      if (it.state === 'done') delete it.b64;
      drawBatch();
    }
  };
  await Promise.all([worker(0), worker(1)]);
  // 上限のせいで1人分ずつにしたとき、残りを最後まで読む
  while (next < JS_BATCH.length) await worker(0);
  if (JS_BATCH.length === 1 && JS_BATCH[0].res) openBatch(0);
}

function drawBatch(){
  if (!$('jsOut') || $('jsOut').dataset.detail === '1') return;
  const done = JS_BATCH.filter(x => x.state === 'done'), errs = JS_BATCH.filter(x => x.state === 'err');
  const need = done.filter(x => x.res.totals.issues || (x.res.headIssues || []).length);
  const running = JS_BATCH.length - done.length - errs.length;
  let html = `<div class="box"><h3>まとめて読み取り（${JS_BATCH.length}枚）</h3>
    <div class="counts" style="grid-template-columns:repeat(3,1fr)"><div style="background:var(--g2)"><b>${done.length}</b><span>読み取り済み</span></div><div style="background:${need.length ? 'var(--err)' : 'var(--g1)'}"><b>${need.length}</b><span>要確認の人</span></div><div style="background:${errs.length ? 'var(--warn)' : 'var(--g2)'}"><b>${errs.length}</b><span>読めなかった</span></div></div>
    ${running ? `<div class="small"><span class="spin" style="display:inline-block;width:16px;height:16px;border-width:3px;margin:0 6px -3px 0"></span>残り ${running}枚。1枚30秒ほどかかります。画面を閉じずにお待ちください。</div>` : '<div class="small">すべて読み取りました。名前を押すと、その人の結果を確認・修正できます。</div>'}
    ${!running && errs.some(x => x.b64) ? `<button class="btn s wide" id="jsRetry" style="margin-top:10px">読めなかった${errs.filter(x => x.b64).length}枚を読み直す</button>` : ''}</div>`;
  html += `<table class="at-tbl"><thead><tr><th style="width:42%">利用者</th><th>出勤（用紙／記録）</th><th>要確認</th></tr></thead><tbody>${JS_BATCH.map((x, i) => {
    if (x.state === 'wait') return `<tr><td>${esc(x.label)}</td><td colspan="2" class="small">待機中</td></tr>`;
    if (x.state === 'run') return `<tr><td>${esc(x.label)}</td><td colspan="2" class="small">${x.err ? `<span style="color:var(--warn)">${esc(x.err)}</span>` : '読み取り中…'}</td></tr>`;
    if (x.state === 'err') return `<tr><td>${esc(x.label)}</td><td colspan="2" class="flag">${esc(x.err)}</td></tr>`;
    const r = x.res, n = r.totals.issues + (r.headIssues || []).length;
    return `<tr data-open="${i}" style="cursor:pointer${n ? ';background:var(--err-bg)' : ''}"><td><b class="link" style="padding:0">${esc(r.name || '（名前不明）')}</b><div class="small">${esc(String(r.month).replace('-', '/'))}${r.hasSys ? '' : '　記録が見つからない'}</div></td>
      <td class="n">${r.totals.paperDays}／${r.totals.sysDays}日</td><td class="n" style="${n ? 'color:var(--err);font-weight:700' : ''}">${n ? n + '件' : 'なし'}</td></tr>`;
  }).join('')}</tbody></table>`;
  if (isPC() && JS_BATCH.length > 1) {
    if (!$('jsList')) $('jsOut').innerHTML = `<div class="md"><div class="md-list" id="jsList"></div><div class="md-detail" id="jsDetail"><div class="md-empty">左の一覧から名前を選ぶと、ここにその人の照合結果が出ます</div></div></div>`;
    $('jsList').innerHTML = html;
    $('jsList').querySelectorAll('[data-open]').forEach(tr => { tr.classList.toggle('sel', Number(tr.dataset.open) === JS_CUR); tr.onclick = () => openBatch(Number(tr.dataset.open)); });
  } else {
    $('jsOut').innerHTML = html;
    $('jsOut').querySelectorAll('[data-open]').forEach(tr => tr.onclick = () => openBatch(Number(tr.dataset.open)));
  }
  if ($('jsRetry')) $('jsRetry').onclick = async () => {
    const month = $('jsMonth').value;
    for (const it of JS_BATCH.filter(x => x.state === 'err' && x.b64)) {
      it.state = 'run'; it.err = ''; drawBatch();
      try { it.res = await apiPost({ app:'jissekiScan', name: '', month, file: JSON.stringify({ b64: it.b64, mime: it.mime }) }); it.state = 'done'; delete it.b64; }
      catch (err) { it.state = 'err'; it.err = err.message; }
      drawBatch();
    }
  };
}

let JS_CUR = -1;
function openBatch(i){
  JS_CUR = i; JS_RES = JS_BATCH[i].res;
  if (isPC() && JS_BATCH.length > 1 && $('jsDetail')) { drawJisseki(JS_RES); drawBatch(); $('jsDetail').scrollTop = 0; return; }
  $('jsOut').dataset.detail = JS_BATCH.length > 1 ? '1' : '';

/* ===== 感染症の待機期間（ガントチャート） ===== */
const qtKey = () => 'fb_qt_' + (isDemo() ? 'demo' : 'live');
const dnum = s => Math.round(new Date(s + 'T00:00:00+09:00').getTime() / 864e5);
const qtActive = j => (j.items || []).filter(x => x.start <= (j.today || ymd()) && x.end >= (j.today || ymd()));
let qtRange = 35;
async function showQuarantine(){
  setTop({ title:'感染症の待機期間', back:true });
  const token = viewToken;
  const cached = LS.get(qtKey(), null);
  if (cached) drawQuarantine(cached); else $('view').innerHTML = '<div class="empty">読み込んでいます…</div>';
  try { const j = await api({ app:'quarantine' }); LS.set(qtKey(), j); if (token === viewToken) drawQuarantine(j); }
  catch (e) { if (token === viewToken && !cached) $('view').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
}
function drawQuarantine(j){
  const today = j.today || ymd(), T = dnum(today);
  const items = j.items || [];
  const active = qtActive(j), soon = items.filter(x => x.start > today);
  const back = Math.round(qtRange * 0.4), from = T - back, to = from + qtRange - 1;
  const list = items.filter(x => dnum(x.end) >= from && dnum(x.start) <= to).sort((a, b) => a.start < b.start ? -1 : 1);
  const left = n => ((n - from) / qtRange * 100).toFixed(3) + '%';
  const md = n => { const x = new Date(n * 864e5 + 9 * 3600e3); return (x.getUTCMonth() + 1) + '/' + x.getUTCDate(); };
  const wdOf = n => new Date(n * 864e5 + 9 * 3600e3).getUTCDay();
  const step = qtRange <= 21 ? 2 : qtRange <= 42 ? 7 : 28;
  const st = x => x.end < today ? 'done' : x.start > today ? 'soon' : 'now';
  const remain = x => dnum(x.end) - T;
  let html = `<div style="padding-top:12px"><div id="infBox">${infHtml(LS.get(infKey(), null))}</div><div class="counts" style="grid-template-columns:repeat(2,1fr)"><div style="background:${active.length ? 'var(--err)' : 'var(--g1)'}"><b>${active.length}</b><span>いま待機中</span></div><div style="background:var(--warn)"><b>${soon.length}</b><span>これから待機</span></div></div>`;
  if (active.length) html += `<div class="box">${active.map(x => `<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0"><span><b>${esc(x.name)}</b><span class="small">　${esc(x.kind)}</span></span><span class="small">${md(dnum(x.end))}まで（${remain(x) ? 'あと' + remain(x) + '日' : '今日まで'}）</span></div>`).join('')}</div>`;
  html += `<div class="chips" style="margin:6px 0 10px">${[[14,'2週間'],[35,'5週間'],[91,'3か月']].map(([n, l]) => `<button class="chip mini" data-rg="${n}" aria-pressed="${n === qtRange}" style="--gc:var(--g2)">${l}</button>`).join('')}</div>`;
  // チャート
  let grid = '', heads = '';
  for (let n = from; n <= to; n++) {
    const w = wdOf(n);
    if (w === 0 || w === 6) grid += `<div class="gt-we" style="left:${left(n)};width:${(100 / qtRange).toFixed(3)}%"></div>`;
    if ((n - from) % step === 0 && (n - from) / qtRange < 0.88) heads += `<div class="gt-tick" style="left:${left(n)}">${md(n)}</div>`;
  }
  const todayLine = T >= from && T <= to ? `<div class="gt-today" style="left:calc(${left(T)} + ${(50 / qtRange).toFixed(3)}%)"><span>今日</span></div>` : '';
  html += `<div class="gantt"><div class="gt-head"><div class="gt-name"></div><div class="gt-track">${heads}</div></div>
    ${list.length ? list.map((x, i) => {
      const s0 = Math.max(dnum(x.start), from), e0 = Math.min(dnum(x.end), to);
      const k = st(x);
      return `<div class="gt-row"><div class="gt-name"><b>${esc(x.name)}</b><span>${md(dnum(x.start))}〜${md(dnum(x.end))}</span></div><div class="gt-track">${grid}${todayLine}
        <button class="gt-bar gt-${k}" data-qi="${items.indexOf(x)}" style="left:${left(s0)};width:${((e0 - s0 + 1) / qtRange * 100).toFixed(3)}%" aria-label="${esc(x.name)} ${md(dnum(x.start))}から${md(dnum(x.end))}まで">${(e0 - s0 + 1) / qtRange > 0.2 ? (k === 'now' ? (remain(x) ? 'あと' + remain(x) + '日' : '今日まで') : k === 'soon' ? 'これから' : '') : ''}</button></div></div>`;
    }).join('') : `<div class="gt-row"><div class="gt-name"></div><div class="gt-track">${grid}${todayLine}<div class="small" style="position:absolute;inset:0;display:grid;place-items:center">この期間の待機はありません</div></div></div>`}
  </div>
  <div class="gt-legend"><span><i class="gt-now"></i>待機中</span><span><i class="gt-soon"></i>これから</span><span><i class="gt-done"></i>終了</span></div>
  <a class="btn p wide" href="#/form/${encodeURIComponent('待機期間管理')}" style="display:grid;place-items:center;text-decoration:none;margin-top:14px;--gc:var(--err)">待機期間を登録する</a></div>`;
  $('view').innerHTML = html;
  loadInfection();
  $('view').querySelectorAll('[data-rg]').forEach(b => b.onclick = () => { qtRange = Number(b.dataset.rg); drawQuarantine(j); });
  $('view').querySelectorAll('[data-qi]').forEach(b => b.onclick = () => {
    const x = items[Number(b.dataset.qi)];
    const days = dnum(x.end) - dnum(x.start) + 1;
    openSheet(x.name + ' さんの待機期間', `<p>${esc(x.kind)}<br>${md(dnum(x.start))} 〜 ${md(dnum(x.end))}（${days}日間）<br>${st(x) === 'now' ? (remain(x) ? 'あと' + remain(x) + '日' : '今日で終了') : st(x) === 'soon' ? (dnum(x.start) - T) + '日後から' : '終了しました'}${x.note ? '<br>' + esc(x.note) : ''}</p>`,
      `<button class="btn s" id="qtClose">閉じる</button><a class="btn p" href="#/record/${encodeURIComponent('待機期間管理')}/${x.row}" style="display:grid;place-items:center;text-decoration:none;--gc:var(--brand)">記録を開く・直す</a>`);
    $('qtClose').onclick = closeSheet;
  });
}

const VOICE_FORMS = { '相談記録表':'相談内容' };
const ICON_MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/></svg>';
let VC = null;
function loadScript(src, test){
  if (test()) return Promise.resolve();
  return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = () => rej(new Error('部品を読み込めませんでした。電波の良い場所でお試しください')); document.head.appendChild(sc); });
}
/* どんな録音でも、16kHz・モノラル・32kbps の mp3 にそろえる（小さく、Geminiが読める形） */
async function toMp3(blob, onProg){
  await loadScript('https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', () => window.lamejs && lamejs.Mp3Encoder);
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC({ sampleRate: 16000 });
  const ab = await new Response(blob).arrayBuffer();
  const buf = await new Promise((res, rej) => ac.decodeAudioData(ab, res, () => rej(new Error('この音声ファイルは読み込めませんでした（別の形式で保存してお試しください）'))));
  try { ac.close(); } catch (e) {}
  let pcm = buf.getChannelData(0);
  if (buf.numberOfChannels > 1) { const r = buf.getChannelData(1); const m = new Float32Array(pcm.length); for (let i = 0; i < pcm.length; i++) m[i] = (pcm[i] + r[i]) / 2; pcm = m; }
  let rate = buf.sampleRate;
  if (rate !== 16000) { // 念のため間引き
    const k = rate / 16000, out = new Float32Array(Math.floor(pcm.length / k));
    for (let i = 0; i < out.length; i++) out[i] = pcm[Math.floor(i * k)];
    pcm = out; rate = 16000;
  }
  const enc = new lamejs.Mp3Encoder(1, 16000, 32);
  const chunks = [], block = 1152 * 20, s16 = new Int16Array(block);
  for (let i = 0; i < pcm.length; i += block) {
    const n = Math.min(block, pcm.length - i);
    for (let j = 0; j < n; j++) { const v = Math.max(-1, Math.min(1, pcm[i + j])); s16[j] = v < 0 ? v * 0x8000 : v * 0x7fff; }
    const mp3 = enc.encodeBuffer(n === block ? s16 : s16.subarray(0, n));
    if (mp3.length) chunks.push(mp3);
    if (onProg && i % (block * 50) === 0) { onProg(i / pcm.length); await new Promise(r => setTimeout(r)); }
  }
  const end = enc.flush(); if (end.length) chunks.push(end);
  return { blob: new Blob(chunks, { type:'audio/mpeg' }), sec: pcm.length / 16000 };
}
const blobToB64 = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = () => rej(new Error('音声を読み込めませんでした')); fr.readAsDataURL(b); });
const fmtSec = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

function openVoice(sheet){

async function startVoice(){

  const type = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg;codecs=opus'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
  VC.rec = new MediaRecorder(VC.stream, type ? { mimeType: type, audioBitsPerSecond: 32000 } : undefined);
  VC.chunks = [];
  VC.rec.ondataavailable = e => { if (e.data && e.data.size) VC.chunks.push(e.data); };

async function processVoice(blob){

function applyVoice(j){
  const filled = [];

    F.values[f.index] = val; filled.push(f.label);
    const w = $('w' + f.index); if (w) w.outerHTML = fieldHtml(f, val);

let BOOK = null;
async function showBook(name){

function drawBook(){
  const j = BOOK;

  const work = j.rows.filter(r => r.cells[2] || r.cells[3]);
  const sum = i => work.reduce((a, r) => a + (parseFloat(r.cells[i]) || 0), 0);

    ${noOut ? `<div class="note">退勤の記録がない日が ${noOut}日 あります。</div>` : ''}

    <div class="tscroll"><table class="at-tbl bk"><thead><tr>${(mem ? ['日','出勤','退勤','休憩','面談','利用','送迎','印'] : ['日','出勤','退勤','休憩','勤務','残業','印']).map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${j.rows.map((r, i) => {

        ${mem ? `<td class="n">${/〇|○/.test(r.cells[8]) ? '往' : ''}${/〇|○/.test(r.cells[9]) ? '復' : ''}</td>` : ''}<td>${r.stamp ? '<span class="stamp">印</span>' : ''}</td></tr>${(mem ? r.cells[10] || r.cells[11] : r.cells[8]) ? `<tr class="${we ? 'we' : ''}"><td></td><td colspan="${mem ? 7 : 6}" class="small" style="padding-top:0">${mem ? c(r, 10) + ' ' + c(r, 11) : c(r, 8)}</td></tr>` : ''}`;
    }).join('')}</tbody></table></div>

function editBookRow(r){

    <p class="small">${mem ? '勤務時間と利用時間は自動で計算し直します。' : ''}直した内容は「アプリ修正ログ」に残ります。</p>`,

    runAction(() => apiPost({ app:'bookEdit', name: BOOK.name, row: r.row, data: JSON.stringify(data) }), () => showBook(BOOK.name));
  };
}

async function showTenken(){
  setTop({ title:'運営指導 自己点検表', back:true });
  if (!isAdmin()) { $('view').innerHTML = '<div class="note err">この画面は管理者だけが使えます。</div>'; return; }
  const token = viewToken;
  $('view').innerHTML = '<div class="empty">点検項目を読み込んでいます…</div>';
  try {
    const j = await api({ app:'tenken' });
    if (token !== viewToken) return;
    const draft = LS.get(tkKey(), null);
    TK = { def: j, d: draft || { office: (j.last && j.last.office) || j.meta.office || '', checker: (ME && ME.name) || j.meta.checker || '', date: ymd(), results: {} } };
    if (!draft && j.last) TK.fromLast = j.last.at;
    if (!draft && j.last) TK.d.results = JSON.parse(JSON.stringify(j.last.results || {}));
    drawTenken();
  } catch (e) { if (token === viewToken) $('view').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
}
function tkSave(){ LS.set(tkKey(), TK.d); }
function drawTenken(){
  const { def, d } = TK;
  const items = def.items;
  const R = row => d.results[row] = d.results[row] || { v:'', docs:[], memo:'' };
  const done = items.filter(it => (d.results[it.row] || {}).v).length;
  const ng = items.filter(it => (d.results[it.row] || {}).v === '否');
  const secs = [...new Set(items.map(it => it.sec))];
  const show = it => TK_FILTER === 'all' || (TK_FILTER === 'todo' && !(d.results[it.row] || {}).v) || (TK_FILTER === 'ng' && (d.results[it.row] || {}).v === '否');
  let html = `<div style="padding-top:12px;--gc:var(--g4)">
    ${TK.fromLast ? `<div class="note">前回（${esc(TK.fromLast)}）の結果を入れてあります。変わったところだけ直してください。</div>` : ''}
    <div class="box"><div class="field" style="padding:0"><label for="tkOffice">事業所名</label><input class="in" id="tkOffice" list="tkOff" value="${esc(d.office)}"><datalist id="tkOff">${def.offices.map(o => `<option value="${esc(o)}">`).join('')}</datalist></div>
      <div style="display:flex;gap:8px;margin-top:8px"><div style="flex:1"><label class="small" for="tkChecker">点検者</label><input class="in" id="tkChecker" value="${esc(d.checker)}"></div><div style="flex:1"><label class="small" for="tkDate">点検年月日</label><input class="in" id="tkDate" type="date" value="${esc(d.date)}"></div></div></div>
    <div class="counts" style="grid-template-columns:repeat(3,1fr)"><div style="background:var(--g2)"><b>${done}/${items.length}</b><span>点検済み</span></div><div style="background:var(--g1)"><b>${items.filter(it => (d.results[it.row] || {}).v === '適').length}</b><span>適</span></div><div style="background:${ng.length ? 'var(--err)' : 'var(--g2)'}"><b>${ng.length}</b><span>否</span></div></div>
    <div class="tabs mini" style="margin:6px 0 10px">${[['all','すべて'],['todo','未点検'],['ng','否だけ']].map(([k, l]) => `<button class="tab" data-tf="${k}" aria-selected="${k === TK_FILTER}">${l}</button>`).join('')}</div>
    <div class="chips" style="margin-bottom:6px">${items.length > 20 ? '<button class="chip mini" id="tkAllOk">未点検をすべて「適」にする</button>' : ''}<button class="chip mini" id="tkClear">点検をやり直す（空にする）</button></div>`;
  secs.forEach((sc, si) => {
    const list = items.filter(it => it.sec === sc && show(it));
    if (!list.length) return;
    const all = items.filter(it => it.sec === sc), dn = all.filter(it => (d.results[it.row] || {}).v).length;
    html += `<details class="tk-sec"${TK_FILTER !== 'all' || si === 0 ? ' open' : ''}><summary><b>${esc(sc)}</b><span class="small">${dn}/${all.length}</span></summary>${list.map(it => {
      const r = d.results[it.row] || { v:'', docs:[], memo:'' };
      return `<div class="tk-item${r.v === '否' ? ' ng' : r.v ? ' ok' : ''}" id="tk${it.row}">${it.grp ? `<div class="small" style="font-weight:700">${esc(it.grp)}</div>` : ''}
        <div class="tk-text">${esc(it.text)}</div>${it.law ? `<div class="small" style="margin-top:2px">${esc(it.law)}</div>` : ''}
        <div class="tk-btns">${['適','否','－'].map(o => `<button class="chip" data-tv="${it.row}" data-o="${o}" aria-pressed="${r.v === o}" style="--gc:${o === '適' ? 'var(--g1)' : o === '否' ? 'var(--err)' : 'var(--sub)'}">${o === '－' ? '該当なし' : o}</button>`).join('')}</div>
        <div class="small" style="margin-top:6px">関係書類（そろっているものを押す）</div><div class="chips">${it.docs.map((dc, k) => `<button class="chip mini" data-td="${it.row}" data-k="${k}" aria-pressed="${(r.docs || []).includes(dc)}" style="--gc:var(--g2)">${esc(dc)}</button>`).join('')}</div>
        ${r.v === '否' ? `<input class="in" data-tm="${it.row}" placeholder="否の理由・改善すること（メモ）" value="${esc(r.memo || '')}" style="margin-top:8px">` : ''}</div>`;
    }).join('')}</details>`;
  });
  html += `<div class="bar"><span class="saved">入力は自動で下書き保存されます</span><button class="btn s" id="tkSaveOnly" style="min-height:48px">保存</button><button class="btn p" id="tkPdf" style="--gc:var(--brand)">保存してPDF</button></div></div>`;
  $('view').innerHTML = html;
  const v = $('view');
  ['tkOffice','tkChecker','tkDate'].forEach(id => $(id).oninput = () => { d.office = $('tkOffice').value.trim(); d.checker = $('tkChecker').value.trim(); d.date = $('tkDate').value; tkSave(); });
  v.querySelectorAll('[data-tf]').forEach(b => b.onclick = () => { TK_FILTER = b.dataset.tf; drawTenken(); });
  v.querySelectorAll('[data-tv]').forEach(b => b.onclick = () => {
    const r = R(b.dataset.tv); r.v = r.v === b.dataset.o ? '' : b.dataset.o;
    if (r.v === '適' && !(r.docs || []).length) { const it = items.find(x => String(x.row) === b.dataset.tv); r.docs = it.docs.slice(); }
    tkSave(); const y = window.scrollY; drawTenken(); window.scrollTo(0, y);
  });
  v.querySelectorAll('[data-td]').forEach(b => b.onclick = () => {
    const it = items.find(x => String(x.row) === b.dataset.td); const r = R(it.row); const dc = it.docs[Number(b.dataset.k)];
    r.docs = (r.docs || []).includes(dc) ? r.docs.filter(x => x !== dc) : (r.docs || []).concat(dc);
    b.setAttribute('aria-pressed', r.docs.includes(dc)); tkSave();
  });
  v.querySelectorAll('[data-tm]').forEach(i => i.oninput = () => { R(i.dataset.tm).memo = i.value; tkSave(); });
  if ($('tkAllOk')) $('tkAllOk').onclick = () => confirmSheet('未点検をすべて「適」にする', 'まだ選んでいない項目を、すべて「適」にします（関係書類もそろっている扱いにします）。あとで個別に直せます。', '「適」にする', () => {
    items.forEach(it => { const r = R(it.row); if (!r.v) { r.v = '適'; r.docs = it.docs.slice(); } }); tkSave(); closeSheet(); drawTenken();
  });
  $('tkClear').onclick = () => confirmSheet('点検をやり直す', 'すべての項目の結果を空にします。', '空にする', () => { d.results = {}; TK.fromLast = ''; tkSave(); closeSheet(); drawTenken(); }, true);
  const save = pdf => {
    if (!d.office || !d.checker || !d.date) { toast('事業所名・点検者・点検年月日を入れてください'); return; }
    const left = items.length - items.filter(it => (d.results[it.row] || {}).v).length;
    const go = () => runAction(() => apiPost({ app:'tenkenSave', pdf: pdf ? '1' : '', data: JSON.stringify(d) }), r => { if (r.pdf) msgSheet('PDFを保存しました', r.pdf.name || ''); LS.del(tkKey()); TK.fromLast = ''; });
    if (left) confirmSheet('未点検の項目があります', `まだ ${left}項目 が未点検です（空欄のままPDFに出ます）。このまま保存しますか？`, '保存する', () => { closeSheet(); go(); }); else go();
  };
  $('tkSaveOnly').onclick = () => save(false);
  $('tkPdf').onclick = () => save(true);
}

  const vs = getViews() || [];

  const sub = { ukeoi:'店舗ごとの請負内容・数量・金額', mendan:'相談内容・様子・今後の方針' };
  return Object.keys(WORK_VIEWS).filter(id => !meta(id).admin || isAdmin()).filter(id => !vs.length || vs.some(v => v.id === id)).map(id => {

  }).join('');
}

async function loadSafety(live){
  try {
    const j = await api({ app:'safety' });
    if (!live()) return;
    const g = j.groups || {};
    const keys = ['無事です','怪我あり','避難中','連絡不可','未回答'];
    $('safetyBox').innerHTML = `<div class="small">${j.lastSend ? '最後の一斉送信：' + esc(j.lastSend) : 'まだ一斉送信していません'}　対象 ${j.total}名</div>
      <div class="counts">${keys.map(k => `<div class="${ST_CLASS[k]}"><b>${(g[k] || []).length}</b><span>${k.replace('です','')}</span></div>`).join('')}</div>
      ${keys.filter(k => k !== '無事です' && (g[k] || []).length).map(k => `<div class="who"><b>${k}</b>：${g[k].map(x => esc(x.name) + (x.time ? `（${esc(x.time)}）` : '')).join('、')}</div>`).join('')}
      <div class="row2">
        <button class="btn p" style="--gc:var(--brand)" id="sfSend">全員に送る</button>
        <button class="btn s" id="sfResend" ${(g['未回答'] || []).length && j.lastSend ? '' : 'disabled'}>未回答の人に再送</button>
        <button class="btn s" id="sfNotify" ${(g['怪我あり'] || []).length ? '' : 'disabled'}>怪我ありを管理者に通知</button>
      </div>`;
    const reload = () => loadSafety(live);
    $('sfSend').onclick = () => confirmSheet('安否確認の一斉送信', `メンバー全員（${j.total}名）のLINEに安否確認を送ります。`, '送信する', () => runAction(() => api({ app:'safetySend' }), reload));
    $('sfResend').onclick = () => confirmSheet('未回答の人に再送', `まだ回答していない ${(g['未回答'] || []).length}名に、もう一度送ります。`, '再送する', () => runAction(() => api({ app:'safetyResend' }), reload));
    $('sfNotify').onclick = () => runAction(() => api({ app:'safetyNotify' }));
  } catch (e) { if (live()) $('safetyBox').innerHTML = `<div class="note err" style="margin:0">${esc(e.message)}</div>`; }
}

async function loadEvents(live){
  try {
    const j = await api({ app:'events' });
    if (!live()) return;
    const evs = j.events || [];
    let html = isAdmin() ? `<button class="btn s wide" id="evNew" style="margin-bottom:10px">＋ 新しいイベントを作る</button>` : '';
    if (!evs.length) html += `<div class="box small">${isAdmin() ? 'イベントはまだありません。' : 'あなたが対象のイベントはありません。'}</div>`;
    const card = e => {
      const ans = ME && ME.userId && e.isTarget ? `<div class="chips">${['出席','遅刻','未定','欠席'].map(o =>
        `<button class="chip" data-ev="${esc(e.id)}" data-at="${o}" aria-pressed="${e.my === o}" style="--gc:var(--brand)">${o}</button>`).join('')}</div>` : '';
      const cnt = e.counts ? `<div class="counts">${['出席','遅刻','未定','欠席','未回答'].map(k => `<div class="${AT_CLASS[k]}"><b>${e.counts[k].length}</b><span>${k}</span></div>`).join('')}</div>
        ${['欠席','未回答'].filter(k => e.counts[k].length).map(k => `<div class="who"><b>${k}</b>：${e.counts[k].map(esc).join('、')}</div>`).join('')}
        ${e.upcoming ? `<div class="row2"><button class="btn s" data-evsend="${esc(e.id)}" data-evname="${esc(e.name)}" data-n="${e.targetCount}">出欠確認をLINEで送る</button></div>` : ''}` : '';
      return `<div class="box evt"${e.upcoming ? '' : ' style="opacity:.7"'}><h3>${esc(e.name)}${e.upcoming ? '' : '<span class="pill" style="--gbg:var(--soft);--gc:var(--sub)">終了</span>'}</h3>
        <div class="meta">${esc(e.date)} ${esc(e.time)}${e.place ? '　' + esc(e.place) : ''}</div>${e.memo ? `<div class="small">${esc(e.memo)}</div>` : ''}${ans}${cnt}</div>`;
    };
    // これからのイベントは開いたまま、終わったイベントは折りたたむ（新しい順）
    const up = evs.filter(e => e.upcoming), past = evs.filter(e => !e.upcoming).sort((a, b) => String(b.date).localeCompare(String(a.date)));
    if (evs.length && !up.length) html += '<div class="box small">これからのイベントはありません。</div>';
    html += up.map(card).join('');
    if (past.length) html += `<details class="ev-past"><summary>終わったイベント（${past.length}件）</summary>${past.map(card).join('')}</details>`;
    $('evBox').innerHTML = html;
    const reload = () => loadEvents(live);
    $('evBox').querySelectorAll('[data-at]').forEach(b => b.onclick = () =>
      runAction(() => api({ app:'eventAnswer', eventId:b.dataset.ev, status:b.dataset.at }), reload));
    $('evBox').querySelectorAll('[data-evsend]').forEach(b => b.onclick = () =>
      confirmSheet('出欠確認を送る', `「${b.dataset.evname}」の出欠確認を、対象の${b.dataset.n}名のLINEに送ります。`, '送信する',
        () => runAction(() => api({ app:'eventSend', eventId:b.dataset.evsend }))));
    if ($('evNew')) $('evNew').onclick = () => openEventForm(reload);
  } catch (e) { if (live()) $('evBox').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
}

function openEventForm(reload){
  openSheet('新しいイベント', `
    <div class="field" style="padding:0"><label for="evName">イベント名</label><input class="in" id="evName"></div>
    <div class="field" style="padding:0"><label for="evDate">開催日</label><input class="in" id="evDate" type="date" value="${ymd()}"></div>
    <div class="field" style="padding:0"><label for="evTime">開始時刻</label><input class="in" id="evTime" type="time"></div>
    <div class="field" style="padding:0"><label for="evPlace">場所</label><input class="in" id="evPlace"></div>
    <div class="field" style="padding:0"><label for="evMemo">メモ</label><textarea class="in" id="evMemo" style="min-height:80px"></textarea></div>
    <label class="small" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="evSend" checked style="width:20px;height:20px">作成と同時に、LINEに登録している全員へ出欠確認を送る</label>`,
    `<button class="btn s" id="evCancel">やめる</button><button class="btn p" id="evOk" style="--gc:var(--brand)">作成する</button>`);
  $('evCancel').onclick = closeSheet;
  $('evOk').onclick = () => {
    const ev = { name:$('evName').value.trim(), date:$('evDate').value, time:$('evTime').value, place:$('evPlace').value.trim(), memo:$('evMemo').value.trim(), target:'all', send:$('evSend').checked };
    if (!ev.name || !ev.date) { toast('イベント名と開催日を入れてください'); return; }
    runAction(() => apiPost({ app:'eventCreate', event:ev }), reload);
  };
}

const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ===== 在庫 ===== */
let STOCK = null;
async function showStock(){
  setTop({ title:'災害時の備蓄品', back:true });
  const token = viewToken;
  STOCK = LS.get('fb_stock', null);
  const draw = () => {
    if (token !== viewToken) return;
    const items = (STOCK && STOCK.items) || [];
    const canScan = !!(window.liff && liff.id && liff.isInClient && liff.isInClient() && liff.scanCodeV2);
    $('view').innerHTML = `<div class="g3" style="padding-top:12px">
      ${canScan ? `<button class="btn p wide" id="scan" style="margin-bottom:10px">QRコードを読み取る</button>` : `<p class="small">LINEアプリから開くと、QRコードの読み取りが使えます。</p>`}
      <label class="search" style="margin-top:0">${ICON.search}<input id="sq" type="search" placeholder="品名でさがす" aria-label="品名でさがす"></label>
      <div class="chips" style="margin:8px 0 12px"><button class="chip mini" id="expOnly" aria-pressed="false">期限が近いもの</button></div>
      <div id="slist">${STOCK ? '' : '<div class="empty">読み込んでいます…</div>'}</div></div>`;
    let expOnly = false;
    const list = () => {
      const q = ($('sq').value || '').trim();
      const xs = items.filter(x => (!q || x.name.includes(q)) && (!expOnly || x.expSoon));
      $('slist').innerHTML = STOCK ? (xs.length ? xs.map(x => `<button class="list-item" data-it="${esc(x.name)}" style="width:100%;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer">
        ${x.img && /^https?:/.test(x.img) ? `<img class="sthumb" src="${esc(driveImg(x.img, 200))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : '<span class="sthumb"></span>'}
        <div class="main"><div class="t" style="font-weight:400">${esc(x.name)}</div>
        <div class="m">${x.exp ? `期限 <span class="${x.expSoon ? 'red' : ''}">${esc(x.exp)}</span>` : ''}</div></div>
        <span class="stock-n${x.stock <= 0 ? ' red' : ''}">${x.stock}</span></button>`).join('') : '<div class="empty">該当する品目はありません。</div>') : '';
      $('slist').querySelectorAll('[data-it]').forEach(b => b.onclick = () => openMove(b.dataset.it));
    };
    $('sq').oninput = list;
    $('expOnly').onclick = () => { expOnly = !expOnly; $('expOnly').setAttribute('aria-pressed', expOnly); list(); };
    if ($('scan')) $('scan').onclick = scanStock;
    list();
  };
  draw();
  try { STOCK = await api({ app:'stock' }); LS.set('fb_stock', STOCK); const q = $('sq') && $('sq').value; draw(); if (q) { $('sq').value = q; $('sq').dispatchEvent(new Event('input')); } }
  catch (e) { if (token === viewToken && !STOCK) $('slist').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
}

async function scanStock(){
  try {
    const r = await liff.scanCodeV2();
    const text = (r && r.value) || '';
    let name = '', dir = '';
    try { const u = new URL(text); name = u.searchParams.get('name') || ''; dir = u.searchParams.get('action') || ''; } catch (e) { name = text; }
    if (!name) { toast('この QRコードは在庫のものではありません'); return; }
    openMove(name, dir === 'out' ? 'out' : 'in');
  } catch (e) { msgSheet('読み取れませんでした', 'LINE Developers の LIFF 設定で「Scan QR」をオンにしてください。（' + (e.message || e) + '）'); }
}

function openMove(name, dir){
  const it = ((STOCK && STOCK.items) || []).find(x => x.name === name.replace(/\s+/g, ' ').trim());
  if (!it) { toast('在庫が見つかりません：' + name); return; }
  let d = dir || 'out', n = 1;
  openSheet(it.name, `${it.img && /^https?:/.test(it.img) ? `<img src="${esc(driveImg(it.img, 800))}" alt="" style="width:100%;max-height:200px;object-fit:contain;border-radius:var(--r-s);background:var(--soft);margin-bottom:10px" onerror="this.remove()">` : ''}<div class="small">今の在庫 <b style="font-size:18px;color:var(--ink)">${it.stock}</b>${it.exp ? '　期限 ' + esc(it.exp) : ''}</div>
    <div class="chips" style="margin-top:12px"><button class="chip" data-d="in" style="--gc:var(--g1)">入庫（増やす）</button><button class="chip" data-d="out" style="--gc:var(--g4)">出庫（使う）</button></div>
    <div class="stepper"><button type="button" id="mMinus" aria-label="1つ減らす">−</button><input id="mQty" type="number" inputmode="numeric" min="1" value="1" aria-label="数量"><button type="button" id="mPlus" aria-label="1つ増やす">＋</button></div>`,
    `<button class="btn s" id="mvCancel">やめる</button><button class="btn p" id="mvOk" style="--gc:var(--brand)">記録する</button>`, 'g3');
  const sync = () => {
    $('bsBody').querySelectorAll('[data-d]').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === d));
    $('mvOk').textContent = (d === 'in' ? '入庫' : '出庫') + 'を記録する';
  };
  $('bsBody').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { d = b.dataset.d; sync(); });
  $('mMinus').onclick = () => { n = Math.max(1, (Number($('mQty').value) || 1) - 1); $('mQty').value = n; };
  $('mPlus').onclick = () => { n = (Number($('mQty').value) || 0) + 1; $('mQty').value = n; };
  $('mvCancel').onclick = closeSheet;
  $('mvOk').onclick = () => {
    n = Number($('mQty').value);
    if (!(n > 0)) { toast('数量を入れてください'); return; }
    if (d === 'out' && n > it.stock) { toast('在庫より多くは出庫できません'); return; }
    runAction(() => api({ app:'stockMove', name:it.name, dir:d, qty:n }), j => { it.stock = j.stock ?? it.stock; LS.set('fb_stock', STOCK); if (location.hash.indexOf('#/stock') === 0) showStock(); });
  };
  sync();
}

  const drawPeople = () => {
    $('people').innerHTML = visible().map(x => `<button type="button" class="chip" data-id="${esc(x.id)}" aria-pressed="${sel.has(x.id)}" ${usable(x) ? '' : 'disabled style="opacity:.45"'}>${esc(x.name)}<span class="small" style="color:inherit;opacity:.75">　${esc(x.kind)}</span></button>`).join('');
    $('people').querySelectorAll('[data-id]').forEach(b => b.onclick = () => { sel.has(b.dataset.id) ? sel.delete(b.dataset.id) : sel.add(b.dataset.id); drawPeople(); });
    $('selN').textContent = sel.size + '名を選択中';
  };
  $('view').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { method = b.dataset.m; $('view').querySelectorAll('[data-m]').forEach(x => x.setAttribute('aria-pressed', x === b)); drawPeople(); });
  $('view').querySelectorAll('[data-st]').forEach(b => b.onclick = () => { store = b.dataset.st; $('view').querySelectorAll('[data-st]').forEach(x => x.setAttribute('aria-pressed', x === b)); drawPeople(); });
  $('view').querySelectorAll('[data-kd]').forEach(b => b.onclick = () => { kind = b.dataset.kd; $('view').querySelectorAll('[data-kd]').forEach(x => x.setAttribute('aria-pressed', x === b)); drawPeople(); });
  $('allOn').onclick = () => { visible().filter(usable).forEach(x => sel.add(x.id)); drawPeople(); };
  $('allEvery').onclick = () => {
    store = ''; kind = '';
    $('view').querySelectorAll('[data-st]').forEach(x => x.setAttribute('aria-pressed', x.dataset.st === ''));
    $('view').querySelectorAll('[data-kd]').forEach(x => x.setAttribute('aria-pressed', x.dataset.kd === ''));
    data.staff.filter(usable).forEach(x => sel.add(x.id)); drawPeople();
    const ng = data.staff.filter(x => !usable(x)).length;
    toast(sel.size + '名を選びました' + (ng ? `（${method === 'LINE' ? 'LINE' : 'メール'}の登録がない${ng}名は送れません）` : ''), 3500);
  };
  $('allOff').onclick = () => { sel.clear(); drawPeople(); };
  ['bcSub','bcMsg'].forEach(id => $(id).oninput = () => LS.set('fb_bc_draft', { subject:$('bcSub').value, message:$('bcMsg').value }));
  drawPeople();
  $('bcSend').onclick = () => {
    const msg = { ids:[...sel], subject:$('bcSub').value.trim(), message:$('bcMsg').value.trim(), method, store };
    if (!msg.ids.length) { toast('送る相手を選んでください'); return; }
    if (!msg.subject || !msg.message) { toast('件名と内容を入れてください'); return; }
    const names = data.staff.filter(x => sel.has(x.id)).map(x => x.name);
    openSheet('この内容で送りますか？', `<dl class="review"><dt>送り方</dt><dd>${esc(method)}</dd><dt>相手（${names.length}名）</dt><dd>${esc(names.join('、'))}</dd>
      <dt>件名</dt><dd>${esc(msg.subject)}</dd><dt>内容</dt><dd>${esc(msg.message)}</dd></dl>`,
      `<button class="btn s" id="bcBack">戻って直す</button><button class="btn p" id="bcOk" style="--gc:var(--brand)">送信する</button>`);
    $('bcBack').onclick = closeSheet;
    $('bcOk').onclick = () => runAction(() => apiPost({ app:'broadcast', msg }), () => { LS.del('fb_bc_draft'); location.hash = '#/contact'; });
  };
}

/* ================= 設定 ================= */
function showSettings(){
  setTop({ title:'設定', back:true });
  const lineInfo = ME && ME.userId
    ? `<div class="box"><div><b>${esc(ME.name || '名前未登録')}</b> さん${isAdmin() ? '<span class="admin-mark">管理者</span>' : ''}</div>
       <div class="small">LINEでログインしています。</div>
       <div class="small" style="margin-top:8px">あなたのLINE ID：<code id="myId" style="word-break:break-all">${esc(ME.userId)}</code></div>
       <button class="btn s wide" id="copyId" style="margin-top:8px;min-height:44px">IDをコピー（登録の依頼用）</button></div>`
    : `<div class="box"><div class="small">${authError ? esc(authError) : 'LINEにはログインしていません。'}</div>${liffReady() && !idToken ? '<button class="btn s wide" style="margin-top:8px" onclick="lineLogin()">LINEでログイン</button>' : ''}</div>`;
  $('view').innerHTML = `<div class="sec-title">LINEのログイン</div>${lineInfo}
    <div class="sec-title">アプリキー（LINE以外で使うとき）</div>
    <div class="field"><label for="sKey">アプリキー</label>
      <input class="in" id="sKey" value="${esc(cfg.key)}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="管理者から聞いたキー">
      <div class="small" style="margin-top:6px">パソコンで管理者の機能（実績記録のチェックなど）を使うときは、管理者キーを入れてください。</div>
      <p class="small" style="margin:8px 0 0">この端末にだけ保存されます。</p></div>
    <details class="field"><summary class="small" style="cursor:pointer">接続先URL（通常は変更しません）</summary>
      <input class="in" id="sUrl" style="margin-top:10px" value="${esc(cfg.url)}"></details>
    <div class="stack" style="margin-top:8px">
      <button class="btn p wide" id="sSave" style="--gc:var(--brand)">保存して接続を確認</button>
    </div>
    <div class="sec-title">表示</div>
    <div class="stack" style="margin-top:0">
      <button class="btn s wide" id="sRefresh">帳票の一覧と入力欄を読み込み直す</button>
    </div>`;
  $('sSave').onclick = async () => {
    const next = { url: ($('sUrl').value.trim() || DEFAULT_URL), key: $('sKey').value.trim() };
    if (!next.key) { toast('アプリキーを入力してください'); return; }
    $('sSave').disabled = true;
    try { await api({ app:'ping' }, next); cfg = next; LS.set('fb_cfg', cfg); toast('つながりました'); if (!idToken) { try { ME = await api({ app:'me' }); authError = ''; } catch (e) {} } location.hash = '#/'; }
    catch (e) { openSheet('接続できませんでした', `<p>${esc(e.message)}</p>`, '<button class="btn p wide" id="eOk">閉じる</button>'); $('eOk').onclick = closeSheet; }
    finally { $('sSave').disabled = false; }
  };
  if ($('copyId')) $('copyId').onclick = async () => {
    try { await navigator.clipboard.writeText(ME.userId); toast('コピーしました'); } catch (e) { toast('コピーできませんでした。長押しで選択してください'); }
  };
  $('sRefresh').onclick = () => {
    LS.keys().filter(k => k.indexOf('fb_fields_') === 0 || k.indexOf('fb_forms_') === 0).forEach(k => LS.del(k));
    toast('読み込み直します'); location.hash = '#/';
  };
}

$('view').innerHTML = '<div class="empty">準備しています…</div>';
/* 事業所のQRコード（https://liff.line.me/…?qr=合言葉）から開いたとき */
/* リッチメニューなどから ?go=画面 で開いたとき */
const GO_MAP = { attend:'#/attend', home:'#/', deadlines:'#/deadlines', sougei:'#/sougei', contact:'#/contact', manual:'#/manual', info:'#/info', mybook:'#/mybook', records:'#/drafts' };
function takeGoFromUrl(){
  const sp = new URLSearchParams(location.search);
  let go = sp.get('go');
  if (!go && sp.get('liff.state')) go = new URLSearchParams(decodeURIComponent(sp.get('liff.state')).replace(/^[^?]*\?/, '')).get('go');
  if (!go || !GO_MAP[go]) return;
  sp.delete('go'); if (!sp.get('qr')) sp.delete('liff.state');
  history.replaceState(null, '', location.pathname + (sp.toString() ? '?' + sp : '') + GO_MAP[go]);
}
function takeQrFromUrl(){
  const sp = new URLSearchParams(location.search);
  let qr = sp.get('qr');
  if (!qr && sp.get('liff.state')) qr = new URLSearchParams(decodeURIComponent(sp.get('liff.state')).replace(/^[^?]*\?/, '')).get('qr');
  if (!qr) return;
  try { sessionStorage.setItem('fb_qr', JSON.stringify({ tk: qr, at: Date.now() })); } catch (e) {}
  sp.delete('qr'); sp.delete('liff.state');
  history.replaceState(null, '', location.pathname + (sp.toString() ? '?' + sp : '') + '#/attend');
}
AUTH = initAuth().finally(() => { authPending = false; setTimeout(pcSync, 0); });
setTimeout(pcSync, 0);
if (CACHED_ME && !/[?&](qr|liff\.state)=/.test(location.search)) {
  // 前回のログイン情報で先に画面を出し、確認が終わったら必要なときだけ描き直す
  ME = CACHED_ME; takeGoFromUrl(); route();
  AUTH.then(() => { if (authError || JSON.stringify(ME) !== JSON.stringify(CACHED_ME)) route(); });
} else AUTH.then(() => { takeGoFromUrl(); takeQrFromUrl(); route(); });
</script>
