  return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = () => rej(new Error('部品を読み込めませんでした。電波の良い場所でお試しください')); document.head.appendChild(sc); });
}
/* どんな録音でも、16kHz・モノラル・32kbps の mp3 にそろえる（小さく、Geminiが読める形） */
async function toMp3(blob, onProg){
  await loadScript('https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', () => window.lamejs && lamejs.Mp3Encoder);
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC({ sampleRate: 16000 });
  const ab = await new Response(blob).arrayBuffer();
  const buf = await new Promise((res, rej) => ac.decodeAudioData(ab, res, () => rej(new Error('この音声ファイルは読み込めませんでした（別の形式で保存してお試しください）'))));
  try { ac.close(); } catch (e) {}
  let pcm = buf.getChannelData(0);
  if (buf.numberOfChannels > 1) { const r = buf.getChannelData(1); const m = new Float32Array(pcm.length); for (let i = 0; i < pcm.length; i++) m[i] = (pcm[i] + r[i]) / 2; pcm = m; }
  let rate = buf.sampleRate;
  if (rate !== 16000) { // 念のため間引き
    const k = rate / 16000, out = new Float32Array(Math.floor(pcm.length / k));
    for (let i = 0; i < out.length; i++) out[i] = pcm[Math.floor(i * k)];
    pcm = out; rate = 16000;
  }
  const enc = new lamejs.Mp3Encoder(1, 16000, 32);
  const chunks = [], block = 1152 * 20, s16 = new Int16Array(block);
  for (let i = 0; i < pcm.length; i += block) {
    const n = Math.min(block, pcm.length - i);
    for (let j = 0; j < n; j++) { const v = Math.max(-1, Math.min(1, pcm[i + j])); s16[j] = v < 0 ? v * 0x8000 : v * 0x7fff; }
    const mp3 = enc.encodeBuffer(n === block ? s16 : s16.subarray(0, n));
    if (mp3.length) chunks.push(mp3);
    if (onProg && i % (block * 50) === 0) { onProg(i / pcm.length); await new Promise(r => setTimeout(r)); }
  }
  const end = enc.flush(); if (end.length) chunks.push(end);
  return { blob: new Blob(chunks, { type:'audio/mpeg' }), sec: pcm.length / 16000 };
}
const blobToB64 = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = () => rej(new Error('音声を読み込めませんでした')); fr.readAsDataURL(b); });
const fmtSec = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

function openVoice(sheet){

async function startVoice(){

let BOOK = null;
async function showBook(name){

    const list = items.filter(it => it.sec === sc && show(it));
    if (!list.length) return;
    const all = items.filter(it => it.sec === sc), dn = all.filter(it => (d.results[it.row] || {}).v).length;
    html += `<details class="tk-sec"${TK_FILTER !== 'all' || si === 0 ? ' open' : ''}><summary><b>${esc(sc)}</b><span class="small">${dn}/${all.length}</span></summary>${list.map(it => {
      const r = d.results[it.row] || { v:'', docs:[], memo:'' };
      return `<div class="tk-item${r.v === '否' ? ' ng' : r.v ? ' ok' : ''}" id="tk${it.row}">${it.grp ? `<div class="small" style="font-weight:700">${esc(it.grp)}</div>` : ''}
        <div class="tk-text">${esc(it.text)}</div>${it.law ? `<div class="small" style="margin-top:2px">${esc(it.law)}</div>` : ''}
        <div class="tk-btns">${['適','否','－'].map(o => `<button class="chip" data-tv="${it.row}" data-o="${o}" aria-pressed="${r.v === o}" style="--gc:${o === '適' ? 'var(--g1)' : o === '否' ? 'var(--err)' : 'var(--sub)'}">${o === '－' ? '該当なし' : o}</button>`).join('')}</div>
        <div class="small" style="margin-top:6px">関係書類（そろっているものを押す）</div><div class="chips">${it.docs.map((dc, k) => `<button class="chip mini" data-td="${it.row}" data-k="${k}" aria-pressed="${(r.docs || []).includes(dc)}" style="--gc:var(--g2)">${esc(dc)}</button>`).join('')}</div>
        ${r.v === '否' ? `<input class="in" data-tm="${it.row}" placeholder="否の理由・改善すること（メモ）" value="${esc(r.memo || '')}" style="margin-top:8px">` : ''}</div>`;
    }).join('')}</details>`;
  });
  html += `<div class="bar"><span class="saved">入力は自動で下書き保存されます</span><button class="btn s" id="tkSaveOnly" style="min-height:48px">保存</button><button class="btn p" id="tkPdf" style="--gc:var(--brand)">保存してPDF</button></div></div>`;
  $('view').innerHTML = html;
  const v = $('view');
  ['tkOffice','tkChecker','tkDate'].forEach(id => $(id).oninput = () => { d.office = $('tkOffice').value.trim(); d.checker = $('tkChecker').value.trim(); d.date = $('tkDate').value; tkSave(); });
  v.querySelectorAll('[data-tf]').forEach(b => b.onclick = () => { TK_FILTER = b.dataset.tf; drawTenken(); });
  v.querySelectorAll('[data-tv]').forEach(b => b.onclick = () => {
    const r = R(b.dataset.tv); r.v = r.v === b.dataset.o ? '' : b.dataset.o;
    if (r.v === '適' && !(r.docs || []).length) { const it = items.find(x => String(x.row) === b.dataset.tv); r.docs = it.docs.slice(); }
    tkSave(); const y = window.scrollY; drawTenken(); window.scrollTo(0, y);
  });
  v.querySelectorAll('[data-td]').forEach(b => b.onclick = () => {
    const it = items.find(x => String(x.row) === b.dataset.td); const r = R(it.row); const dc = it.docs[Number(b.dataset.k)];
    r.docs = (r.docs || []).includes(dc) ? r.docs.filter(x => x !== dc) : (r.docs || []).concat(dc);
    b.setAttribute('aria-pressed', r.docs.includes(dc)); tkSave();
  });
  v.querySelectorAll('[data-tm]').forEach(i => i.oninput = () => { R(i.dataset.tm).memo = i.value; tkSave(); });
  if ($('tkAllOk')) $('tkAllOk').onclick = () => confirmSheet('未点検をすべて「適」にする', 'まだ選んでいない項目を、すべて「適」にします（関係書類もそろっている扱いにします）。あとで個別に直せます。', '「適」にする', () => {
    items.forEach(it => { const r = R(it.row); if (!r.v) { r.v = '適'; r.docs = it.docs.slice(); } }); tkSave(); closeSheet(); drawTenken();
  });
  $('tkClear').onclick = () => confirmSheet('点検をやり直す', 'すべての項目の結果を空にします。', '空にする', () => { d.results = {}; TK.fromLast = ''; tkSave(); closeSheet(); drawTenken(); }, true);
  const save = pdf => {
    if (!d.office || !d.checker || !d.date) { toast('事業所名・点検者・点検年月日を入れてください'); return; }
    const left = items.length - items.filter(it => (d.results[it.row] || {}).v).length;
    const go = () => runAction(() => apiPost({ app:'tenkenSave', pdf: pdf ? '1' : '', data: JSON.stringify(d) }), r => { if (r.pdf) msgSheet('PDFを保存しました', r.pdf.name || ''); LS.del(tkKey()); TK.fromLast = ''; });
    if (left) confirmSheet('未点検の項目があります', `まだ ${left}項目 が未点検です（空欄のままPDFに出ます）。このまま保存しますか？`, '保存する', () => { closeSheet(); go(); }); else go();
  };
  $('tkSaveOnly').onclick = () => save(false);
  $('tkPdf').onclick = () => save(true);
}

      <input class="in" id="mtMails" style="margin-top:8px" placeholder="ほかのメールアドレス（任意）"></div>
    <p class="small">Google Meet のURLを作り、参加者にメール、LINEグループにお知らせします。</p>`,
    `<button class="btn s" id="mtCancel">やめる</button><button class="btn p" id="mtOk" style="--gc:var(--brand)">作成する</button>`);
  const mark = () => $('bsBody').querySelectorAll('[data-min]').forEach(x => x.setAttribute('aria-pressed', x.dataset.min === $('mtMin').value));
  $('bsBody').querySelectorAll('[data-min]').forEach(b => b.onclick = () => { $('mtMin').value = b.dataset.min; mark(); });
  $('mtMin').oninput = mark;
  const count = () => { $('mtN').textContent = picked.size + '人'; };
  $('bsBody').querySelectorAll('[data-pp]').forEach(b => b.onclick = () => { const i = Number(b.dataset.pp); picked.has(i) ? picked.delete(i) : picked.add(i); b.setAttribute('aria-pressed', picked.has(i)); count(); });
  if ($('mtAll')) $('mtAll').onclick = () => { const all = picked.size < people.length; people.forEach((_, i) => all ? picked.add(i) : picked.delete(i)); $('bsBody').querySelectorAll('[data-pp]').forEach(b => b.setAttribute('aria-pressed', picked.has(Number(b.dataset.pp)))); count(); };
  $('mtCancel').onclick = closeSheet;
  $('mtOk').onclick = () => {
    const emails = [...picked].map(i => people[i].email).concat($('mtMails').value.split(/[,、\s]+/).map(x => x.trim()).filter(x => /@/.test(x)));

    runAction(() => apiPost({ app:'meetingCreate', meeting:m }), reload);
  };
}

      + (done.length ? `<details style="margin-top:6px"><summary class="small" style="cursor:pointer">完了済み（最近${done.length}件）</summary>${done.map(row).join('')}</details>` : '')

        <div class="field" style="padding:0"><label for="tkWho">担当</label><input class="in" id="tkWho" value="${esc((ME && ME.name) || '')}"></div>
        <div class="field" style="padding:0"><label for="tkEnd">期限</label><input class="in" id="tkEnd" type="date"></div>`,
        `<button class="btn s" id="tkCancel">やめる</button><button class="btn p" id="tkOk" style="--gc:var(--brand)">追加する</button>`);
      $('tkCancel').onclick = closeSheet;

        if (!t.text) { toast('内容を入れてください'); return; }

}

/* ===== 在庫 ===== */
let STOCK = null;
async function showStock(){
  setTop({ title:'災害時の備蓄品', back:true });
  const token = viewToken;
  STOCK = LS.get('fb_stock', null);
  const draw = () => {
    if (token !== viewToken) return;
    const items = (STOCK && STOCK.items) || [];
    const canScan = !!(window.liff && liff.id && liff.isInClient && liff.isInClient() && liff.scanCodeV2);
    $('view').innerHTML = `<div class="g3" style="padding-top:12px">
      ${canScan ? `<button class="btn p wide" id="scan" style="margin-bottom:10px">QRコードを読み取る</button>` : `<p class="small">LINEアプリから開くと、QRコードの読み取りが使えます。</p>`}
      <label class="search" style="margin-top:0">${ICON.search}<input id="sq" type="search" placeholder="品名でさがす" aria-label="品名でさがす"></label>
      <div class="chips" style="margin:8px 0 12px"><button class="chip mini" id="expOnly" aria-pressed="false">期限が近いもの</button></div>
      <div id="slist">${STOCK ? '' : '<div class="empty">読み込んでいます…</div>'}</div></div>`;
    let expOnly = false;
    const list = () => {
      const q = ($('sq').value || '').trim();
      const xs = items.filter(x => (!q || x.name.includes(q)) && (!expOnly || x.expSoon));
      $('slist').innerHTML = STOCK ? (xs.length ? xs.map(x => `<button class="list-item" data-it="${esc(x.name)}" style="width:100%;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer">
        ${x.img && /^https?:/.test(x.img) ? `<img class="sthumb" src="${esc(driveImg(x.img, 200))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : '<span class="sthumb"></span>'}
        <div class="main"><div class="t" style="font-weight:400">${esc(x.name)}</div>
        <div class="m">${x.exp ? `期限 <span class="${x.expSoon ? 'red' : ''}">${esc(x.exp)}</span>` : ''}</div></div>
        <span class="stock-n${x.stock <= 0 ? ' red' : ''}">${x.stock}</span></button>`).join('') : '<div class="empty">該当する品目はありません。</div>') : '';
      $('slist').querySelectorAll('[data-it]').forEach(b => b.onclick = () => openMove(b.dataset.it));
    };
    $('sq').oninput = list;
    $('expOnly').onclick = () => { expOnly = !expOnly; $('expOnly').setAttribute('aria-pressed', expOnly); list(); };
    if ($('scan')) $('scan').onclick = scanStock;
    list();
  };
  draw();
  try { STOCK = await api({ app:'stock' }); LS.set('fb_stock', STOCK); const q = $('sq') && $('sq').value; draw(); if (q) { $('sq').value = q; $('sq').dispatchEvent(new Event('input')); } }
  catch (e) { if (token === viewToken && !STOCK) $('slist').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
}

async function scanStock(){
  try {
    const r = await liff.scanCodeV2();
    const text = (r && r.value) || '';
    let name = '', dir = '';
    try { const u = new URL(text); name = u.searchParams.get('name') || ''; dir = u.searchParams.get('action') || ''; } catch (e) { name = text; }
    if (!name) { toast('この QRコードは在庫のものではありません'); return; }
    openMove(name, dir === 'out' ? 'out' : 'in');
  } catch (e) { msgSheet('読み取れませんでした', 'LINE Developers の LIFF 設定で「Scan QR」をオンにしてください。（' + (e.message || e) + '）'); }
}

function openMove(name, dir){
  const it = ((STOCK && STOCK.items) || []).find(x => x.name === name.replace(/\s+/g, ' ').trim());
  if (!it) { toast('在庫が見つかりません：' + name); return; }
  let d = dir || 'out', n = 1;
  openSheet(it.name, `${it.img && /^https?:/.test(it.img) ? `<img src="${esc(driveImg(it.img, 800))}" alt="" style="width:100%;max-height:200px;object-fit:contain;border-radius:var(--r-s);background:var(--soft);margin-bottom:10px" onerror="this.remove()">` : ''}<div class="small">今の在庫 <b style="font-size:18px;color:var(--ink)">${it.stock}</b>${it.exp ? '　期限 ' + esc(it.exp) : ''}</div>
    <div class="chips" style="margin-top:12px"><button class="chip" data-d="in" style="--gc:var(--g1)">入庫（増やす）</button><button class="chip" data-d="out" style="--gc:var(--g4)">出庫（使う）</button></div>
    <div class="stepper"><button type="button" id="mMinus" aria-label="1つ減らす">−</button><input id="mQty" type="number" inputmode="numeric" min="1" value="1" aria-label="数量"><button type="button" id="mPlus" aria-label="1つ増やす">＋</button></div>`,
    `<button class="btn s" id="mvCancel">やめる</button><button class="btn p" id="mvOk" style="--gc:var(--brand)">記録する</button>`, 'g3');
  const sync = () => {
    $('bsBody').querySelectorAll('[data-d]').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === d));
    $('mvOk').textContent = (d === 'in' ? '入庫' : '出庫') + 'を記録する';
  };
  $('bsBody').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { d = b.dataset.d; sync(); });
  $('mMinus').onclick = () => { n = Math.max(1, (Number($('mQty').value) || 1) - 1); $('mQty').value = n; };
  $('mPlus').onclick = () => { n = (Number($('mQty').value) || 0) + 1; $('mQty').value = n; };
  $('mvCancel').onclick = closeSheet;
  $('mvOk').onclick = () => {
    n = Number($('mQty').value);
    if (!(n > 0)) { toast('数量を入れてください'); return; }
    if (d === 'out' && n > it.stock) { toast('在庫より多くは出庫できません'); return; }
    runAction(() => api({ app:'stockMove', name:it.name, dir:d, qty:n }), j => { it.stock = j.stock ?? it.stock; LS.set('fb_stock', STOCK); if (location.hash.indexOf('#/stock') === 0) showStock(); });
  };
  sync();
}

      ${data.stores.length > 1 ? `<div class="chips" style="margin-bottom:10px"><button type="button" class="chip mini" data-st="" aria-pressed="true">すべての店舗</button>${data.stores.map(st => `<button type="button" class="chip mini" data-st="${esc(st)}" aria-pressed="false">${esc(st)}</button>`).join('')}</div>` : ''}
      ${kinds.length > 1 ? `<div class="chips" style="margin-bottom:10px">${KF.map(([k, l]) => `<button type="button" class="chip mini" data-kd="${esc(k)}" aria-pressed="${k === ''}">${esc(l)}</button>`).join('')}</div>` : ''}
      <div class="chips" style="margin-bottom:10px"><button type="button" class="chip mini" id="allOn">表示中を全員選ぶ</button><button type="button" class="chip mini" id="allOff">選択を外す</button><button type="button" class="chip mini" id="allEvery" style="--gc:var(--err);border-color:var(--err);color:var(--err)">全員を選ぶ（災害時など）</button></div>
      <div class="chips" id="people"></div></div>

    <div class="field"><label for="bcMsg">内容</label><textarea class="in" id="bcMsg">${esc(draft.message || '')}</textarea></div>
    <div class="bar"><span class="saved"></span><button class="btn p" id="bcSend">送信内容を確認</button></div></div>`;
  const visible = () => data.staff.filter(x => (!store || x.store === store) && (!kind || (kind === '@staff' ? x.kind !== '利用者' : x.kind === kind)));
  const usable = x => method === 'LINE' ? x.line : method === 'メール' ? x.mail : (x.line || x.mail);
  const drawPeople = () => {
    $('people').innerHTML = visible().map(x => `<button type="button" class="chip" data-id="${esc(x.id)}" aria-pressed="${sel.has(x.id)}" ${usable(x) ? '' : 'disabled style="opacity:.45"'}>${esc(x.name)}<span class="small" style="color:inherit;opacity:.75">　${esc(x.kind)}</span></button>`).join('');
    $('people').querySelectorAll('[data-id]').forEach(b => b.onclick = () => { sel.has(b.dataset.id) ? sel.delete(b.dataset.id) : sel.add(b.dataset.id); drawPeople(); });
    $('selN').textContent = sel.size + '名を選択中';
  };
  $('view').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { method = b.dataset.m; $('view').querySelectorAll('[data-m]').forEach(x => x.setAttribute('aria-pressed', x === b)); drawPeople(); });

    openSheet('この内容で送りますか？', `<dl class="review"><dt>送り方</dt><dd>${esc(method)}</dd><dt>相手（${names.length}名）</dt><dd>${esc(names.join('、'))}</dd>

    $('bcBack').onclick = closeSheet;
    $('bcOk').onclick = () => runAction(() => apiPost({ app:'broadcast', msg }), () => { LS.del('fb_bc_draft'); location.hash = '#/contact'; });
  };
}

  };
  if ($('copyId')) $('copyId').onclick = async () => {
    try { await navigator.clipboard.writeText(ME.userId); toast('コピーしました'); } catch (e) { toast('コピーできませんでした。長押しで選択してください'); }
  };
  $('sRefresh').onclick = () => {
    LS.keys().filter(k => k.indexOf('fb_fields_') === 0 || k.indexOf('fb_forms_') === 0).forEach(k => LS.del(k));
    toast('読み込み直します'); location.hash = '#/';
  };
}

$('view').innerHTML = '<div class="empty">準備しています…</div>';
/* 事業所のQRコード（https://liff.line.me/…?qr=合言葉）から開いたとき */
function takeQrFromUrl(){
  const sp = new URLSearchParams(location.search);
  let qr = sp.get('qr');
  if (!qr && sp.get('liff.state')) qr = new URLSearchParams(decodeURIComponent(sp.get('liff.state')).replace(/^[^?]*\?/, '')).get('qr');
  if (!qr) return;
  try { sessionStorage.setItem('fb_qr', JSON.stringify({ tk: qr, at: Date.now() })); } catch (e) {}
  sp.delete('qr'); sp.delete('liff.state');
  history.replaceState(null, '', location.pathname + (sp.toString() ? '?' + sp : '') + '#/attend');
}
initAuth().then(() => { takeQrFromUrl(); route(); });
</script>
